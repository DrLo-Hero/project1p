// Dismiss only when the dark backdrop itself is tapped — never a child of it.
$('#sheet').addEventListener('click', ev => { if (ev.target.id === 'sheet') closeSheet(); });


// ---------- workspaces: halves and thirds ----------
// On a tablet or wall a workspace is laid out like Home's slides: one screen, its cards in
// two or three columns that each run to the bottom, so nothing is left as an empty strip.
// Cards are dealt in reading order to the shortest column; a column scrolls on its own
// when its cards are long. A control sitting between cards travels with the card under it.
// Habits are one kind of card repeated, so they take an even grid instead. Phones keep the
// single column. ponytail: heights are measured once, before the deal, at the full width;
// good enough to balance, re-measure per column if a view ever needs it exact.
const WIDE_Q = '(min-width: 900px) and (min-height: 560px)';
function boardify(colScroll) {
  const w = document.querySelector('#main > div');
  if (!w || !w.children || !w.querySelectorAll || !window.matchMedia || !matchMedia(WIDE_Q).matches) return;
  const kids = [...w.children];
  const first = kids.findIndex(k => k.classList.contains('card'));
  if (first < 0) return;
  if (S.tab === 'habits') {
    w.classList.add('wsgrid');
    // The last row is never left with a hole: its final card takes the cells that remain.
    const cards = kids.filter(k => k.classList.contains('card'));
    const cols = getComputedStyle(w).gridTemplateColumns.split(' ').length || 1;
    const rem = cards.length % cols;
    if (rem && cards.length) cards[cards.length - 1].style.gridColumn = 'span ' + (cols - rem + 1);
    $('#main').classList.add('wspad');
    return;
  }
  const cols = dealColumns(w, kids, first, innerWidth >= 1300 ? 3 : 2);
  w.classList.add('ws');
  $('#main').classList.add('wsmode');
  (colScroll || []).forEach((y, i) => { if (cols[i]) cols[i].scrollTop = y; });
}

/** Deal a container's cards into n columns (fewer when there are fewer cards; two when one
    card dominates). Each card brings any control sitting just above it; what trails the
    last card becomes a footer row. Returns the columns. */
function dealColumns(w, kids, first, n) {
  // Units: each card with any control just above it; what trails the last card is a footer.
  const last = kids.map(k => k.classList.contains('card')).lastIndexOf(true);
  const units = [];
  let pend = [];
  kids.slice(first, last + 1).forEach(k => {
    if (k.classList.contains('card')) { units.push(pend.concat(k)); pend = []; } else pend.push(k);
  });
  const foot = kids.slice(last + 1);
  const hs = units.map(u => u.reduce((s, k) => s + k.offsetHeight, 0));
  const total = hs.reduce((s, x) => s + x, 0) || 1;
  // One card dominating a few: it gets a half, the rest the other. With more cards than that,
  // the rest keep two columns of their own, so the long one never crowds them into a corner.
  if (Math.max(...hs) > total * 0.55 && units.length <= 3) n = Math.min(n, 2);
  n = Math.max(1, Math.min(n, units.length));
  const grid = document.createElement('div');
  grid.className = 'bcols';
  grid.style.setProperty('--n', n);
  const cols = Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'bcol'; grid.appendChild(c); return c; });
  const fill = cols.map(() => 0);
  units.forEach((u, i) => {
    const c = fill.indexOf(Math.min(...fill));
    if (u.length > 1) {
      const box = document.createElement('div');
      box.className = 'unit';
      u.forEach(k => box.appendChild(k));
      cols[c].appendChild(box);
    } else cols[c].appendChild(u[0]);
    fill[c] += hs[i];
  });
  w.insertBefore(grid, foot[0] || null);
  if (foot.length) {
    const f = document.createElement('div');
    f.className = 'bfoot';
    foot.forEach(k => f.appendChild(k));
    w.appendChild(f);
  }
  return cols;
}

// ---------- windows: the same layout, in a pop-up ----------
// On a tablet or wall a sheet is a centred window, not a drawer. A window made of cards
// (a day, a goal, a habit, Settings, a review) opens wide and deals its cards into halves
// or thirds, every column running to the bottom; a form opens as a compact panel the size
// of the form. Sheets redraw themselves as you tick things, so the layout is re-applied
// whenever fresh cards appear (cards already dealt are not looked at again).
function layoutSheet() {
  const body = document.getElementById('sheetBody'), inner = document.getElementById('sheetInner');
  if (!body || !inner || !inner.children || !body.classList || !window.matchMedia) return;
  const wide = matchMedia(WIDE_Q).matches;
  const kids = [...inner.children], first = kids.findIndex(k => k.classList.contains('card'));
  const board = wide && kids.filter(k => k.classList.contains('card')).length >= 2;
  body.classList.toggle('sheet-board', board);
  // A long form gets a wider window and two columns. Each label keeps its control and any
  // hint under it in one group, so a field is never split across the columns.
  const labels = kids.filter(k => k.matches && k.matches('label.f'));
  const two = wide && !board && labels.length >= 6;
  body.classList.toggle('sheet-form', wide && !board && !two);
  body.classList.toggle('sheet-form2', two);
  if (two) {
    let grp = null;
    kids.forEach(k => {
      if (k.matches('label.f')) { grp = document.createElement('div'); grp.className = 'fld'; inner.insertBefore(grp, k); }
      else if (k.classList.contains('btn')) grp = null; // the actions sit across the foot
      if (grp) grp.appendChild(k);
    });
  }
  if (!board) return;
  // The wide window is sized first, so the deal can read its real width.
  dealColumns(inner, kids, first, inner.clientWidth >= 1050 ? 3 : 2);
}
let sheetRaf = 0;
if (window.MutationObserver && document.getElementById) {
  const sb = document.getElementById('sheetBody');
  if (sb && sb.nodeType) new MutationObserver(() => {
    const inner = document.getElementById('sheetInner');
    // Only fresh, undealt cards need a layout; after the deal there are none, so no loop.
    if (!inner || !inner.querySelector || !inner.querySelector(':scope > .card, :scope > label.f')) return;
    cancelAnimationFrame(sheetRaf);
    sheetRaf = requestAnimationFrame(layoutSheet);
  }).observe(sb, { childList: true, subtree: true });
}
// A resize can change the column count; repaint the workspace once it settles.
let boardT = null;
if (window.addEventListener) addEventListener('resize', () => {
  clearTimeout(boardT);
  boardT = setTimeout(() => { if (S.tab !== 'dash' && !$('#sheet').classList.contains('open')) render(); }, 180);
});

// ---------- live: the clock, the minute, reminders, display mode ----------
// A wall calendar is only useful if it is right without being touched. The clock text
// updates in place; once a minute Today repaints (quietly, keeping the scroll) so now,
// next and the red line move with the day, unless a sheet is open or the page is hidden.
let lastMin = -1;
const fired = new Set();
function liveTick() {
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  const c = document.getElementById('hClock');
  if (c) c.innerHTML = clockHTML(n);
  if (m === lastMin) return;
  const first = lastMin < 0;
  lastMin = m;
  if (DB.prefs.remind) remindAt(m);
  sceneTick();
  loadWx(); // no-op until 30 minutes have passed
  if (!first && S.tab === 'dash' && document.visibilityState !== 'hidden' && !$('#sheet').classList.contains('open')) {
    S.keepScroll = $('#main').scrollTop; S.quiet = true; render();
  }
}

// ponytail: reminders fire while the app is open (a tablet in Display mode, or the phone
// in hand). With the app closed they need Web Push, which needs a server this app doesn't have.
function remindAt(m) {
  const d = today();
  R.dueReminders(briefData().sched.placed, m, 10).forEach(r => {
    const key = d + '|' + r.key;
    if (fired.has(key)) return;
    fired.add(key);
    toast(r.text);
    try {
      if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker)
        navigator.serviceWorker.ready.then(reg => reg.showNotification('Project 1%', { body: r.text, tag: key, icon: 'icon-192.png' })).catch(() => {});
    } catch (e) { /* the toast already said it */ }
  });
}

async function toggleRemind() {
  if (DB.prefs.remind) { DB.prefs.remind = false; save(); return; }
  try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) {}
  DB.prefs.remind = true; save();
  toast('Reminders on: 10 minutes before, and as each thing starts.');
}

// Display mode: full screen, no chrome, the screen kept awake. For a tablet on the wall
// or the kitchen counter. The wake lock drops whenever the page hides, so it is taken again
// each time it comes back.
let wake = null;
async function keepAwake() {
  try { if (S.kiosk && navigator.wakeLock && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function kiosk(on) {
  S.kiosk = on;
  document.body.classList[on ? 'add' : 'remove']('kiosk');
  try {
    const de = document.documentElement;
    if (on && de.requestFullscreen) de.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch (e) {}
  if (on) keepAwake();
  else if (wake) { wake.release().catch(() => {}); wake = null; }
  S.tab = 'dash'; S.anim = true; render();
}

// ---------- boot ----------
async function boot() {
  try { await start(); } catch (e) { showCrash('Startup failed', e); }
}

async function start() {
  $('#pills').innerHTML = pillsHTML();
  if (window.addEventListener) addEventListener('resize', placeThumbs);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeThumbs).catch(() => {});
  applyAccent();
  applyTheme();
  await planBoot().catch(e => showCrash('Plan', e)); // the rest of the app works without it
  await loadBundledPlan(false).catch(e => showCrash('Plan file', e));
  runAdapt();
  const deep = /^#tab=(\w+)/.exec(location.hash || ''); // a bookmarkable tab: …/#tab=habits
  if (deep && TITLES[deep[1]]) S.tab = deep[1];
  else if (deep && deep[1] === 'cal') { S.tab = 'dash'; S.slide = 0; }
  const deepSlide = /slide=(\d)/.exec(location.hash || ''); // …/#slide=1 opens Home on Today
  if (deepSlide) S.slide = Math.min(SLIDES.length - 1, Number(deepSlide[1]));
  const deepBrief = /brief=(goal|habit|task):([\w-]+)/.exec(location.hash || ''); // …/#brief=goal:p1g-cfa
  const signedIn = googleReturn();
  driveSync(); // in the background; takes the cloud copy (and reloads) if another device changed it
  if (gToken() && (signedIn || !DB.gsync.lastSync || Date.now() - DB.gsync.lastSync > 15 * 60000))
    syncGoogle(signedIn).catch(() => {}); // in the background: the app opens without waiting on Google
  if (DB.prefs.lockId) {
    lockScreen();
    if (await unlock()) { $('#tabs').style.display = ''; $('#fab').style.display = ''; render(); }
    return;
  }
  render();
  if (deepSlide) goSlide(S.slide); // the plan loader may have painted the deck before the hash was read
  liveTick();
  const live = setInterval(liveTick, 15000);
  if (live && live.unref) live.unref(); // Node (the smoke test) must still be able to exit
  document.addEventListener('visibilitychange', keepAwake);
  // Arrow keys move through Home's slides, like a presentation.
  document.addEventListener('keydown', e => {
    if (S.tab !== 'dash' || $('#sheet').classList.contains('open') || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goSlide(S.slide + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goSlide(S.slide - 1); }
  });
  // Auto follows the device live; a pinned theme ignores it.
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme); }
  loadWx();
  if (/display/.test(location.hash || '')) kiosk(true); // …/#display opens straight into Display mode
  if (!DB.prefs.onboarded) onboarding();
  else if (deepBrief) ({ goal: goalDetail, habit: habitBrief, task: taskBrief })[deepBrief[1]](deepBrief[2]);
}
boot();

if ('serviceWorker' in navigator) {
  // Every deploy changes sw.js, so checking it each time the app comes back to the front
  // finds the update; the new worker takes over and the page reloads onto the new code.
  // Never mid-sheet: that would throw away what you were typing, or a running timer.
  const hadSW = !!navigator.serviceWorker.controller; // the first install isn't an update
  let pending = false;
  const reloadIfSafe = () => { if (pending && !$('#sheet').classList.contains('open')) location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => { pending = hadSW; reloadIfSafe(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      reloadIfSafe();
      reg.update().catch(() => {});
    });
  }).catch(() => {});
}
</script>
