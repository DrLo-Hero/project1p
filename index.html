// ---------- Google Calendar + Gmail ----------
// Sign-in is Google's client-side OAuth redirect: no server, no client secret. The access
// token lasts an hour and stays in localStorage on this device only, never in a backup.
// ponytail: no refresh token without a server, so after an hour Sync asks you to tap
// Connect again (Google remembers the grant, so it's one tap). A server would remove that.
const GKEY = 'p1p.gtoken';
const GSCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/drive.appdata';
const CAL = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
const GMAIL = 'https://gmail.googleapis.com/gmail/v1/users/me/messages';
const tzName = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/New_York'; } catch (e) { return 'America/New_York'; } };

function gToken() {
  try { const t = JSON.parse(localStorage.getItem(GKEY) || 'null'); return t && t.exp > Date.now() + 60000 ? t.t : null; }
  catch (e) { return null; }
}
function googleConnect() {
  const id = (val('gClient') || DB.prefs.gClientId || '').trim();
  if (!/\.apps\.googleusercontent\.com$/.test(id)) { alert('Paste your OAuth client ID first (it ends in .apps.googleusercontent.com). Settings explains how to make one.'); return; }
  DB.prefs.gClientId = id; save();
  const state = uid();
  try { localStorage.setItem('p1p.gstate', state); } catch (e) {}
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
    client_id: id, redirect_uri: location.origin + location.pathname, response_type: 'token',
    scope: GSCOPES, include_granted_scopes: 'true', state }).toString();
}
/** Picks up the token Google hands back in the URL fragment. true when it arrived. */
function googleReturn() {
  const h = location.hash || '';
  if (!/access_token=|error=/.test(h)) return false;
  const p = new URLSearchParams(h.slice(1));
  let st = null;
  try { st = localStorage.getItem('p1p.gstate'); localStorage.removeItem('p1p.gstate'); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
  if (p.get('error')) { toast('Google sign-in was cancelled.'); return false; }
  if (!st || p.get('state') !== st) { toast('That Google sign-in did not start here. Tap Connect again.'); return false; }
  try { localStorage.setItem(GKEY, JSON.stringify({ t: p.get('access_token'), exp: Date.now() + (Number(p.get('expires_in')) || 3600) * 1000 })); } catch (e) {}
  DB.gsync.connected = true; save();
  return true;
}
async function gFetch(url, opt) {
  const t = gToken();
  if (!t) throw Object.assign(new Error('Not signed in to Google'), { auth: true });
  const r = await fetch(url, Object.assign({}, opt, { headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' } }));
  if (r.status === 401) { try { localStorage.removeItem(GKEY); } catch (e) {} throw Object.assign(new Error('Google sign-in expired: tap Connect'), { auth: true }); }
  if (r.status === 204 || r.status === 410) return null;
  if (!r.ok) throw new Error(`Google said ${r.status}: ${String(await r.text()).slice(0, 160)}`);
  return r.json();
}
async function gList(params) {
  let out = [], page = '';
  for (let i = 0; i < 5; i++) { // ponytail: 5 pages (~1,250 events) is plenty for one person's plan
    const j = await gFetch(CAL + '?' + new URLSearchParams(Object.assign({}, params, page ? { pageToken: page } : {})).toString());
    out = out.concat((j && j.items) || []);
    if (!j || !j.nextPageToken) break;
    page = j.nextPageToken;
  }
  return out;
}

/** The events the plan wants on your calendar, keyed by the record they come from. */
function gDesired(map) {
  const tz = tzName(), d0 = today(), out = [];
  const tag = key => ({ private: { p1src: 'project1', p1id: key } });
  const quiet = { useDefault: false, overrides: [] }; // the app does its own nudging
  const goalName = id => { const g = goalById(id); return g ? ' · ' + g.statement : ''; };
  const BYDAY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  liveHabits().filter(h => h.at && !h.gcalOff && R.minutesOf(h.at) != null).forEach(h => {
    let rule;
    if (h.schedule === 'daily') rule = 'RRULE:FREQ=DAILY';
    else if (h.schedule === 'monthly') rule = `RRULE:FREQ=MONTHLY;BYMONTHDAY=${h.monthDay || 1}`;
    else if ((h.weekdays || []).length) rule = 'RRULE:FREQ=WEEKLY;BYDAY=' + h.weekdays.map(w => BYDAY[w]).join(',');
    else return;
    let first = map[h.id] && map[h.id].first;
    if (!first) { first = d0; for (let i = 0; i < 31 && !R.isScheduled(h, first); i++) first = R.addDays(first, 1); }
    const a = R.minutesOf(h.at), dur = h.minutes || (h.kind === 'timer' ? h.target : 15) || 15;
    out.push({ key: h.id, first, start: `${first}T${h.at}`, body: {
      summary: `${h.icon || ''} ${h.name}`.trim(), description: 'Project 1% habit' + goalName(h.goalId),
      start: { dateTime: `${first}T${h.at}:00`, timeZone: tz }, end: { dateTime: `${first}T${R.hhmm(Math.min(a + dur, 1439))}:00`, timeZone: tz },
      recurrence: [rule], reminders: quiet, extendedProperties: tag(h.id) } });
  });
  const allDay = (key, date, summary, description) => out.push({ key, start: date, body: {
    summary, description, start: { date }, end: { date: R.addDays(date, 1) }, transparency: 'transparent', reminders: quiet, extendedProperties: tag(key) } });
  DB.tasks.filter(t => t.goalId && t.due && !t.gcalOff && (!t.done || (t.completedAt && R.daysBetween(t.completedAt, d0) <= 30)))
    .forEach(t => allDay(t.id, t.due, (t.done ? '✓ ' : '☐ ') + t.title, 'Project 1% task' + goalName(t.goalId) + (t.notes ? '\n\n' + t.notes : '')));
  DB.apps.filter(a => appOpen(a) && !a.gcalOff).forEach(a => {
    if (a.deadline) allDay('dl-' + a.id, a.deadline, `⏰ Deadline: ${a.org} · ${a.title}`, 'Project 1% application');
    if (a.nextDate && a.next) allDay('nx-' + a.id, a.nextDate, `→ ${a.org}: ${a.next}`, 'Project 1% application');
  });
  // Progress, where you'll see it: one all-day line on the last day of each week.
  const weeks = new Set(Object.keys(map).filter(k => k.startsWith('wk-')).map(k => k.slice(3)).filter(w => R.daysBetween(w, d0) <= 84));
  weeks.add(R.startOfWeek(d0));
  weeks.forEach(ws => {
    const we = R.addDays(ws, 6), end = we < d0 ? we : d0, n = R.daysBetween(ws, end) + 1;
    let done = 0, total = 0;
    liveHabits().forEach(h => { const r = R.completionRate(h, logValue, end, n); done += r.done; total += r.total; });
    const tasks = DB.tasks.filter(t => t.done && t.completedAt >= ws && t.completedAt <= we).length;
    const cfa = goalById('p1g-cfa'), tr = cfa && cfa.track && cfa.track.habits;
    let mins = 0;
    if (tr) for (let d = ws; d <= end; d = R.addDays(d, 1)) tr.forEach(x => { if (!x.dow || x.dow.includes(R.weekdayOf(d))) mins += logValue(x.id, d); });
    const trades = DB.trades.filter(t => t.date >= ws && t.date <= we).length;
    allDay('wk-' + ws, we, `📊 Week: habits ${total ? Math.round(done / total * 100) : 0}% · ${tasks} task${tasks === 1 ? '' : 's'} done` +
      (tr ? ` · CFA ${Math.round(mins / 6) / 10}h` : '') + ` · ${trades} trade${trades === 1 ? '' : 's'}`, 'Project 1% weekly progress, updated at every sync.');
  });
  return out;
}

async function gPush() {
  const g = DB.gsync, df = R.gcalDiff(gDesired(g.map), g.map);
  for (const d of df.inserts) {
    const ev = await gFetch(CAL, { method: 'POST', body: JSON.stringify(d.body) });
    g.map[d.key] = { eventId: ev.id, sig: df.sig(d.body), start: d.start, first: d.first };
  }
  for (const d of df.patches) {
    await gFetch(`${CAL}/${encodeURIComponent(d.eventId)}`, { method: 'PATCH', body: JSON.stringify(d.body) });
    Object.assign(g.map[d.key], { sig: df.sig(d.body), start: d.start });
  }
  for (const d of df.deletes) {
    if (d.key.startsWith('wk-')) continue; // past weeks' progress stays on the calendar
    await gFetch(`${CAL}/${encodeURIComponent(d.eventId)}`, { method: 'DELETE' });
    delete g.map[d.key];
  }
  g.pushed = Object.keys(g.map).length;
}

async function gMail() {
  const g = DB.gsync, seen = new Set(g.seen);
  const days = g.mailAt ? Math.max(1, Math.ceil((Date.now() - g.mailAt) / 864e5) + 1) : 30;
  const q = `newer_than:${days}d (application OR applying OR applied OR interview OR offer OR admission OR admitted OR assessment OR unfortunately OR "next steps" OR registration OR confirmed OR confirmation OR submission OR mentor) -category:promotions -category:social -category:forums`;
  const list = await gFetch(`${GMAIL}?` + new URLSearchParams({ q, maxResults: '50' }).toString());
  const out = [];
  for (const m of (list && list.messages) || []) {
    if (seen.has(m.id)) continue;
    // Metadata only: sender, subject and Google's snippet. The body is never fetched.
    const j = await gFetch(`${GMAIL}/${m.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject`);
    const hd = n => ((j.payload && j.payload.headers) || []).find(x => x.name.toLowerCase() === n) || {};
    const un = s => String(s || '').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&');
    out.push({ id: m.id, from: hd('from').value || '', subject: un(hd('subject').value), snippet: un(j.snippet), date: R.ymd(new Date(Number(j.internalDate) || Date.now())) });
    seen.add(m.id);
  }
  g.seen = [...seen].slice(-2000);
  g.mailAt = Date.now();
  return out;
}

/** A calendar change you made, as a proposal for the plan. */
function pullProposal(c) {
  const g = DB.gsync, m = g.map[c.key];
  const isApp = /^(dl|nx)-/.test(c.key), aid = isApp ? c.key.slice(3) : null;
  const rec = isApp ? DB.apps.find(a => a.id === aid) : (DB.tasks.find(t => t.id === c.key) || habitById(c.key));
  if (!rec || c.key.startsWith('wk-')) return null;
  const coll = isApp ? 'apps' : DB.tasks.includes(rec) ? 'tasks' : 'habits';
  const name = isApp ? `${rec.org} · ${c.key.startsWith('dl-') ? 'deadline' : rec.next}` : (rec.title || rec.name);
  const ref = `gcal|${c.key}|${c.start || 'deleted'}`;
  if (c.kind === 'deleted') {
    m.gone = true;
    return { ref, src: 'gcal', gkey: c.key, gdel: true, text: `You deleted “${name}” from Google Calendar. Keep it off the calendar? It stays in the plan.`,
      ops: [{ op: 'set', coll, id: rec.id, set: { gcalOff: true } }] };
  }
  m.start = c.start;
  const day = c.start.slice(0, 10);
  if (coll === 'habits') {
    const at = c.start.slice(11, 16);
    if (!at || at === rec.at) return null;
    return { ref, src: 'gcal', gkey: c.key, text: `You moved “${name}” to ${at} in Google Calendar. Move the habit to ${at}?`, ops: [{ op: 'set', coll, id: rec.id, set: { at } }] };
  }
  if (coll === 'tasks') return { ref, src: 'gcal', gkey: c.key, text: `You moved “${name}” to ${fmtDue(day)} in Google Calendar. Move it in the plan too, and keep it there?`,
    ops: [{ op: 'set', coll, id: rec.id, set: { due: day, pinned: true } }] };
  return { ref, src: 'gcal', gkey: c.key, text: `You moved “${name}” to ${fmtDue(day)} in Google Calendar. Change it in Applications?`,
    ops: [{ op: 'set', coll, id: rec.id, set: c.key.startsWith('dl-') ? { deadline: day } : { nextDate: day } }] };
}
function clashProposal(c) {
  const h = habitById(c.habitId);
  if (!h) return null;
  const mins = h.kind === 'timer' ? `${h.target} min of ` : '';
  const day = R.addDays(c.day, 1);
  return { ref: c.ref, src: 'gcal', text: `“${c.summary}” on ${fmtDue(c.day)} overlaps ${h.name} at ${h.at}. Add a make-up session on ${fmtDue(day)}?`,
    ops: [{ op: 'add', coll: 'tasks', rec: { id: 'mk-' + c.ref.replace(/[^a-z0-9]/gi, '').slice(-24), created: today(), done: false,
      title: `Make up ${mins}${h.name} (missed for ${c.summary})`, notes: '', due: day, dueTime: h.at, project: 'Study', priority: 1,
      goalId: h.goalId || null, habitId: h.id, deep: false, subtasks: [] } }] };
}

async function syncGoogle(manual) {
  if (!gToken()) { if (manual) googleConnect(); return; }
  const g = DB.gsync, tz = tzName(), items = [];
  g.busy = true;
  try {
    if (Object.keys(g.map).length) {
      const mine = await gList({ privateExtendedProperty: 'p1src=project1', showDeleted: 'true', maxResults: '250' });
      R.gcalPulled(mine, g.map, tz).forEach(c => items.push(pullProposal(c)));
    }
    const ahead = await gList({ timeMin: new Date().toISOString(), timeMax: new Date(Date.now() + 14 * 864e5).toISOString(), singleEvents: 'true', maxResults: '250' });
    R.gcalClashes(ahead, liveHabits(), today(), 14, tz).forEach(c => items.push(clashProposal(c)));
    items.push(...R.mailProposals(await gMail(), DB.apps, DB.tasks));
    if (g.pushOK) await gPush();
    else {
      const n = gDesired(g.map).length;
      items.push({ ref: 'gcal-first-push', src: 'gcal', text: `Put your plan on Google Calendar: ${n} events (habit blocks, goal tasks, application dates, and a weekly progress line). They stay in sync after this?`, ops: [{ op: 'gpush' }] });
    }
    const n = queueAdd(items.filter(Boolean));
    g.lastSync = Date.now(); g.err = null;
    if (manual) toast(n ? `${n} change${n === 1 ? '' : 's'} waiting for your approval.` : 'In sync. Nothing new.');
  } catch (e) {
    g.err = e.message;
    if (manual) toast(e.message);
  }
  g.busy = false;
  save(); render();
}

async function gRemoveAll() {
  const g = DB.gsync;
  for (const k of Object.keys(g.map)) {
    await gFetch(`${CAL}/${encodeURIComponent(g.map[k].eventId)}`, { method: 'DELETE' }).catch(e => { if (!/ 404/.test(e.message)) throw e; });
    delete g.map[k];
  }
  g.pushOK = false; g.pushed = 0; save();
}

// ---------- Drive sync ----------
// What you enter is also kept in your own Google Drive, in the hidden app folder that only
// this app's OAuth client can open. Nobody without your Google sign-in can read it, and
// every device you sign in on shares it. One file holds DB and the plan engine.
// Each device remembers which cloud copy it last matched (base). If only one side changed,
// that side wins. A device that has never synced takes the cloud copy. If both changed,
// the newer wins and the other is kept on this device (Settings → Backup), never lost.
// ponytail: whole-file last-write-wins plus one kept copy; merge per record if you often edit two devices offline.
const SKEY = 'p1p.sync', KEPT = 'p1p.sync.kept', DFILE = 'p1p-data.json';
const DRIVE = 'https://www.googleapis.com/drive/v3/files';
function syncState() { try { return JSON.parse(localStorage.getItem(SKEY) || '{}'); } catch (e) { return {}; } }
function setSync(o) { try { localStorage.setItem(SKEY, JSON.stringify(Object.assign(syncState(), o))); } catch (e) {} }
const hasKept = () => { try { return !!localStorage.getItem(KEPT); } catch (e) { return false; } };
let pushT = null;
/** Every local write lands here: mark it unsynced, push a few seconds after the last one. */
function changed() {
  setSync({ dirty: true, at: Date.now() });
  clearTimeout(pushT);
  if (gToken()) pushT = setTimeout(() => driveSync(), 4000);
}
function snapshot(at) {
  // The Face ID key belongs to this phone; on another device it would lock you out.
  return { at, db: Object.assign({}, DB, { prefs: Object.assign({}, DB.prefs, { lockId: null }) }), plan: localStorage.getItem(PKEY) };
}
async function driveSync() {
  if (!gToken() || driveSync.busy) return;
  driveSync.busy = true;
  try {
    flushSave();
    let st = syncState(), id = st.id, remote = null;
    if (!id) {
      const r = await gFetch(`${DRIVE}?spaces=appDataFolder&fields=files(id)&q=${encodeURIComponent(`name='${DFILE}'`)}`);
      id = r && r.files && r.files[0] && r.files[0].id;
    }
    if (id) try { remote = await gFetch(`${DRIVE}/${id}?alt=media`); }
    catch (e) {
      if (/ 404/.test(e.message)) id = null;         // deleted in Drive: write a new one
      else if (!(e instanceof SyntaxError)) throw e; // empty or broken file: write over it
    }
    const theirs = !!remote && remote.at !== st.base; // the cloud moved since this device matched it
    if (theirs && $('#sheet').classList.contains('open')) return; // never swap data under an open sheet
    if (theirs && (!st.base || !st.dirty || remote.at > (st.at || 0))) {
      // Keep what this device had first. If storage is full this throws and nothing is replaced.
      if (st.dirty || !st.base) localStorage.setItem(KEPT, JSON.stringify(snapshot(st.at || Date.now())));
      adopt(remote, id);
      return;
    }
    if (theirs) localStorage.setItem(KEPT, JSON.stringify(remote)); // both changed; this side is newer
    if (remote && !theirs && !st.dirty) { setSync({ id, err: null, last: Date.now() }); return; }
    const snap = snapshot(st.at || Date.now());
    if (!id) id = (await gFetch(DRIVE, { method: 'POST', body: JSON.stringify({ name: DFILE, parents: ['appDataFolder'] }) })).id;
    await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', body: JSON.stringify(snap) });
    // An edit made during the upload is still unsynced.
    setSync({ id, base: snap.at, dirty: syncState().at !== snap.at, err: null, last: Date.now() });
  } catch (e) {
    setSync({ err: / 403/.test(e.message) ? 'Drive sync needs permission: turn on the Google Drive API in Google Cloud, then tap Reconnect.' : e.message });
  } finally { driveSync.busy = false; }
}
function adopt(remote, id) {
  clearTimeout(saveTimer); saveTimer = null; clearTimeout(pushT);
  const lockId = DB.prefs.lockId;
  DB = Object.assign(JSON.parse(JSON.stringify(BLANK)), remote.db);
  DB.prefs = Object.assign({}, BLANK.prefs, DB.prefs, { lockId });
  localStorage.setItem(KEY, JSON.stringify(DB));
  if (remote.plan) localStorage.setItem(PKEY, remote.plan); else localStorage.removeItem(PKEY);
  setSync({ id, base: remote.at, at: remote.at, dirty: false, err: null, last: Date.now() });
  dropIndex();
  location.reload(); // the plan engine and every view start from storage
}

  const when = fmt(g.lastSync);
  return `<div class="card"><h2>${ic('calendar')} Google sign-in, Drive sync, Calendar and Gmail</h2>
    <p class="hint">${on ? 'Signed in.' : g.connected ? 'Signed out: Google sign-ins last an hour. Tap Connect.' : 'Not signed in. Your data is only on this device.'}
      Drive: ${ds.dirty ? 'changes waiting to upload' : 'up to date'}, last synced ${esc(fmt(ds.last))}.

      <br>Calendar last sync: ${esc(when)}${g.pushed ? ` · ${g.pushed} events on your calendar` : ''}.

    <label class="f">OAuth client ID</label>

/** Plan items you deleted stay deleted when a newer plan version loads. */
function forget(id) {

/** plan-2027.json ships beside the app. A newer `version` loads by itself on open: new
    records are added, records you already have only gain the plan's structure fields. */
async function loadBundledPlan(manual, data) {
  // The live site no longer serves plan-2027.json: it holds personal data and the repo is
  // public. It loads from a file you pick (Settings → Restore) or from `node serve.js`.
  if (!data) try { data = await (await fetch('plan-2027.json', { cache: 'no-store' })).json(); }
  catch (e) { if (manual) alert('The plan file is not on the website (it holds personal data). In Settings → Restore from a backup, pick plan-2027.json, for example from OneDrive in the Files app.'); return 0; }
  const v = data.version || 1;
  if (!manual && v <= (DB.prefs.planVersion || 0)) return 0;
  const gone = new Set(DB.prefs.gone || []);
  ['goals', 'habits', 'tasks', 'cards', 'apps'].forEach(k => { if (data[k]) data[k] = data[k].filter(x => !gone.has(x.id)); });
  delete data.memory;
  if (Array.isArray(data.proposals)) queueAdd(data.proposals.map(x => Object.assign({ src: 'plan' }, x)));
  // Mail the plan has already dealt with is never raised again by the Gmail scan.
  if (Array.isArray(data.seenMail)) DB.gsync.seen = [...new Set(DB.gsync.seen.concat(data.seenMail))];
  delete data.proposals; delete data.seenMail;
  // The routine arrives once; after that it is yours, like every other plan record.
  if (Array.isArray(data.routine) && !(DB.routine || []).length) DB.routine = data.routine;
  delete data.routine;
  const had = new Set(DB.habits.map(h => h.id));
  const n = restore(data);
  // A habit is judged on its first two weeks here, not on the days before it arrived.
  DB.habits.forEach(h => { if (!had.has(h.id) && String(h.id).startsWith('p1')) h.since = today(); });
  const STRUCT = ['after', 'gap', 'by', 'ladder', 'track', 'kcal', 'risk', 'riskLadder', 'mail', 'minutes', 'brief'];
  ['goals', 'habits', 'tasks'].forEach(k => (data[k] || []).forEach(p => {
    const mine = DB[k].find(x => x.id === p.id);
    if (mine) STRUCT.forEach(f => { if (p[f] !== undefined && mine[f] === undefined) mine[f] = p[f]; });
  }));
  DB.prefs.planVersion = Math.max(v, DB.prefs.planVersion || 0);
  if (n) {
    DB.prefs.onboarded = true;
    DB.memory.push({ id: uid(), d: today(), kind: 'load', text: `Loaded plan v${v}: ${n} new goals, habits, tasks, cards and applications.` });
  }
  save();
  if (n || manual) toast(n ? `${n} plan items added.` : 'Plan already loaded.');
  return n;
}
const habitsFor = id => liveHabits().filter(h => h.goalId === id);

function deckFrom() {
  return liveCards().reduce((m, c) => (c.created && (!m || c.created < m) ? c.created : m), null);
}

/** Two modes, no config field to choose between them. A goal with a number and a date
    is counted by hand — books read, kilos lost. A goal without one is measured by the
    habits underneath it, because that is all the evidence there is. */
function goalRate(g) {
  const hs = habitsFor(g.id);
  if (!hs.length) return null;
  let done = 0, total = 0;
  hs.forEach(h => { const r = R.completionRate(h, logValue, today(), 30); done += r.done; total += r.total; });
  return total ? done / total : null;
}
function goalPct(g) {
  if (g.target) return R.fraction(goalDone(g.id), g.target);
  const r = goalRate(g);
  return r == null ? 0 : r;
}

function goalCard(g, compact) {
  const hs = habitsFor(g.id);
  const cds = liveCards().filter(c => c.goalId === g.id);
  const tks = DB.tasks.filter(t => t.goalId === g.id && !t.done);
  const p = g.target ? R.goalPace(g, goalDone(g.id), today()) : null;
  const pct = Math.round(goalPct(g) * 100);
  const col = p ? (p.ahead >= 0 ? 'var(--green)' : 'var(--orange)') : 'var(--tint)';
  const bits = [
    hs.length ? `${hs.length} habit${hs.length > 1 ? 's' : ''}` : null,
    cds.length ? `${cds.length} card${cds.length > 1 ? 's' : ''}` : null,
    tks.length ? `${tks.length} open task${tks.length > 1 ? 's' : ''}` : null,
  ].filter(Boolean);
  return `<button class="goal" data-act="goal:${g.id}">
    <span class="row">
      <span style="flex:1;min-width:0">
        <span style="font-weight:600;display:block">${esc(g.statement)}</span>
        ${g.identity && !compact ? `<span class="ident" style="display:block">${esc(g.identity)}</span>` : ''}
        <span class="sub" style="display:block;margin-top:5px">${
          p ? `${goalDone(g.id)} of ${g.target}${g.unit ? ' ' + esc(g.unit) : ''} · ${
                p.daysLeft > 0 ? p.daysLeft + ' day' + (p.daysLeft === 1 ? '' : 's') + ' left' : 'past its date'}`
            : hs.length ? `${pct}% of scheduled days kept` : bits.length ? 'no habit yet, progress comes from the tasks' : 'nothing attached yet'}</span>
      </span>
      <span style="font-weight:600;color:${col}">${pct}%</span>
    </span>
    <span class="bar" style="display:block;margin-top:8px"><i style="width:${Math.min(100, pct)}%;background:${col}"></i></span>
    ${compact ? '' : `<span class="qa" style="display:block${bits.length ? '' : ';color:var(--orange)'}">${
      bits.length ? bits.join(' · ') : 'no habit behind this yet — a goal with no behaviour is a wish'}</span>`}
  </button>`;
}

function growGoals() {
  const gs = liveGoals();
  let out = memoryCard(8);
  if (!gs.length) {
    out += `<div class="card"><h2>${ic('target')} Nothing above the habits yet</h2>
      <p class="hint">A tracker tells you what you did. A goal tells you what it was for.
        Write one down with a date on it — that single act is the part of every
        goal-setting book that survives testing.</p>
      <button class="btn" data-act="goalnew">Write your first goal</button></div>`;
  }
  Object.keys(AREAS).forEach(area => {
    const mine = gs.filter(g => g.area === area);
    if (!mine.length) return;
    out += `<div class="card"><h2>${AREAS[area]} ${area}</h2>${mine.map(g => goalCard(g)).join('')}</div>`;
  });
  if (gs.length) out += `<button class="btn sec" data-act="goalnew">New goal</button>`;
  const orphans = liveHabits().filter(h => !h.goalId);
  if (gs.length && orphans.length)
    out += `<div class="card"><h2>${ic('compass')} Serving nothing</h2>
      <p class="hint">These habits are not attached to any goal. That is fine for a few —
        but a habit you cannot connect to something you want is a habit you will drop.</p>
      <ul class="list">${orphans.map(h => `<li data-act="hedit:${h.id}">
        <span class="tick">${esc(h.icon)}</span><span style="flex:1">${esc(h.name)}</span>
        <span class="sub">attach ›</span></li>`).join('')}</ul></div>`;
  return out;
}

// ---------- learn ----------

/** The same board as a habit grid, counting reviews instead of check-ins. */
function reviewBoard() {
  const end = today();
  let out = '';
  for (let key = gridStart(); key <= end; key = R.addDays(key, 1)) {
    const n = (DB.reviews[key] || {}).n || 0;
    const cls = n >= 20 ? 'l4' : n >= 10 ? 'l3' : n >= 4 ? 'l2' : n > 0 ? 'l1' : '';
    out += cls ? `<i class="${cls}"></i>` : '<i></i>';
  }
  return `<div class="gridwrap" style="--hc:var(--tint)"><div class="hgrid">${out}</div></div>`;
}

function growLearn() {
  const t = today();
  const r = R.retention(liveCards(), t);
  const due = r.due;
  let out = `<div class="card">
    <div class="row" style="gap:18px">
      ${ring(r.recall == null ? 0 : Math.round(r.recall * 100), 88,
             r.recall == null ? 'var(--dim)' : r.recall >= .85 ? 'var(--green)' : r.recall >= .6 ? 'var(--tint)' : 'var(--orange)')}
      <div style="flex:1">
        <div class="big">${r.recall == null ? '—' : Math.round(r.recall * 100) + '%'}</div>
        <div class="sub" style="margin-top:6px">${r.recall == null
          ? 'recall shows up once you have reviewed something'
          : 'of your answers have been right'}</div>
      </div>
    </div>
    ${(() => { const cal = R.calibration(liveCards());
      return cal.gap == null ? '' : `<p class="hint" style="margin-top:12px">You were right on
        <b>${Math.round(cal.onSure * 100)}%</b> of the cards you felt sure about${
        cal.onUnsure != null ? `, and <b>${Math.round(cal.onUnsure * 100)}%</b> of the ones you were not` : ''}.
        ${cal.gap >= 0.2 ? 'Recognising an answer is not knowing it.' : 'That is well calibrated — you know what you know.'}</p>`; })()}
    <div class="row" style="margin-top:16px;gap:10px;text-align:center">
      <div style="flex:1"><div style="font-weight:600;font-size:19px">${due}</div><div class="sub">due</div></div>
      <div style="flex:1"><div style="font-weight:600;font-size:19px">${r.learned}</div><div class="sub">learned</div></div>
      <div style="flex:1"><div style="font-weight:600;font-size:19px">${r.total}</div><div class="sub">cards</div></div>
      <div style="flex:1"><div style="font-weight:600;font-size:19px;color:${r.leeches ? 'var(--orange)' : 'inherit'}">${r.leeches}</div><div class="sub">stuck</div></div>
    </div>
    ${due ? `<button class="btn" data-act="study">Review ${due} card${due === 1 ? '' : 's'}</button>`
          : r.total ? `<p class="hint" style="margin-top:14px">Nothing due. Spacing only works if you
              let the gap happen — come back when the app says so.</p>`
                    : ''}
  </div>`;

  if (r.total) out += `<div class="card"><h2>${ic('bulb')} Reviews</h2>${reviewBoard()}
    <p class="hint" style="margin-top:10px">Recalling an answer strengthens it far more than
      re-reading it. That is the whole trick, and it is why this deck asks instead of shows.</p></div>`;

  const cards = liveCards();
  if (!cards.length) {
    out += `<div class="card"><h2>${ic('cards')} No cards yet</h2>
      <p class="hint">A card is one question with one answer. Write what you want to still know
        in a year — the app decides when to ask, at widening gaps, so you spend your time on
        what you are about to forget rather than what you already know.</p>
      <button class="btn" data-act="cardnew">Write your first card</button></div>`;
  } else {
    const by = {};
    cards.forEach(c => { (by[c.goalId || ''] = by[c.goalId || ''] || []).push(c); });
    Object.keys(by).sort().forEach(gid => {
      const g = goalById(gid);
      out += `<div class="card"><h2>${g ? esc(g.statement) : '📇 Unfiled'}</h2>
        <ul class="list">${by[gid].slice(0, 12).map(c => {
          const isDue = !c.due || c.due <= t;
          return `<li data-act="cardedit:${c.id}">
            <span class="tick">${(c.lapses || 0) >= 4 ? '🩹' : isDue ? '🔵' : '✅'}</span>
            <div style="flex:1"><div>${esc(c.front)}</div>
              <div class="meta"><span>box ${(c.box || 0) + 1}/${R.BOXES.length}</span>
                <span>${isDue ? 'due now' : 'due ' + esc(fmtDue(c.due))}</span>
                ${c.lapses ? `<span>${c.lapses} lapse${c.lapses > 1 ? 's' : ''}</span>` : ''}</div></div></li>`;
        }).join('')}</ul>
        ${by[gid].length > 12 ? `<p class="hint">…and ${by[gid].length - 12} more. The queue
          decides the order — you do not have to.</p>` : ''}</div>`;
    });
    out += `<button class="btn sec" data-act="cardnew">New card</button>`;
  }
  return out;
}

function growPractice() {
  const t = practiceTrendNow();
  const all = DB.sessions.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const week = all.filter(s => s.date > R.addDays(today(), -7));
  const mins = week.reduce((s, x) => s + (x.minutes || 0), 0);

  let out = `<div class="card">
    <h2>${ic('sliders')} Deliberate practice</h2>
    <div class="row" style="gap:10px;text-align:center;margin-top:4px">
      <div style="flex:1"><div style="font-weight:600;font-size:19px">${Math.round(mins / 60 * 10) / 10}h</div><div class="sub">this week</div></div>
      <div style="flex:1"><div style="font-weight:600;font-size:19px">${week.length}</div><div class="sub">sessions</div></div>
      <div style="flex:1"><div style="font-weight:600;font-size:19px;color:${
        t && t.difficulty != null && t.difficulty <= 2 ? 'var(--orange)' : 'inherit'}">${
        t && t.difficulty != null ? t.difficulty.toFixed(1) : '—'}</div><div class="sub">difficulty</div></div>
    </div>
    <button class="btn" data-act="practice">Start a session</button>
    <p class="hint">Practice only moves you when it is aimed at something you currently
      cannot do. This asks for that target before it starts the clock, and for what broke
      when it stops — those two questions are the difference between practice and time spent.</p>
  </div>`;

  if (!all.length) return out;
  out += `<div class="card"><h2>${ic('book')} Log</h2><ul class="list">${all.slice(0, 25).map(s => {
    const g = goalById(s.goalId);
    return `<li data-act="sessedit:${s.id}">
      <span class="tick">${'●'.repeat(Math.max(1, s.difficulty || 1))}</span>
      <div style="flex:1"><div>${esc(s.focus || 'unnamed session')}</div>
        <div class="meta"><span>${esc(fmtDue(s.date))}</span><span>${s.minutes || 0} min</span>
          ${g ? `<span>🎯 ${esc(g.statement)}</span>` : ''}</div>
        ${s.next ? `<div class="qa">next: ${esc(s.next)}</div>` : ''}</div></li>`;
  }).join('')}</ul></div>`;
  return out;
}

const practiceTrendNow = () => R.practiceTrend(DB.sessions, 6);

// ---------- the weekly review ----------
// Collins' one durable instruction: confront the brutal facts. So this is generated
// from the logs rather than typed from memory, which is where reviews normally go wrong.

function weekStats(fromKey, toKey) {
  const ctx = indexCtx();
  let done = 0, total = 0;
  liveHabits().forEach(h => {
    const r = R.completionRate(h, logValue, toKey, R.daysBetween(fromKey, toKey) + 1);
    done += r.done; total += r.total;
  });
  let reviews = 0, again = 0;
  for (let k = fromKey; k <= toKey; k = R.addDays(k, 1)) {
    const r = DB.reviews[k];
    if (r) { reviews += r.n || 0; again += r.again || 0; }
  }
  const sess = DB.sessions.filter(s => s.date >= fromKey && s.date <= toKey);
  const tasks = DB.tasks.filter(t => t.done && t.completedAt >= fromKey && t.completedAt <= toKey);
  const spent = R.spend(DB.txns.filter(t => t.date >= fromKey && t.date <= toKey).map(t => t.amount));
  const series = R.indexSeries(fromKey, toKey, ctx, 7);
  return {
    rate: total ? done / total : null, done, total,
    reviews, recall: reviews ? (reviews - again) / reviews : null,
    minutes: sess.reduce((s, x) => s + (x.minutes || 0), 0), sessions: sess.length,
    tasks: tasks.length, spent,
    score: series.reduce((s, p) => s + p.score, 0) / series.length,
  };
}

function growReview() {
  const t = today();
  const from = R.addDays(t, -6);
  const now = weekStats(from, t);
  const before = weekStats(R.addDays(from, -7), R.addDays(from, -1));
  const move = (a, b, unit) => {
    if (a == null || b == null) return '';
    const d = Math.round((a - b) * (unit === 'pct' ? 100 : 1));
    if (!d) return '<span class="sub">level</span>';
    return `<span style="color:${d > 0 ? 'var(--green)' : 'var(--red)'}">${signed(d)}</span>`;
  };
  const line = (icon, label, value, delta) => `<div class="row" style="padding:9px 0">
    <span style="width:26px">${icon}</span><span style="flex:1">${label}</span>
    <span style="font-weight:600">${value}</span>
    <span style="width:56px;text-align:right;font-size:12px">${delta || ''}</span></div>`;

  const worst = [];
  liveHabits().forEach(h => {
    const r = R.completionRate(h, logValue, t, 7);
    if (r.total >= 3 && r.rate < 0.6) worst.push({ h, r });
  });
  const best = liveHabits().map(h => ({ h, r: R.completionRate(h, logValue, t, 7) }))
    .filter(x => x.r.total >= 3 && x.r.rate >= 1);

  const saved = (DB.reviews[t] || {}).review;

  return `<div class="card">
    <h2>${ic('mirror')} The week, as it happened</h2>
    <p class="hint" style="margin-bottom:6px">${esc(fmtDue(from))} – ${esc(fmtDue(t))}. Read this
      before you plan anything. The numbers are not an opinion.</p>
    ${line('◎', 'Overall', Math.round(now.score * 100) + '%', move(now.score, before.score, 'pct'))}
    ${line('🔁', 'Habits kept', now.total ? `${now.done}/${now.total}` : '—', move(now.rate, before.rate, 'pct'))}
    ${line('🧠', 'Cards reviewed', now.reviews, move(now.reviews, before.reviews))}
    ${line('🎚️', 'Practice', Math.round(now.minutes) + ' min', move(now.minutes, before.minutes))}
    ${line('☑️', 'Tasks finished', now.tasks, move(now.tasks, before.tasks))}
    ${line('💳', 'Spent', money0(now.spent), '')}
    ${(() => {
      const dq = R.deepShare(DB.tasks.filter(x => x.done).concat(DB.sessions), from, t);
      return dq ? line(ic('headphones'), 'Needed real focus', `${dq.deep}/${dq.total}`, '') : '';
    })()}
  </div>

  ${best.length ? `<div class="card"><h2>${ic('check-circle')} Held all week</h2><ul class="list">${best.map(x =>
    `<li><span class="tick">${esc(x.h.icon)}</span><span style="flex:1">${esc(x.h.name)}</span>
      <span class="sub">${x.r.done}/${x.r.total}</span></li>`).join('')}</ul></div>` : ''}

  ${worst.length ? `<div class="card"><h2>${ic('alert')} Where it broke</h2><ul class="list">${worst.map(x =>
    `<li data-act="hedit:${x.h.id}"><span class="tick">${esc(x.h.icon)}</span>
      <div style="flex:1"><div>${esc(x.h.name)}</div>
      <div class="meta"><span>${x.r.done} of ${x.r.total}</span>
        ${x.h.cue ? '' : '<span style="color:var(--orange)">no trigger set</span>'}</div></div></li>`).join('')}</ul>
    <p class="hint" style="margin-top:10px">Shrink the target before you drop the habit. A
      two-minute version you keep beats a proper one you abandon.</p></div>`
    : `<div class="card"><h2>${ic('check-circle')} Nothing broke</h2><p class="hint">No habit fell below 60% this week.</p></div>`}

  <div class="card"><h2>${ic('pen')} Three questions</h2>
    <label class="f">What actually worked?</label>
    <textarea id="rvWorked" rows="2" placeholder="Be specific. Name the thing, not the feeling.">${esc(saved ? saved.worked : '')}</textarea>
    <label class="f">What broke, and why?</label>
    <textarea id="rvBroke" rows="2" placeholder="The honest reason, not the flattering one.">${esc(saved ? saved.broke : '')}</textarea>
    <label class="f">One thing you will change next week</label>
    <input id="rvChange" value="${esc(saved ? saved.change : '')}" placeholder="One. Not five.">
    <button class="btn" data-act="saveReview">${saved ? 'Update this review' : 'Save this review'}</button>
    <p class="hint">Kept on this phone with the rest of your data.</p>
  </div>`;
}

function viewGrow() {
  let out = `<div class="seg">${GROWS.map(g =>
    `<button data-act="grow:${g[0]}" aria-pressed="${S.growView === g[0]}">${g[1]}</button>`).join('')}</div>`;
  return out + (S.growView === 'plan' ? growPlan() : S.growView === 'learn' ? growLearn()
    : S.growView === 'practice' ? growPractice()
      : S.growView === 'review' ? growReviewTab() : growGoals());
}

    <input id="gH3" value="${esc((d.hedgehog || {}).engine || '')}" autocapitalize="sentences">

    <button class="btn" data-act="saveGoal">${g ? 'Save goal' : 'Create goal'}</button>
    ${g ? `<button class="btn danger" data-act="delGoal:${g.id}">Delete goal</button>` : ''}`;

  openSheet(g ? 'Edit goal' : 'New goal', body(), () => {
    sheetSubmit = { redraw: () => { $('#sheetInner').innerHTML = body(); }, save() {
      const statement = val('gStat').trim();
      if (!statement) { alert('Say what the goal is.'); return; }
      const rec = g || { id: uid(), created: today(), done: 0 };
      Object.assign(rec, {
        statement,
        area: (val('gArea') || 'Education').replace(/^\S+\s/, ''),
        identity: val('gIdent').trim(),
        why: val('gWhy').trim(),
        target: num('gTarget') || null,
        unit: val('gUnit').trim(),
        targetDate: val('gDate') || null,
        hedgehog: { goodAt: val('gH1').trim(), careAbout: val('gH2').trim(), engine: val('gH3').trim() },
        obstacle: val('gObs').trim(), plan: val('gPlan').trim(), motive: val('gWho') || 'own',
        premortem: val('gPre').split('\n').map(x => x.trim()).filter(Boolean),
        archived: !!rec.archived,
      });
      if (!g) DB.goals.push(rec);
      save(); closeSheet(); render();
    } };
  });
}

/** The goal itself: progress, what serves it, and the questions behind it. */
// ---------- briefings ----------
// Lists stay short. The full plan for any goal, drill or order is one tap away, laid out
// like an operations order: numbered paragraphs, each answering one question. The words
// come from the record's own fields plus its `brief` (written in plan-2027.json).
const briefMd = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
/** Plain text to HTML: lines starting "- " are bullets, "1. " numbered steps, the rest paragraphs. */
function briefText(t) {
  if (!t) return '';
  const out = [];
  let list = null, items = [];
  const flush = () => { if (items.length) out.push(`<${list} class="blist">${items.map(x => `<li>${briefMd(x)}</li>`).join('')}</${list}>`); items = []; list = null; };
  String(t).split('\n').forEach(l => {
    const b = /^\s*-\s+(.*)$/.exec(l), n = /^\s*\d+\.\s+(.*)$/.exec(l);
    const kind = b ? 'ul' : n ? 'ol' : null;
    if (kind) { if (list && list !== kind) flush(); list = kind; items.push((b || n)[1]); }
    else { flush(); if (l.trim()) out.push(`<p class="bp">${briefMd(l.trim())}</p>`); }
  });
  flush();
  return out.join('');
}
const para = (title, html, icon) => (html && html.trim() ? `<div class="card brief"><h2>${icon || ''} ${esc(title)}</h2>${html}</div>` : '');
const kv = rows => {
  const r = rows.filter(x => x[1]);
  return r.length ? `<dl class="kv">${r.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>` : '';
};
const refsPara = refs => para('References', (refs || []).filter(r => safeUrl(r[1]))
  .map(r => `<a class="bref" href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])} ↗</a>`).join(''));
const fmtLong = day => (day ? R.fromYMD(day).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : '');
const DAYN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function schedText(h) {
  const when = h.schedule === 'daily' ? 'Every day'
    : h.schedule === 'monthly' ? `Day ${h.monthDay || 1} of each month`
    : (h.weekdays || []).length === 7 ? 'Every day'
    : (h.weekdays || []).join() === '1,2,3,4,5' ? 'Weekdays'
    : (h.weekdays || []).join() === '0,6' ? 'Weekends'
    : (h.weekdays || []).map(w => DAYN[w]).join(' · ') || 'Unscheduled';
  return when + (h.at ? ` at ${h.at}` : '');
}
function standardText(h) {
  const g = R.goalOf(h);
  if (h.kind === 'timer') return `${g} minutes`;
  if (h.kind === 'counter') return `${g} a day`;
  if (h.kind === 'checklist') return `All ${g} steps`;
  return 'Done, once';
}
/** The last 14 days as a strip: lit where the standard was met, outlined on rest days. */
function strip14(h) {
  let out = '';
  for (let i = 13; i >= 0; i--) {
    const d = R.addDays(today(), -i);
    out += `<i class="${!R.isScheduled(h, d) ? 'off' : habitDone(h, d) ? 'on' : ''}" title="${esc(d)}"></i>`;
  }
  return `<div class="s14" style="--hc:${esc(h.color)}">${out}</div><div class="meta" style="margin-top:6px"><span>14 days ago</span><span class="spacer"></span><span>today</span></div>`;
}

function goalDetail(id) {
  const g = goalById(id);
  if (!g) return;
  const B = g.brief || {};
  const body = () => {
    const p = g.target ? R.goalPace(g, goalDone(g.id), today()) : null;
    const pct = Math.round(goalPct(g) * 100);
    const hs = habitsFor(g.id);
    const cds = liveCards().filter(c => c.goalId === g.id);
    const tks = DB.tasks.filter(t => t.goalId === g.id).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    const hh = g.hedgehog || {};
    let month = '';
    const phases = tks.map(t => {
      const m = t.due ? R.fromYMD(t.due).toLocaleDateString(undefined, { month: 'short', year: '2-digit' }).toUpperCase() : 'NO DATE';
      const head = m !== month ? `<li class="pm">${esc(m)}</li>` : '';
      month = m;
      return head + `<li data-act="tbrief:${t.id}"><span class="tick">${t.done ? '✓' : isOverdue(t) ? '!' : '○'}</span>
        <div style="flex:1"><div class="${t.done ? 'strike' : ''}">${esc(t.title)}</div>
        <div class="meta"><span${isOverdue(t) ? ' style="color:var(--red)"' : ''}>${esc(fmtDue(t.due) || 'no date')}</span>
          ${t.after ? `<span>after ${esc((DB.tasks.find(x => x.id === t.after) || {}).title || '').slice(0, 28)}…</span>` : ''}
          ${t.by ? `<span>hard date ${esc(fmtDue(t.by))}</span>` : ''}</div></div><span class="chev">›</span></li>`;
    }).join('');
    return `<div class="card hero">
      <div class="row" style="gap:18px">
        ${ring(Math.min(100, pct), 92, p && p.ahead < 0 ? 'var(--orange)' : 'var(--green)')}
        <div style="flex:1">
          <div class="big">${pct}%</div>
          <div class="sub" style="margin-top:5px">${p
            ? `${goalDone(g.id)} of ${g.target}${g.unit ? ' ' + esc(g.unit) : ''}`
            : hs.length ? 'of scheduled days kept, last 30' : 'nothing measuring this yet'}</div>
          ${g.targetDate ? `<div class="sub">target ${esc(fmtLong(g.targetDate))}</div>` : ''}
        </div>
      </div>
      ${g.target ? `<div class="row" style="margin-top:14px;gap:10px">
        <button class="btn sec" style="margin:0;flex:1" data-act="goalminus:${g.id}">−1</button>
        <button class="btn" style="margin:0;flex:1" data-act="goalplus:${g.id}">+1 ${esc(g.unit || '')}</button>
      </div>` : ''}
    </div>
    ${para('Situation', briefText(g.why) + briefText(B.situation))}
    ${para('Mission', `<p class="bp"><b>${esc(g.statement)}</b>${g.targetDate ? `, by <b>${esc(fmtLong(g.targetDate))}</b>` : ''}.</p>
      ${g.identity ? `<p class="ident">${esc(g.identity)}</p>` : ''}${briefText(B.mission)}`)}
    ${para('Execution', briefText(B.concept) + (tks.length ? `<ul class="list phases">${phases}</ul>`
      : '<p class="hint">No tasks under this goal yet.</p>'))}
    ${para('Habits behind it', (hs.length ? `<ul class="list">${hs.map(h => {
        const r = R.completionRate(h, logValue, today(), 30);
        return `<li data-act="hbrief:${h.id}"><span class="tick">${esc(h.icon)}</span>
          <div style="flex:1"><div>${esc(h.name)}</div>
          <div class="meta"><span>${esc(schedText(h))}</span><span>${Math.round(r.rate * 100)}% of 30 days</span></div></div><span class="chev">›</span></li>`;
      }).join('')}</ul>` : `<p class="hint">Nothing daily is serving this goal, which means nothing is moving it.
        Attach a habit — the smallest one you would still do on a bad day.</p>`) + briefText(B.sustain)
      + `<button class="btn sec" data-act="goalhabit:${g.id}">Add a habit for this</button>`)}
    ${para('Risk', (g.obstacle ? `<div class="intent" style="margin:0 0 10px">In the way: <b>${esc(g.obstacle)}</b>${
        g.plan ? `<br>Then: <b>${esc(g.plan)}</b>` : ''}</div>` : '')
      + ((g.premortem || []).length ? `<p class="bp"><b>How it fails, if it fails:</b></p><ul class="blist">${g.premortem.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '')
      + (g.obstacle ? '' : `<p class="hint" style="color:var(--orange)">No obstacle named. That is the half of this that does the work.</p>`)
      + briefText(B.risk), ic('alert'))}
    ${para('Measures', kv([
        ['Progress', g.track ? (g.track.weight ? 'Counts itself from your weigh-ins (7-day average)'
          : g.track.tasks ? 'Counts itself as the tasks behind it are ticked off'
          : g.track.trades ? 'Counts itself from the trading journal'
          : 'Counts itself from your study timers') : g.target ? 'The + / − buttons above' : 'Days the drills were kept'],
        ['Pace', p ? (p.daysLeft > 0 ? (p.ahead >= 0 ? `Ahead. ${p.remaining} ${esc(g.unit || '')} to go in ${p.daysLeft} days`
          : `Behind: ${Math.round(p.expected)} expected by now. ${p.remaining} to go in ${p.daysLeft} days`) : 'Past its date') : ''],
        ['Calories', g.kcal ? `${g.kcal} kcal a day, reset every two weeks from your weigh-ins` : ''],
        ['Cards', cds.length ? `${cds.length}, ${cds.filter(c => !c.due || c.due <= today()).length} due now` : ''],
        ['Risk / trade', g.track && g.track.trades ? (g.risk ? `${g.risk}% of the account` : 'paper only') : ''],
      ]) + briefText(B.measures))}
    ${hh.goodAt || hh.careAbout || hh.engine ? para('Why this one', kv([['Excellent at', esc(hh.goodAt || '')], ['Cares about', esc(hh.careAbout || '')], ['Engine', esc(hh.engine || '')]]), ic('heart')) : ''}
    ${refsPara(B.refs)}
    <div class="row" style="gap:8px">
      <button class="btn sec" style="flex:1" data-act="goalcard:${g.id}">Add a card</button>
      <button class="btn sec" style="flex:1" data-act="goaledit:${g.id}">Edit goal</button></div>`;
  };
  openSheet(g.statement, body(), () => { sheetSubmit = { redraw: () => { $('#sheetInner').innerHTML = body(); } }; });
}

function habitBrief(id) {
  const h = habitById(id);
  if (!h) return;
  const B = h.brief || {};
  const body = () => {
    const g = h.goalId ? goalById(h.goalId) : null;
    const after = h.stackAfter ? habitById(h.stackAfter) : null;
    const r = R.completionRate(h, logValue, today(), 30), st = streakOf(h);
    const steps = h.kind === 'checklist' && (h.checklist || []).length
      ? `<ol class="blist">${h.checklist.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : '';
    const ladder = (h.ladder || []).slice().sort((a, b) => a - b);
    const unit = h.kind === 'timer' ? ' min' : '';
    return `<div class="card hcard" style="--hc:${esc(h.color)}">
      <div class="row"><span class="hico">${esc(h.icon)}</span>
        <div style="flex:1"><div style="font-weight:600">${esc(h.name)}</div><div class="sub">${esc(schedText(h))}</div></div></div>
      <div class="row" style="margin-top:12px;gap:18px">
        <div><div class="big" style="font-size:26px">${st}</div><div class="hint">day streak</div></div>
        <div><div class="big" style="font-size:26px">${Math.round(r.rate * 100)}%</div><div class="hint">last 30 days</div></div>
        <div><div class="big" style="font-size:26px">${esc(standardText(h))}</div><div class="hint">standard</div></div></div>
      <div class="row" style="gap:8px;margin-top:4px">
        <button class="btn" style="flex:1" data-act="hopen:${h.id}">Check in</button>
        <button class="btn sec" style="flex:1" data-act="hedit:${h.id}">Edit</button></div>
    </div>
    ${para('Task', kv([['What', esc(h.name)], ['When', esc(schedText(h))], ['Where', esc(h.place || '')], ['Standard', esc(standardText(h))]]))}
    ${para('Purpose', (g ? `<p class="bp">Serves <b data-act="goal:${g.id}" style="color:var(--tint)">${esc(g.statement)} ›</b></p>` : '') + briefText(B.why))}
    ${para('Conditions', kv([
        ['Trigger', h.cue ? esc(h.cue) : after ? `straight after <b>${esc(after.name)}</b>` : ''],
        ['Set up', esc(h.friction || '')],
        ['Only with', esc(h.bundle || '')]]) + briefText(B.conditions))}
    ${para('Procedure', steps + briefText(B.how))}
    ${para('Standard', kv([['Full', esc(standardText(h))], ['Bad day', esc(h.min || '')]]) + briefText(B.standard))}
    ${para('Progression', (ladder.length ? `<p class="bp">Levels: ${ladder.map(x => x === R.goalOf(h) ? `<b>[${x}${unit}]</b>` : `${x}${unit}`).join(' → ')}.
        Two weeks at 90%+ steps it up; two weeks at 40% or less steps it down. ${h.noAdapt ? '<b>Paused: you undid a change, so it stays put.</b>' : ''}</p>` : '')
      + briefText(B.progression))}
    ${para('Record', strip14(h))}
    ${refsPara(B.refs)}`;
  };
  openSheet(h.name, body(), () => { sheetSubmit = { redraw: () => { $('#sheetInner').innerHTML = body(); } }; });
}

function taskBrief(id) {
  const t = DB.tasks.find(x => x.id === id);
  if (!t) return;
  const B = t.brief || {};
  const body = () => {
    const g = t.goalId ? goalById(t.goalId) : null;
    const pre = t.after ? DB.tasks.find(x => x.id === t.after) : null;
    const next = DB.tasks.filter(x => x.after === t.id);
    const link = x => `<span data-act="tbrief:${x.id}" style="color:var(--tint)">${esc(x.title)}${x.done ? ' ✓' : ''} ›</span>`;
    const subs = t.subtasks || [];
    const state = t.done ? ['Done', 'var(--green)'] : isOverdue(t) ? ['Overdue', 'var(--red)'] : ['Open', 'var(--tint)'];
    return `<div class="card hero">
      <span class="pill" style="color:${state[1]}">${state[0]}</span>
      <div style="font-weight:600;font-size:17px;margin-top:8px">${esc(t.title)}</div>
      <div class="sub" style="margin-top:4px">${t.due ? `due ${esc(fmtLong(t.due))}${t.dueTime ? ' · ' + esc(t.dueTime) : ''}` : 'no date'}
        ${t.done && t.completedAt ? ` · done ${esc(fmtDue(t.completedAt))}` : ''}</div>
      <div class="row" style="gap:8px;margin-top:4px">
        <button class="btn" style="flex:1" data-act="taskdone:${t.id}">${t.done ? 'Reopen' : 'Mark done'}</button>
        <button class="btn sec" style="flex:1" data-act="taskedit:${t.id}">Edit</button></div>
      <button class="btn danger" data-act="delTask:${t.id}">Delete task</button>
    </div>
    ${para('Purpose', (g ? `<p class="bp">Moves <b data-act="goal:${g.id}" style="color:var(--tint)">${esc(g.statement)} ›</b></p>` : '') + briefText(B.why))}
    ${para('Steps', (subs.length ? `<ol class="blist">${subs.map(s => `<li class="${s.done ? 'strike' : ''}">${esc(s.title)}</li>`).join('')}</ol>` : '') + briefText(B.steps))}
    ${para('Done when', briefText(B.done))}
    ${para('Timeline', kv([
        ['Due', t.due ? esc(fmtLong(t.due)) : ''],
        ['Waits on', pre ? link(pre) : ''],
        ['Then', next.map(link).join('<br>')],
        ['Hard date', t.by ? `${esc(fmtLong(t.by))}: the plan never moves it past this` : ''],
        ['Slipped', t.slips ? `${t.slips} time${t.slips > 1 ? 's' : ''}` : ''],
        ['Pinned', t.pinned ? 'You set this date; the plan leaves it' : '']]))}
    ${para('Notes', briefText(t.notes) + briefText(B.notes))}
    ${refsPara(B.refs)}`;
  };
  openSheet('Task', body(), () => { sheetSubmit = { redraw: () => { $('#sheetInner').innerHTML = body(); } }; });
}

// ---------- card editor ----------
function cardSheet(id, goalId) {
  const c = id ? DB.cards.find(x => x.id === id) : null;
  const d = c || { goalId: goalId || '' };
  const tmp = { image: d.image || null, links: (d.links || []).slice() };
  d.image = tmp.image; d.links = tmp.links;
  const body = () => `
    <label class="f">Question</label>
    <textarea id="cFront" rows="2" placeholder="What does spaced repetition exploit?" autocapitalize="sentences">${esc(d.front || '')}</textarea>
    <label class="f">Answer</label>
    <textarea id="cBack" rows="3" placeholder="Keep it to one fact. Two facts are two cards." autocapitalize="sentences">${esc(d.back || '')}</textarea>

    <label class="f">In your own words (optional)</label>
    <textarea id="cWhy" rows="2" placeholder="Explain it as if to someone who has never heard of it." autocapitalize="sentences">${esc(d.explain || '')}</textarea>
    <p class="hint" style="margin-top:6px">Writing the explanation is most of the learning.
      If you cannot put it plainly, you have found the gap.</p>

    <label class="f">Goal</label>
    <select id="cGoal"><option value="">— none —</option>${liveGoals().map(g =>
      `<option value="${esc(g.id)}" ${d.goalId === g.id ? 'selected' : ''}>${esc(g.statement)}</option>`).join('')}</select>

    <label class="f">Source (optional)</label>
    <input id="cSrc" value="${esc(d.source || '')}" placeholder="Book, page, link">

    <label class="f">Picture (optional)</label>
    ${d.image ? `<img src="${esc(d.image)}" alt="" style="display:block;max-height:150px;border-radius:10px;margin-bottom:8px">
      <button class="mini" data-act="cardImgOff" style="color:var(--red)">Remove picture</button>` : ''}
    <input id="cImg" type="file" accept="image/*">
    <p class="hint" style="margin-top:6px">A picture alongside the words is remembered better
      than either alone. Kept in this app's storage, so keep it small.</p>

    ${liveCards().filter(x => x.id !== d.id).length ? `<label class="f">Connects to</label>
      ${(d.links || []).map(id => { const o = DB.cards.find(x => x.id === id); return o
        ? `<div class="row" style="margin-bottom:6px"><span style="flex:1">${esc(o.front)}</span>
           <button data-act="cardUnlink:${id}" style="color:var(--red);font-size:13px">Remove</button></div>` : ''; }).join('')}
      <select id="cLink" data-act="cardLink"><option value="">— add a connection —</option>${
        liveCards().filter(x => x.id !== d.id && !(d.links || []).includes(x.id)).map(x =>
          `<option value="${esc(x.id)}">${esc(x.front)}</option>`).join('')}</select>
      <p class="hint" style="margin-top:6px">A fact joined to another fact is far harder to
        lose than a fact on its own.</p>` : ''}

    ${c ? `<p class="hint" style="margin-top:14px">Box ${(c.box || 0) + 1} of ${R.BOXES.length} ·
      seen ${c.seen || 0} time${c.seen === 1 ? '' : 's'} · ${c.lapses || 0} lapse${c.lapses === 1 ? '' : 's'} ·
      ${c.due ? 'due ' + esc(fmtDue(c.due)) : 'due now'}</p>` : ''}

    <button class="btn" data-act="saveCard">${c ? 'Save card' : 'Add card'}</button>
    ${c ? `<button class="btn sec" data-act="resetCard:${c.id}">Reset its schedule</button>
           <button class="btn danger" data-act="delCard:${c.id}">Delete card</button>` : ''}`;

  // The picture is read here and stored as a data URI, so it travels with a backup and
  // works offline. ponytail: capped at 400 KB — the whole DB lives in localStorage.
  function wireImage() {
    const f = document.getElementById('cImg');
    if (!f) return;
    f.onchange = () => {
      const file = f.files && f.files[0];
      if (!file) return;
      if (file.size > 400 * 1024) { alert('That picture is too big — under 400 KB, please.'); return; }
      const reader = new FileReader();
      reader.onload = () => { tmp.image = String(reader.result); if (sheetSubmit) sheetSubmit.redraw(); };
      reader.onerror = () => alert('That picture could not be read.');
      reader.readAsDataURL(file);
    };
  }

  openSheet(c ? 'Edit card' : 'New card', body(), () => {
    sheetSubmit = { tmp, redraw: () => {
      const keep = ['cFront', 'cBack', 'cWhy', 'cGoal', 'cSrc'].map(k => [k, val(k)]);
      d.image = tmp.image; d.links = tmp.links;
      $('#sheetInner').innerHTML = body();
      keep.forEach(([k, v]) => { const e = document.getElementById(k); if (e && v) e.value = v; });
      wireImage();
    }, save() {
      const front = val('cFront').trim(), back = val('cBack').trim();
      if (!front || !back) { alert('A card needs a question and an answer.'); return; }
      const rec = c || { id: uid(), created: today(), box: 0, due: today(), seen: 0, lapses: 0 };
      Object.assign(rec, { front, back, explain: val('cWhy').trim(),
                           goalId: val('cGoal') || null, source: val('cSrc').trim(),
                           image: tmp.image || null, links: tmp.links.slice(),
                           archived: !!rec.archived });
      if (!c) DB.cards.push(rec);
      save(); closeSheet(); render();
    } };
    wireImage();
  });
}

// ---------- the review runner ----------
function studySheet() {
  const queue = dueNow();
  if (!queue.length) { toast('Nothing due — that gap is doing the work.'); return; }
  S.study = { ids: queue.map(c => c.id), i: 0, shown: false, good: 0, again: 0, sure: null };

  const body = () => {
    const st = S.study;
    if (!st) return '';
    if (st.i >= st.ids.length) {
      const n = st.good + st.again;
      return `<div class="card" style="text-align:center">
        <div style="font-size:44px;margin:10px 0">${st.again ? ic('bulb') : ic('award')}</div>
        <div class="big">${n ? Math.round((st.good / n) * 100) : 0}%</div>
        <p class="hint" style="margin-top:8px">${st.good} right, ${st.again} to come back.
          Each of those is scheduled for the day you are about to forget it.</p>
        <button class="btn" data-act="close">Done</button></div>`;
    }
    const c = DB.cards.find(x => x.id === st.ids[st.i]);
    if (!c) return '';
    const linked = (c.links || []).map(id => DB.cards.find(x => x.id === id)).filter(Boolean);
    return `<div class="card">
      <div class="sub">${st.i + 1} of ${st.ids.length}${
        c.goalId && goalById(c.goalId) ? ' · ' + esc(goalById(c.goalId).statement) : ''}</div>
      <div class="face">${esc(c.front)}</div>
      ${st.shown ? `<div class="face back">${esc(c.back)}</div>
        ${c.image ? `<img src="${esc(c.image)}" alt="" style="display:block;margin:10px auto;max-height:220px;border-radius:10px">` : ''}
        ${c.explain ? `<p class="hint" style="margin-top:10px"><b>You wrote:</b> ${esc(c.explain)}</p>` : ''}
        ${linked.length ? `<p class="hint" style="margin-top:8px"><b>Connects to:</b> ${
          linked.map(x => esc(x.front)).join(' · ')}</p>` : ''}
        ${st.sure != null ? `<p class="hint" style="margin-top:8px;color:${
          st.sure ? 'var(--orange)' : 'var(--dim)'}">You said you ${st.sure ? 'knew this one' : 'were not sure'}. Grade it honestly.</p>` : ''}
        <div class="grades">
          <button data-act="grade:again" style="color:var(--red)">Again<span class="k">tomorrow</span></button>
          <button data-act="grade:hard" style="color:var(--orange)">Hard<span class="k">same gap</span></button>
          <button data-act="grade:good" style="color:var(--green)">Good<span class="k">wider gap</span></button>
        </div>`
      : `<p class="hint" style="text-align:center;margin-top:6px">Answer it in your head first.
           Then say whether you have it — before you find out.</p>
         <div class="grades">
           <button data-act="reveal:1" style="color:var(--tint)">I know it<span class="k">show me</span></button>
           <button data-act="reveal:0">Not sure<span class="k">show me</span></button>
         </div>`}
    </div>
    <button class="btn sec" data-act="cardedit:${c.id}">Edit this card</button>`;
  };

  openSheet('Review', body(), () => {
    sheetSubmit = { redraw: () => { $('#sheetInner').innerHTML = body(); } };
  });
}

/** Grade the card in front of you, then move on. */
function gradeCard(grade) {
  const st = S.study;
  if (!st) return;
  const c = DB.cards.find(x => x.id === st.ids[st.i]);
  if (c) {
    // Calibration: what you claimed before the reveal, against what actually happened.
    // The gap between the two is the fluency illusion, and it is measurable.
    if (st.sure != null) {
      const right = grade !== 'again';
      if (st.sure) { c.sure = (c.sure || 0) + 1; if (right) c.sureRight = (c.sureRight || 0) + 1; }
      else { c.unsure = (c.unsure || 0) + 1; if (right) c.unsureRight = (c.unsureRight || 0) + 1; }
    }
    Object.assign(c, R.reviewCard(c, grade, today()));
    const day = (DB.reviews[today()] = DB.reviews[today()] || { n: 0, again: 0 });
    day.n++;
    if (grade === 'again') { day.again++; st.again++; } else st.good++;
    save();
  }
  st.i++;
  st.shown = false;
  st.sure = null;
  if (sheetSubmit && sheetSubmit.redraw) sheetSubmit.redraw();
}

// ---------- practice sessions ----------
// One sheet, three states: name the target, run the clock, say what broke.
// ponytail: closing the sheet mid-session throws it away. Sessions are minutes long.

function practiceSheet() {
  const setup = () => `
    <label class="f">Goal</label>

      `<option value="${esc(g.id)}">${esc(g.statement)}</option>`).join('')}</select>

    <label class="f">What exactly are you working on?</label>
    <input id="pFocus" placeholder="The left hand in bar 12" autocapitalize="sentences">
    <p class="hint" style="margin-top:6px">Not "practise piano". Name the thing you currently
      get wrong — that is the whole difference between practice and time spent.</p>

    <button class="btn" data-act="psStart">Start the clock</button>`;

  const running = s => `<div class="card" style="text-align:center">
      <div class="sub">${esc(s.focus)}</div>
      <div id="tclock" style="font-size:52px;font-weight:700;margin:16px 0;font-variant-numeric:tabular-nums">0:00</div>
      <p class="hint">Stay on the one thing. When it starts feeling comfortable, make it harder.</p>
    </div>
    <button class="btn" data-act="psStop">Stop</button>`;

  const rating = s => `

      `<button data-act="psDiff:${n}" aria-pressed="${s.difficulty === n}">${n}</button>`).join('')}</div>
    <p class="hint" style="margin-top:6px">1 is comfortable, 5 is at the edge of what you can do.
      Sessions that never pass 2 keep you exactly where you are.</p>

    <label class="f">What went wrong?</label>
    <textarea id="pWent" rows="2" placeholder="The specific failure, while you still remember it." autocapitalize="sentences"></textarea>

    <label class="f">What will you fix next time?</label>
    <input id="pNext" placeholder="One correction." autocapitalize="sentences">

      <span style="flex:1">Uninterrupted — no phone, no switching</span></label>

    <button class="btn" data-act="psSave">Save session</button>`;

  const body = () => {
    const s = S.session;
    if (!s) return setup();
    return s.ended ? rating(s) : running(s);

  S.session = null;
  openSheet('Practice', body(), () => {

// ---------- capture, and the plan for tomorrow ----------

const weekKey = day => 'w' + R.startOfWeek(day);

function captureSheet() {

/** Triage: every line becomes a task, a card, a goal, a habit, or nothing. */
function inboxSheet() {

/** Ivy Lee, 1918: at the end of the day write down the six things that matter tomorrow,
    in order, and work them top down. The ordering is the whole method. */
function planSheet(day) {
  const p = planFor(day) || { one: '', order: [] };
  const tmp = { order: p.order.slice() };
  const body = () => {
    const open = openTasks();
    const picked = tmp.order.map(id => open.find(t => t.id === id)).filter(Boolean);
    const rest = open.filter(t => !tmp.order.includes(t.id));
    return `
      <label class="f">The one thing</label>
      <input id="plOne" value="${esc(p.one || '')}" placeholder="What makes everything else easier or unnecessary?" autocapitalize="sentences">
      <p class="hint" style="margin-top:6px">If tomorrow gives you one hour, this is what it goes on.</p>

      <label class="f">Then, in order — six at most</label>
      ${picked.length ? `<ul class="list">${picked.map((t, i) => `<li>
        <span class="tick">${i + 1}</span>
        <div style="flex:1"><div>${esc(t.title)}</div>
          <div class="meta">${t.deep ? `<span>${ic('headphones')} deep</span>` : ''}${t.due ? `<span>${esc(fmtDue(t.due))}</span>` : ''}</div></div>
        <button data-act="planUp:${t.id}" style="font-size:17px;width:28px">↑</button>
        <button data-act="planOff:${t.id}" style="color:var(--red);font-size:13px">Drop</button></li>`).join('')}</ul>`
        : '<p class="hint">Nothing picked yet.</p>'}

      ${tmp.order.length < 6 && rest.length ? `<label class="f">Add one</label>
        <ul class="list">${rest.slice(0, 14).map(t => `<li data-act="planOn:${t.id}">
          <span class="tick">＋</span><div style="flex:1"><div>${esc(t.title)}</div>
          <div class="meta">${t.due ? `<span>${esc(fmtDue(t.due))}</span>` : '<span>no date</span>'}
            ${t.priority === 2 ? '<span class="pill">High</span>' : ''}</div></div></li>`).join('')}</ul>`
        : tmp.order.length >= 6 ? '<p class="hint">Six is the limit, and the limit is the method.</p>' : ''}

      <button class="btn" data-act="savePlan:${day}">Save the plan</button>`;
  };
  openSheet('Plan ' + (day === today() ? 'today' : dayTitle(day)), body(), () => {
    sheetSubmit = { tmp, redraw: () => {
      const one = val('plOne');
      $('#sheetInner').innerHTML = body();
      const e = document.getElementById('plOne');
      if (e && one) e.value = one;
    } };
  });
}

/** The morning face of that plan: one thing, then the list, top down. */
function todayPlanCard() {
  const d = today();
  const p = planFor(d);
  const wk = DB.plans[weekKey(d)];
  const hour = new Date().getHours();
  let out = '';

  if (wk && wk.one)
    out += `<button class="card" style="display:block;width:100%;text-align:left" data-act="weekone">
      <span class="sub" style="display:block">This week's one thing</span>
      <span style="font-weight:600;font-size:15px;display:block;margin-top:4px">${esc(wk.one)}</span></button>`;

  if (p && (p.one || (p.order || []).length)) {
    const rows = (p.order || []).map(id => DB.tasks.find(t => t.id === id)).filter(Boolean);
    const nextUp = rows.find(t => !t.done);
    out += `<div class="card"><h2>${ic('target')} Today, in order</h2>
      ${p.one ? `<div class="intent" style="margin-top:0;margin-bottom:12px">

      ${rows.length ? `<ul class="list">${rows.map((t, i) => `<li>

        <div style="flex:1" data-act="tbrief:${t.id}">
          <div class="${t.done ? 'strike' : ''}"${!t.done && t === nextUp ? ' style="font-weight:600"' : ''}>${i + 1}. ${esc(t.title)}</div>
          ${!t.done && t === nextUp ? '<div class="meta"><span style="color:var(--tint)">start here</span></div>' : ''}
        </div></li>`).join('')}</ul>` : ''}
      <button class="mini" data-act="plan:${d}" style="margin-top:12px">Edit the plan</button></div>`;
  } else if (hour >= 17) {
    out += `<button class="card coachcard" data-act="plan:${R.addDays(d, 1)}">
      <div class="row" style="align-items:flex-start"><span class="cico">${ic('moon')}</span>
        <span style="flex:1"><span class="sub" style="display:block;margin-bottom:3px">Tonight</span>
          Write down tomorrow's six, in order. Deciding now costs a minute; deciding at

          ${DB.inbox.length} thing${DB.inbox.length === 1 ? '' : 's'} waiting to be sorted.</span>
        <span class="chev">›</span></div></button>`;

}
