// ---------- the habit scorecard ----------
// Atomic Habits' opening exercise: list what you actually do and mark each one against
// the person you said you were becoming. It is an audit, and it should produce deletions.

const MARKS = [['+', 'Helps', 'var(--green)'], ['=', 'Neutral', 'var(--dim)'], ['-', 'Hurts', 'var(--red)']];

function growScorecard() {
  const live = liveHabits();
  if (!live.length) return `<div class="card"><p class="hint">Nothing to score yet.</p></div>`;
  const idents = liveGoals().filter(g => g.identity);
  return `<div class="card">
    <h2>${ic('receipt')} Habit scorecard</h2>
    <p class="hint" style="margin-bottom:4px">Mark each habit against who you said you were
      becoming. Not against how it feels — against whether it votes for that person.</p>
    ${idents.length ? `<div class="intent" style="margin-bottom:6px">${idents.map(g =>
      esc(g.identity)).join('<br>')}</div>` : ''}
  </div>
  ${live.map(h => {
    const r = R.completionRate(h, logValue, today(), 30);
    return `<div class="card" style="--hc:${esc(h.color)}">
      <div class="row"><span class="hico">${esc(h.icon)}</span>
        <div style="flex:1"><div style="font-weight:600">${esc(h.name)}</div>
          <div class="sub">${Math.round(r.rate * 100)}% of 30 days${h.goalId && goalById(h.goalId)
            ? ' · ' + esc(goalById(h.goalId).statement) : ' · serves nothing'}</div></div>
      </div>
      <div class="stars" style="margin-top:12px">${MARKS.map(m =>
        `<button data-act="mark:${h.id}|${encodeURIComponent(m[0])}" aria-pressed="${h.mark === m[0]}"
          style="${h.mark === m[0] ? '' : 'color:' + m[2]}">${m[0]} ${m[1]}</button>`).join('')}</div>
      ${h.mark === '-' ? `<p class="hint" style="margin-top:10px">Marked as working against you.
        Either change what it is, or archive it — carrying it is the worst of both.</p>
        <button class="mini" data-act="hedit:${h.id}" style="margin-top:8px">Change it</button>` : ''}
    </div>`;
  }).join('')}`;
}

// ---------- the quarterly review ----------
// Weekly asks what happened. Quarterly asks what compounded, which is a different
// question and the only one that catches a habit quietly dying over ten weeks.

function growQuarter() {
  const t = today();
  const from = R.addDays(t, -89);
  const half = R.addDays(t, -44);
  const rows = liveHabits().map(h => {
    const early = R.completionRate(h, logValue, R.addDays(half, -1), 45);
    const late = R.completionRate(h, logValue, t, 45);
    return { h, early, late, move: (late.total && early.total) ? late.rate - early.rate : null };
  }).filter(x => x.move != null);
  const rising = rows.filter(x => x.move >= 0.1).sort((a, b) => b.move - a.move);
  const falling = rows.filter(x => x.move <= -0.1).sort((a, b) => a.move - b.move);
  const gs = liveGoals();
  const hit = gs.filter(g => goalPct(g) >= 1);
  const stalled = gs.filter(g => {
    const p = g.target ? R.goalPace(g, goalDone(g.id), t) : null;
    return p && p.pct < 1 && p.ahead < 0;
  });
  const dq = R.deepShare(DB.tasks.filter(x => x.done).concat(DB.sessions), from, t);
  const saved = (DB.reviews[t] || {}).quarter;

  const bar = x => `<div style="margin-bottom:13px">
    <div class="row"><span>${esc(x.h.icon)} ${esc(x.h.name)}</span><span class="spacer"></span>
      <span class="sub mono">${Math.round(x.early.rate * 100)}% → ${Math.round(x.late.rate * 100)}%</span></div>
    <div class="bar" style="margin-top:6px"><i style="width:${Math.round(x.late.rate * 100)}%;background:${
      x.move >= 0 ? 'var(--green)' : 'var(--red)'}"></i></div></div>`;

  return `<div class="card">
    <h2>${ic('history')} The last 90 days</h2>
    <p class="hint">${esc(fmtDue(from))} – ${esc(fmtDue(t))}. The weekly review asks what
      happened. This one asks what compounded — the only question that catches something
      dying slowly enough to look fine every single week.</p>
  </div>

  ${rising.length ? `<div class="card"><h2>${ic('trend-up')} Compounding</h2>${rising.map(bar).join('')}
    <p class="hint">These got stronger across the quarter. Whatever you changed, it worked —
      the flywheel is the same push applied in the same direction, not a new push.</p></div>` : ''}

  ${falling.length ? `<div class="card"><h2>${ic('trend-down')} Decaying</h2>${falling.map(bar).join('')}
    <p class="hint">Down across the quarter. Each of these is a decision you have not made
      yet: shrink it, change it, or stop pretending and archive it.</p></div>` : ''}

  ${!rising.length && !falling.length ? `<div class="card"><h2>${ic('flat')} Flat</h2>
    <p class="hint">Nothing moved much in either direction. Steady is not nothing — but if
      you wanted a different result this quarter, nothing here was going to produce one.</p></div>` : ''}

  <div class="card"><h2>${ic('target')} Goals</h2>
    ${hit.length ? `<p class="hint"><b>Reached:</b> ${hit.map(g => esc(g.statement)).join(', ')}</p>` : ''}
    ${stalled.length ? `<p class="hint"><b>Behind:</b> ${stalled.map(g => esc(g.statement)).join(', ')}</p>` : ''}
    ${!gs.length ? '<p class="hint">No goals to judge the quarter against.</p>' : ''}
    ${dq ? `<p class="hint" style="margin-top:10px"><b>Deep work:</b> ${dq.deep} of ${dq.total}
      finished tasks and sessions needed real concentration (${Math.round(dq.share * 100)}%).</p>` : ''}
  </div>

  <div class="card"><h2>${ic('pen')} Three harder questions</h2>
    <label class="f">What is the one thing that actually moved the needle?</label>
    <textarea id="qtWorked" rows="2" autocapitalize="sentences">${esc(saved ? saved.worked : '')}</textarea>
    <label class="f">What are you going to stop doing?</label>
    <textarea id="qtStop" rows="2" placeholder="Something has to come off. Name it." autocapitalize="sentences">${esc(saved ? saved.stop : '')}</textarea>
    <label class="f">What is the next 90 days for?</label>
    <input id="qtNext" value="${esc(saved ? saved.next : '')}" autocapitalize="sentences">
    <button class="btn" data-act="saveQuarter">${saved ? 'Update' : 'Save this review'}</button>
  </div>`;
}

const REVIEWS = [['week', 'Week'], ['quarter', 'Quarter'], ['scorecard', 'Scorecard']];

function growReviewTab() {
  const seg = `<div class="seg" style="margin-top:-6px">${REVIEWS.map(r =>
    `<button data-act="reviewview:${r[0]}" aria-pressed="${S.reviewView === r[0]}">${r[1]}</button>`).join('')}</div>`;
  return seg + (S.reviewView === 'quarter' ? growQuarter()
    : S.reviewView === 'scorecard' ? growScorecard() : growReview());
}

// ---------- calendar ----------
// Every day carries three marks — habits, money, tasks — whatever the heat is set to.
// The grid was a habit heatmap with the other two tracks hidden one tap away; the
// marks are what make it a calendar of the whole app rather than of one third of it.

const CALVIEWS = [['all', 'All', 'var(--tint)'], ['habits', 'Habits', 'var(--tint)'],
                  ['money', 'Money', 'var(--red)'], ['tasks', 'Tasks', 'var(--green)'],
                  ['learn', 'Learn', 'var(--purple)']];
const calColor = () => (CALVIEWS.find(v => v[0] === S.calView) || CALVIEWS[0])[2];

function viewCal() {
  let out = `<div class="seg">
    <button data-act="calmode:day" aria-pressed="${S.calMode === 'day'}">Day</button>
    <button data-act="calmode:month" aria-pressed="${S.calMode === 'month'}">Month</button>
    <button data-act="calmode:year" aria-pressed="${S.calMode === 'year'}">Year</button></div>`;
  // The track switch shades a heatmap; there is no heatmap on a single day.
  if (S.calMode === 'day') return out + viewDay();
  out += `<div class="seg" style="margin-top:-6px">${CALVIEWS.map(v =>
      `<button data-act="calview:${v[0]}" aria-pressed="${S.calView === v[0]}">${v[1]}</button>`).join('')}</div>`;
  out += S.calMode === 'month' ? monthGrid() : yearGrid();
  out += `<div class="legend">Less
    ${[0, .25, .5, .75, 1].map(l => `<i style="background:${heat(l, calColor())}"></i>`).join('')} More</div>
  <div class="legend" style="margin-top:10px;gap:14px">
    <span><i style="background:var(--tint)"></i>habits</span>
    <span><i style="background:var(--red)"></i>money</span>
    <span><i style="background:var(--green)"></i>tasks</span>
    <span><i style="background:var(--purple)"></i>learning</span></div>`;
  return out;
}

function heat(score, color) {
  if (score == null || score <= 0) return 'var(--card2)';
  return `color-mix(in srgb, ${color || 'var(--tint)'} ${Math.round(15 + score * 85)}%, transparent)`;
}

/** The three dots under a day number. null means that track had nothing to say. */
function dayMarks(key) {
  const t = today();
  const hs = scheduledOn(key);
  const tx = idx().tx[key] || [];
  const tk = idx().tk[key] || [];
  const open = tk.filter(x => !x.done).length;
  const spent = R.spend(tx.map(x => x.amount));
  const rv = DB.reviews[key];
  return {
    h: hs.length ? hs.reduce((s, x) => s + habitProgress(x, key), 0) / hs.length : null,
    m: spent > 0 ? 'var(--red)' : R.income(tx.map(x => x.amount)) > 0 ? 'var(--green)' : null,
    t: !tk.length ? null : !open ? 'var(--green)' : key < t ? 'var(--red)' : 'var(--orange)',
    l: rv && rv.n ? 'var(--purple)' : null,
  };
}

/** What the heat shows, per the selected track. */
function daySignal(key, ctx, maxSpend) {
  if (S.calView === 'habits') return dayScore(key);
  if (S.calView === 'money') return maxSpend > 0 ? (idx().spendDay[key] || 0) / maxSpend : null;
  if (S.calView === 'tasks') {
    const tk = idx().tk[key] || [];
    return tk.length ? tk.filter(x => x.done).length / tk.length : null;
  }
  if (S.calView === 'learn') {
    const rv = DB.reviews[key];
    return rv && rv.n ? Math.min(1, rv.n / 10) : null;
  }
  return R.dayIndex(key, ctx).score;
}

function dayCell(key, label, ctx, maxSpend) {
  const t = today();
  const m = dayMarks(key);
  const dot = c => (c ? `<i style="background:${c}"></i>` : '<i class="off"></i>');
  return `<button class="day${key === t ? ' today' : ''}${key > t ? ' future' : ''}"
    data-act="calday:${key}" style="background:${heat(daySignal(key, ctx, maxSpend), calColor())}">
    <span class="dnum">${label}</span>
    <span class="marks">${dot(m.h == null ? null : heat(m.h, 'var(--tint)'))}${dot(m.m)}${dot(m.t)}${dot(m.l)}</span>
  </button>`;
}

function monthGrid() {
  const anchor = R.fromYMD(S.calAnchor);
  const y = anchor.getFullYear(), m = anchor.getMonth();
  const first = R.ymd(new Date(y, m, 1));
  const total = R.daysInMonth(y, m + 1);
  const lead = R.weekdayOf(first);
  const t = today();
  const ctx = indexCtx();

  const keys = Array.from({ length: total }, (_, i) => R.addDays(first, i));
  const maxSpend = Math.max(0, ...keys.map(k => idx().spendDay[k] || 0));

  let cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<div class="dow">${x}</div>`).join('');
  cells += Array.from({ length: lead }, () => `<div></div>`).join('');
  keys.forEach((key, i) => { cells += dayCell(key, i + 1, ctx, maxSpend); });

  // The month in one line, across all three tracks — the thing the grid is for.
  const past = keys.filter(k => k <= t);
  const checkins = past.reduce((s, k) => s + scheduledOn(k).filter(h => habitDone(h, k)).length, 0);
  const scheduled = past.reduce((s, k) => s + scheduledOn(k).length, 0);
  const spent = R.spend(monthTxns(R.monthKey(first)).map(x => x.amount));
  const tasks = keys.reduce((a, k) => {
    const tk = idx().tk[k] || [];
    return { done: a.done + tk.filter(x => x.done).length, all: a.all + tk.length };
  }, { done: 0, all: 0 });

  return `<div class="card">
    <div class="row" style="margin-bottom:12px">
      <button data-act="calshift:-1" style="font-size:20px;width:32px">‹</button>
      <span class="spacer" style="text-align:center;font-weight:600">${
        anchor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</span>
      <button data-act="caltoday" style="font-size:13px;color:var(--tint)">Today</button>
      <button data-act="calshift:1" style="font-size:20px;width:32px">›</button>
    </div>
    <div class="grid7">${cells}</div>
    <div class="divider"></div>
    <p class="hint">${scheduled ? `${checkins}/${scheduled} habit check-ins` : 'no habits scheduled'}
      · ${esc(money(spent))} spent · ${tasks.all ? `${tasks.done}/${tasks.all} tasks done` : 'no tasks due'}</p>
  </div>`;
}

function yearGrid() {
  const year = R.fromYMD(S.calAnchor).getFullYear();
  const start = `${year}-01-01`, end = `${year}-12-31`;
  const ctx = indexCtx();
  let maxSpend = 0;
  for (let k = start; k <= end; k = R.addDays(k, 1)) maxSpend = Math.max(maxSpend, idx().spendDay[k] || 0);

  let cells = Array.from({ length: R.weekdayOf(start) }, () => `<i style="background:transparent"></i>`).join('');
  for (let key = start; key <= end; key = R.addDays(key, 1))
    cells += `<i data-act="calday:${key}" style="background:${heat(daySignal(key, ctx, maxSpend), calColor())}"></i>`;

  return `<div class="card">
    <div class="row" style="margin-bottom:12px">
      <button data-act="calshift:-12" style="font-size:20px;width:32px">‹</button>
      <span class="spacer" style="text-align:center;font-weight:600">${year}</span>
      <button data-act="caltoday" style="font-size:13px;color:var(--tint)">This year</button>
      <button data-act="calshift:12" style="font-size:20px;width:32px">›</button>
    </div>
    <div class="yearwrap"><div class="year">${cells}</div></div>
    <p class="hint" style="margin-top:10px">Each square is a day, shaded by
      ${esc((CALVIEWS.find(v => v[0] === S.calView) || CALVIEWS[0])[1].toLowerCase())}. Tap one to open it.</p>
  </div>`;
}

// ---------- finance ----------
function viewFin() {
  const mk = S.finMonth;
  const txns = monthTxns(mk);
  const spent = R.spend(txns.map(t => t.amount));
  const earned = R.income(txns.map(t => t.amount));
  const bud = budgetTotal();
  const net = DB.accounts.reduce((s, a) => s + accountBalance(a), 0);
  const anchor = R.fromYMD(mk + '-01');

  let out = `<div class="row" style="margin-bottom:14px">
    <button data-act="finshift:-1" style="font-size:20px;width:32px">‹</button>
    <span class="spacer" style="text-align:center;font-weight:600">${
      anchor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</span>
    <button data-act="finshift:1" style="font-size:20px;width:32px">›</button>
  </div>`;

  out += `<div class="card"><h2>${ic('swap')} This month</h2><div class="row" style="text-align:center">
    <div style="flex:1"><div style="font-weight:600;color:var(--red)">${esc(money(spent))}</div><div class="sub">Spent</div></div>
    <div style="flex:1"><div style="font-weight:600;color:var(--green)">${esc(money(earned))}</div><div class="sub">Earned</div></div>
    <div style="flex:1"><div style="font-weight:600">${esc(money(earned - spent))}</div><div class="sub">Net</div></div>
  </div></div>`;

  out += `<div class="card"><h2>${ic('wallet')} Accounts — ${esc(money(net))}</h2>`;
  if (!DB.accounts.length) out += `<p class="hint">No accounts yet.</p>`;
  else out += `<div class="strip">${DB.accounts.map(a => {
    const b = accountBalance(a);
    return `<div class="chip" style="flex-basis:140px">
      <div class="sub">${esc(a.kind)}</div>
      <div style="font-weight:500;margin:6px 0">${esc(a.name)}</div>
      <div style="font-weight:600;color:${b < 0 ? 'var(--red)' : 'inherit'}">${esc(money(b))}</div></div>`;
  }).join('')}</div>`;
  out += `<button class="btn sec" data-act="accounts">Manage accounts</button></div>`;

  out += `<div class="card"><h2>${ic('target')} Budget</h2>`;
  if (bud) {
    const ratio = Math.min(spent / bud, 1) * 100;
    const col = spent > bud ? 'var(--red)' : ratio > 80 ? 'var(--orange)' : 'var(--green)';
    out += `<div class="row"><span>Overall</span><span class="spacer"></span>
      <span class="sub mono">${esc(money(spent))} / ${esc(money(bud))}</span></div>
      <div class="bar" style="margin-top:8px"><i style="width:${ratio}%;background:${col}"></i></div>`;
  } else out += `<p class="hint">No monthly budget set.</p>`;
  Object.keys(DB.budgets).filter(c => c !== TOTAL && DB.budgets[c] > 0).forEach(c => {
    const used = R.spend(txns.filter(t => t.category === c).map(t => t.amount));
    const lim = DB.budgets[c];
    out += `<div class="divider"></div>
      <div class="row"><span>${catIcon(c)} ${esc(c)}</span><span class="spacer"></span>
      <span class="sub mono">${esc(money(used))} / ${esc(money(lim))}</span></div>
      <div class="bar" style="margin-top:8px"><i style="width:${Math.min(used / lim, 1) * 100}%;background:${
        used > lim ? 'var(--red)' : 'var(--tint)'}"></i></div>`;
  });
  out += `<button class="btn sec" data-act="budgets">Set budgets</button></div>`;

  const byCat = {};
  txns.filter(t => t.amount < 0).forEach(t => { byCat[t.category] = (byCat[t.category] || 0) - t.amount; });
  const slices = Object.keys(byCat).map(c => ({ category: c, amount: byCat[c] })).sort((a, b) => b.amount - a.amount);
  if (slices.length) {
    out += `<div class="card"><h2>${ic('pie')} Where it went</h2>${donut(slices)}
      <div class="lg">${slices.map((s, i) =>
        `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(s.category)} ${
          Math.round((s.amount / spent) * 100)}%</span>`).join('')}</div>
      ${slices.slice(0, 5).map(s => `<div class="row" style="margin-top:10px">
        <span>${catIcon(s.category)} ${esc(s.category)}</span><span class="spacer"></span>
        <span class="mono">${esc(money(s.amount))}</span></div>`).join('')}
    </div>`;
  }

  const months = [], inc = [], exp = [], run = [];
  let cursor = mk, running = DB.accounts.reduce((s, a) => s + (a.opening || 0), 0);
  for (let i = 5; i >= 0; i--) {
    const d = R.fromYMD(mk + '-01'); d.setMonth(d.getMonth() - i);
    months.push(R.monthKey(R.ymd(d)));
  }
  const firstMonth = months[0];
  DB.txns.filter(t => R.monthKey(t.date) < firstMonth).forEach(t => { running += t.amount; });
  months.forEach(m => {
    const a = monthTxns(m).map(t => t.amount);
    inc.push(R.income(a)); exp.push(R.spend(a));
    running += a.reduce((s, x) => s + x, 0); run.push(running);
  });
  const labels = months.map(m => R.fromYMD(m + '-01').toLocaleDateString(undefined, { month: 'narrow' }));

  out += `<div class="card"><h2>${ic('trend-up')} Cash flow</h2>
    ${plot([{ color: 'var(--green)', points: inc }, { color: 'var(--red)', points: exp }], labels)}
    <div class="lg"><span><i style="background:var(--green)"></i>Income</span>
      <span><i style="background:var(--red)"></i>Expense</span></div></div>`;

  out += `<div class="card"><h2>${ic('bars')} Balance trend</h2>
    ${plot([{ color: 'var(--tint)', points: run }], labels, { area: true })}</div>`;

  out += `<div class="card"><h2>${ic('list')} Entries</h2>`;
  if (!txns.length) out += `<p class="hint">Nothing logged this month yet.</p>`;
  else out += `<ul class="list">${txns.slice().sort((a, b) => b.date.localeCompare(a.date)).map(t => {
    const acc = DB.accounts.find(a => a.id === t.accountId);
    const hb = habitById(t.habitId);
    return `<li data-act="txedit:${t.id}"><span class="tick">${catIcon(t.category)}</span>
      <div style="flex:1"><div>${esc(t.note || t.category)}</div>
        <div class="meta"><span>${esc(fmtDue(t.date))}</span>${acc ? `<span>· ${esc(acc.name)}</span>` : ''}
        ${hb ? `<span>${ic('link')} ${esc(hb.name)}</span>` : ''}</div></div>
      <span class="mono" style="color:${t.amount < 0 ? 'inherit' : 'var(--green)'}">${
        t.amount < 0 ? '-' : '+'}${esc(money(Math.abs(t.amount)))}</span></li>`;
  }).join('')}</ul>`;
  out += `</div>`;
  out += tradingCard();
  return out;
}

// ---------- trading journal ----------
const tradeGoal = () => DB.goals.find(g => g.track && g.track.trades && !g.archived);
const pctOr = x => (x == null ? '—' : Math.round(x * 100) + '%');
const fmtR = r => (r == null ? '—' : (r > 0 ? '+' : '') + r + 'R');

function tradingCard() {
  const s = R.tradeStats(DB.trades), g = tradeGoal();
  const ts = DB.trades.slice().sort((a, b) => b.date.localeCompare(a.date));
  const risk = g ? (g.risk ? `${g.risk}% of the account` : 'paper only') : null;
  return `<div class="card"><h2>${ic('bars')} Trading journal</h2>
    ${risk ? `<p class="hint">Risk per trade now: <b>${risk}</b>. It goes up one step only after 50 trades
      with a positive expectancy and 90%+ of your rules kept, and down one after a 6R drawdown.</p>` : ''}
    <div class="row" style="flex-wrap:wrap;gap:18px;margin:12px 0">${[
      ['Trades', s.n], ['Expectancy', s.n ? fmtR(s.expectancy) : '—'], ['Win rate', pctOr(s.winRate)],
      ['Rules kept', pctOr(s.compliance)], ['Max drawdown', s.n ? s.maxDD + 'R' : '—']].map(([k, v]) =>
      `<div><div class="big" style="font-size:20px">${esc(v)}</div><div class="hint">${k}</div></div>`).join('')}</div>
    ${ts.length ? `<ul class="list">${ts.slice(0, 10).map(t => `<li data-act="tradeedit:${t.id}">
      <div style="flex:1"><div>${esc(t.ticker)} <span class="hint">· ${esc(t.side)} · ${esc(t.setup || 'no setup named')}</span></div>
        <div class="meta"><span>${esc(fmtDue(t.date))}</span>${t.rules ? '' : '<span style="color:var(--orange)">rule broken</span>'}
        ${t.note ? `<span>${esc(t.note)}</span>` : ''}</div></div>
      <span class="mono" style="color:${t.r > 0 ? 'var(--green)' : t.r < 0 ? 'var(--red)' : 'inherit'}">${esc(fmtR(t.r))}</span></li>`).join('')}</ul>`
      : `<p class="hint">Log every closed trade, paper ones included. Expectancy is the average R per trade; above zero after costs is the only number that says there is an edge.</p>`}
    <button class="btn" data-act="tradenew">Log a trade</button></div>`;
}

    <input id="trNote" value="${n(t && t.note)}" placeholder="What would you do the same or differently?">
    <p class="hint" style="margin-top:8px">R is worked out for you: (exit − entry) ÷ (entry − stop), flipped for a short.</p>
    <button class="btn" data-act="saveTrade">${t ? 'Save changes' : 'Log trade'}</button>
    ${t ? `<button class="btn danger" data-act="delTrade:${t.id}">Delete</button>` : ''}`, () => {
    sheetSubmit = { save() {
      const side = val('trSide') === 'short' ? 'short' : 'long';
      const entry = num('trEntry'), stop = num('trStop'), exit = num('trExit');

      const ticker = val('trTicker').trim().toUpperCase();
      if (!ticker) { alert('Which ticker?'); return; }
      if (r == null) { alert(side === 'long' ? 'For a long, the stop has to be below the entry.' : 'For a short, the stop has to be above the entry.'); return; }
      const rec = t || { id: uid() };
      Object.assign(rec, { date: val('trDate') || today(), ticker, side, setup: val('trSetup').trim(),
        entry, stop, exit, r, rules: !!(document.getElementById('trRules') || {}).checked, note: val('trNote').trim() });
      if (!t) DB.trades.push(rec);
      runAdapt(); // a 50th trade or a drawdown changes the size right away
      save(); closeSheet(); render();
    } };
  });
}

// ---------- tasks ----------
function viewTasks() {
  const sw = `<div class="seg">${[['tasks', 'Tasks'], ['apps', 'Applications']].map(([k, n]) =>
    `<button data-act="taskview:${k}" aria-pressed="${S.taskView === k}">${n}</button>`).join('')}</div>`;
  return sw + (S.taskView === 'apps' ? viewApps() : viewTaskList());
}

function viewTaskList() {
  const f = S.taskFilter, t = today();
  let list = DB.tasks;
  if (f === 'open') list = list.filter(x => !x.done);
  else if (f === 'today') list = list.filter(x => !x.done && x.due === t);
  else if (f === 'overdue') list = list.filter(isOverdue);
  else list = list.filter(x => x.done);

  const order = (a, b) => {
    if (isOverdue(a) !== isOverdue(b)) return isOverdue(a) ? -1 : 1;
    const ad = a.due || '9999', bd = b.due || '9999';
    if (ad !== bd) return ad.localeCompare(bd);
    return (b.priority || 1) - (a.priority || 1);
  };
  const groups = {};
  list.forEach(x => { (groups[x.project] = groups[x.project] || []).push(x); });

  let out = `<div class="seg">${['open', 'today', 'overdue', 'done'].map(k =>
    `<button data-act="taskfilter:${k}" aria-pressed="${f === k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>`;

  const names = Object.keys(groups).sort();
  if (!names.length) return out + `<div class="card"><p class="hint">
    ${f === 'done' ? 'Completed tasks will show up here.' : 'Nothing here. Tap + to add a task.'}</p></div>`;

  names.forEach(name => {
    out += `<div class="card"><h2>${esc(name)}</h2><ul class="list">${groups[name].sort(order).map(x => {
      const subs = x.subtasks || [];
      const hb = habitById(x.habitId);
      return `<li><button class="tick" data-act="taskdone:${x.id}">${x.done ? '✅' : '○'}</button>
        <div style="flex:1" data-act="tbrief:${x.id}">
          <div class="${x.done ? 'strike' : ''}">${esc(x.title)}</div>
          <div class="meta">
            ${x.due ? `<span${isOverdue(x) ? ' style="color:var(--red)"' : ''}>${ic('clock')} ${esc(fmtDue(x.due))}</span>` : ''}
            ${subs.length ? `<span>☰ ${subs.filter(s => s.done).length}/${subs.length}</span>` : ''}
            ${hb ? `<span>${ic('link')} ${esc(hb.name)}</span>` : ''}
            ${x.priority === 2 ? '<span class="pill">High</span>' : ''}
          </div></div></li>`;
    }).join('')}</ul></div>`;
  });
  return out;
}

// ---------- sheet plumbing ----------
let sheetSubmit = null;
function openSheet(title, body, onMount) {
  clearTimeout(S.sheetT); // a close still animating out must not wipe this content
  $('#sheetBody').innerHTML = `<div class="grab"></div>
    <header><button data-act="close">Cancel</button><h1>${esc(title)}</h1><span style="width:32px"></span></header>
    <div id="sheetInner">${body}</div>`;
  const s = $('#sheet');
  s.classList.add('open');
  // One frame between display:block and the class that transitions — without it the
  // browser has nothing to animate from.
  if (window.requestAnimationFrame) requestAnimationFrame(() => s.classList.add('in'));
  else s.classList.add('in');
  document.body.style.overflow = 'hidden';
  if (onMount) onMount();
}
function closeSheet() {
  const s = $('#sheet');
  s.classList.remove('in');
  document.body.style.overflow = '';
  sheetSubmit = null;
  S.study = null;
  S.session = null;
  clearInterval(S.clockId);
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  clearTimeout(S.sheetT);
  S.sheetT = setTimeout(() => { s.classList.remove('open'); $('#sheetBody').innerHTML = ''; }, 300);
}

}

// ---------- habit check-in ----------
function habitDaySheet(hid, day) {
  const h = habitById(hid);
  if (!h) return;
  const g = R.goalOf(h);

  function body() {
    const log = logOf(hid, day) || { v: 0, c: [], n: '' };
    const p = Math.round(R.fraction(log.v, g) * 100);
    let ctl = '';
    if (h.kind === 'checkbox') {
      ctl = `<div class="check"><span style="flex:1">Done</span>
        <button class="sw" data-act="hToggle" aria-pressed="${log.v >= g}"></button></div>`;
    } else if (h.kind === 'counter' || h.kind === 'timer') {
      const step = h.kind === 'timer' ? 5 : 1;
      ctl = `<div class="row" style="justify-content:center;gap:20px;margin:16px 0">
        <button data-act="hBump:${-step}" style="font-size:30px;width:52px;height:52px;border-radius:26px;background:var(--card)">−</button>
        <div style="text-align:center;min-width:110px"><div class="big">${Math.round(log.v)}</div>
          <div class="sub">of ${g}${h.kind === 'timer' ? ' min' : ''}</div></div>
        <button data-act="hBump:${step}" style="font-size:30px;width:52px;height:52px;border-radius:26px;background:var(--card)">+</button>
      </div>`;
      if (h.kind === 'timer') {
        ctl += S.timer
          ? `<div style="text-align:center"><div class="big mono" id="tclock">0:00</div>
             <button class="btn" data-act="stopTimer">Stop &amp; log</button></div>`
          : `<button class="btn sec" data-act="startTimer">${ic('play')} Start timer</button>`;
      }
    } else {
      ctl = (h.checklist || []).map(item => `<div class="check">
        <button data-act="hStepTog:${encodeURIComponent(item)}" style="font-size:20px">${
          (log.c || []).includes(item) ? '✅' : '○'}</button>
        <span style="flex:1">${esc(item)}</span></div>`).join('');
    }
    return `<div class="card">
        <div class="row"><span style="font-size:22px">${esc(h.icon)}</span>
          <strong style="flex:1">${esc(h.name)}</strong>
          <span class="sub mono">${Math.round(log.v)} / ${g}</span></div>
        <div class="bar" style="margin-top:10px"><i style="width:${p}%;background:${esc(h.color)}"></i></div>
        ${streakOf(h) ? `<p class="hint" style="margin-top:10px"><span class="flame">${ic('flame')}</span> ${streakOf(h)} day streak</p>` : ''}
      </div>
      <div class="card"><h2>${esc(R.fromYMD(day).toLocaleDateString(undefined,
        { weekday: 'long', day: 'numeric', month: 'long' }))}</h2>${ctl}</div>
      <label class="f">Note</label>
      <textarea id="hNote" style="min-height:60px" placeholder="Optional">${esc(log.n || '')}</textarea>
      <button class="btn" data-act="saveNote:${hid}|${day}">Done</button>
      <button class="btn sec" data-act="hedit:${hid}">Edit habit</button>`;
  }

  function redraw() { $('#sheetInner').innerHTML = body(); tickClock(); }
  openSheet('Check in', body(), () => { sheetSubmit = { redraw, habit: h, day }; tickClock(); });
}

function tickClock() {
  if (!S.timer) return;
  const paint = () => {
    const el = document.getElementById('tclock');
    if (!el) return;
    const s = Math.floor((Date.now() - S.timer) / 1000);
    el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  paint();
  clearInterval(S.clockId);
  S.clockId = setInterval(paint, 1000);
}

// ---------- money editor ----------
function txnSheet(id, day) {
  const t = id ? DB.txns.find(x => x.id === id) : null;
  const isExp = t ? t.amount < 0 : true;
  const state = { exp: isExp };

  function body() {
    const cats = state.exp ? CATS : INCOME_CATS;
    const cur = t ? t.category : Object.keys(cats)[0];
    return `<div class="seg">
      <button data-act="txType:1" aria-pressed="${state.exp}">Expense</button>
      <button data-act="txType:0" aria-pressed="${!state.exp}">Income</button></div>
      <label class="f">Amount</label>
      <input id="txAmt" type="number" inputmode="decimal" step="0.01" min="0"
        value="${t ? Math.abs(t.amount) : ''}" placeholder="0.00">
      <label class="f">Category</label>
      <select id="txCat">${Object.keys(cats).map(c =>
        `<option ${cur === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <label class="f">Date</label>
      <input id="txDate" type="date" value="${esc(t ? t.date : (day || today()))}">
      <label class="f">Note</label>
      <input id="txNote" value="${esc(t ? t.note : '')}" placeholder="Coffee">
      <label class="f">Account</label>
      <select id="txAcc"><option value="">None</option>${DB.accounts.map(a =>
        `<option value="${esc(a.id)}" ${t && t.accountId === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <label class="f">Link to habit</label>
      <select id="txHabit"><option value="">None</option>${liveHabits().map(h =>
        `<option value="${esc(h.id)}" ${t && t.habitId === h.id ? 'selected' : ''}>${esc(h.name)}</option>`).join('')}</select>
      <button class="btn" data-act="saveTxn">${t ? 'Save changes' : 'Add entry'}</button>
      ${t ? `<button class="btn danger" data-act="delTxn:${t.id}">Delete</button>` : ''}`;
  }

  function redraw() {
    const amt = val('txAmt'), note = val('txNote'), date = val('txDate');
    $('#sheetInner').innerHTML = body();
    document.getElementById('txAmt').value = amt;
    document.getElementById('txNote').value = note;
    if (date) document.getElementById('txDate').value = date;
  }

  openSheet(t ? 'Edit entry' : 'New entry', body(), () => {
    sheetSubmit = { state, redraw, save() {
      const amt = Math.abs(num('txAmt'));
      if (!(amt > 0)) { alert('Enter an amount.'); return; }
      const rec = t || { id: uid() };
      Object.assign(rec, {
        amount: state.exp ? -amt : amt,
        category: val('txCat'),
        date: val('txDate') || today(),
        note: val('txNote').trim(),
        accountId: val('txAcc') || null,
        habitId: val('txHabit') || null,
      });
      if (!t) DB.txns.push(rec);
      save();
      warnBudget(rec.date);
      closeSheet(); render();
    } };
  });
}

function warnBudget(dateKey) {
  const bud = budgetTotal();
  if (!bud) return;
  const spent = R.spend(monthTxns(R.monthKey(dateKey)).map(t => t.amount));
  if (spent > bud) toast(`Over budget — ${money(spent - bud)} past your ${money(bud)} cap.`);
  else if (spent / bud >= 0.8) toast(`${money(bud - spent)} left of this month's budget.`);
}

let toastTimer;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = `position:fixed;left:16px;right:16px;bottom:calc(140px + env(safe-area-inset-bottom));
      background:var(--card);border-radius:12px;padding:12px 14px;font-size:14px;z-index:30;
      box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center;
      animation:rise .25s cubic-bezier(.22,1,.36,1)`;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

      <select id="tkGoal"><option value="">— none —</option>${liveGoals().map(g =>

      <select id="tkHabit"><option value="">None</option>${liveHabits().map(h =>

      <p class="hint" style="margin-top:6px">Completing the task logs the habit for that day.</p>

      ${t ? `<button class="btn danger" data-act="delTask:${t.id}">Delete</button>` : ''}`;

  function redraw() {

function completeTask(id) {
  const t = DB.tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  t.completedAt = t.done ? today() : null;
  // Completing a task logs the habit it's linked to — the whole point of linking.
  if (t.done && t.habitId) {
    const h = habitById(t.habitId);
    if (h) setLog(h.id, today(), { v: Math.max(logValue(h.id, today()), R.goalOf(h)) });
  }
  runAdapt();
  save(); render();
}

// ---------- applications: jobs and degree programs ----------
const APP_KINDS = { job: 'Job', school: 'Program' };
const APP_DOCS = {
  job: ['Tailored resume', 'Cover letter', 'Referral or contact at the firm'],
  school: ['Statement of purpose', 'CV / resume', 'Transcripts', 'Recommendation letters',
           'Test scores (GRE / GMAT) or waiver', 'Application fee or waiver'],
};
const STAGE_NAMES = { saved: 'Saved', preparing: 'Preparing', applied: 'Applied', interview: 'Interviewing',
  waitlist: 'Waitlisted', offer: 'Offer', accepted: 'Accepted', rejected: 'Rejected', withdrawn: 'Withdrawn' };
const STAGE_COLORS = { interview: 'var(--tint)', waitlist: 'var(--orange)', offer: 'var(--green)',
  accepted: 'var(--green)', rejected: 'var(--red)' };
const SENT = ['applied', 'interview', 'waitlist', 'offer', 'accepted'];
const stageName = (s, kind) => (kind === 'school' && s === 'offer' ? 'Admitted' : STAGE_NAMES[s] || s);
const stagePill = a => `<span class="pill"${STAGE_COLORS[a.status] ? ` style="color:${STAGE_COLORS[a.status]}"` : ''}>${esc(stageName(a.status, a.kind))}</span>`;
const appOpen = a => !R.APP_CLOSED.includes(a.status);
const safeUrl = u => (/^https?:\/\//i.test(u || '') ? u : '');
const newDocs = kind => APP_DOCS[kind].map(title => ({ id: uid(), title, done: false }));

function appAttention() {
  const t = today();
  return DB.apps.flatMap(a => R.appAlerts(a, t).map(x => Object.assign({ app: a }, x)))
    .sort((x, y) => (y.late - x.late) || x.due.localeCompare(y.due));
}

function appTrack() {
  const att = appAttention();
  return trackRow({
    act: 'apps', icon: ic('inbox'), color: 'var(--orange)', name: 'Applications',
    sub: att.length ? `${att.length} need${att.length === 1 ? 's' : ''} you` : 'nothing to chase today',
    spark: '', value: DB.apps.filter(appOpen).length + ' active',
    delta: DB.apps.filter(a => a.status === 'interview').length + ' interviewing',
    deltaColor: att.some(x => x.late) ? 'var(--red)' : 'var(--dim)',
  });
}

function viewApps() {
  const t = today();
  const active = DB.apps.filter(appOpen);
  let out = queueCard();
  const att = appAttention();
  if (att.length) out += `<div class="card"><h2>${ic('clock')} Needs you</h2><ul class="list">${att.slice(0, 8).map(x => `
    <li data-act="appedit:${x.app.id}"><div style="flex:1">
      <div>${esc(x.app.org)} <span class="hint">· ${esc(x.app.title)}</span></div>
      <div class="meta"><span${x.late ? ' style="color:var(--red)"' : ''}>${esc(x.text)}</span></div></div>
      <span class="chev">›</span></li>`).join('')}</ul></div>`;

  // Counts, not conversion rates: a rate means nothing until there are a few dozen.
  if (DB.apps.length) {
    const n = s => DB.apps.filter(a => a.status === s).length;
    const sent = DB.apps.filter(a => a.appliedOn || SENT.includes(a.status)).length;
    out += `<div class="card"><h2>${ic('layers')} Pipeline</h2><div class="row" style="flex-wrap:wrap;gap:18px">
      ${[['Preparing', n('saved') + n('preparing')], ['Sent', sent], ['Interviewing', n('interview')],
         ['Offers / admits', n('offer') + n('accepted')]].map(([k, v]) =>
        `<div><div class="big" style="font-size:22px">${v}</div><div class="hint">${k}</div></div>`).join('')}
    </div></div>`;
  }

  out += `<div class="seg">${['active', 'closed'].map(k =>
    `<button data-act="appfilter:${k}" aria-pressed="${S.appFilter === k}">${k === 'active' ? `Active (${active.length})` : 'Closed'}</button>`).join('')}</div>`;
  const list = DB.apps.filter(a => (S.appFilter === 'active') === appOpen(a));
  // Furthest along first, then soonest deadline.
  const order = (a, b) => R.APP_STAGES.indexOf(b.status) - R.APP_STAGES.indexOf(a.status) ||
    (a.deadline || '9999').localeCompare(b.deadline || '9999');
  Object.keys(APP_KINDS).forEach(k => {
    const rows = list.filter(a => a.kind === k).sort(order);
    if (!rows.length) return;
    out += `<div class="card"><h2>${k === 'job' ? 'Jobs' : 'Degree programs'}</h2><ul class="list">${rows.map(a => {
      const docs = a.docs || [];
      return `<li data-act="appedit:${a.id}"><div style="flex:1">
        <div>${esc(a.org)} <span class="hint">· ${esc(a.title)}</span></div>
        <div class="meta">${stagePill(a)}
          ${a.deadline ? `<span${a.deadline < t && !SENT.includes(a.status) && appOpen(a) ? ' style="color:var(--red)"' : ''}>${ic('clock')} ${esc(fmtDue(a.deadline))}</span>` : ''}
          ${docs.length ? `<span>☰ ${docs.filter(d => d.done).length}/${docs.length}</span>` : ''}
          ${a.next ? `<span>→ ${esc(a.next)}</span>` : ''}</div></div>
        <span class="chev">›</span></li>`;
    }).join('')}</ul></div>`;
  });
  if (!list.length) out += `<div class="card"><p class="hint">${S.appFilter === 'active'
    ? 'Track every job and master’s program you apply to: the deadline, the documents, where it stands, and when to chase it.'
    : 'Accepted, rejected and withdrawn applications end up here.'}</p></div>`;
  out += `<div class="inline"><button class="btn" data-act="appnew:job">+ Job</button>
    <button class="btn sec" data-act="appnew:school">+ Degree program</button></div>`;
  return out;
}

function appSheet(id, kind) {
  const a = id ? DB.apps.find(x => x.id === id) : null;
  const k0 = a ? a.kind : (APP_DOCS[kind] ? kind : 'job');
  const tmp = { kind: k0, touched: !!a, docs: a ? (a.docs || []).map(d => Object.assign({}, d)) : newDocs(k0) };
  const F = ['apOrg', 'apTitle', 'apStatus', 'apDeadline', 'apApplied', 'apLink', 'apContact', 'apNext', 'apNextDate', 'apNotes', 'apGoal'];

  function body() {
    const school = tmp.kind === 'school';
    const link = a && safeUrl(a.link);
    return `<div class="seg">${Object.keys(APP_KINDS).map(k =>
        `<button data-act="appKind:${k}" aria-pressed="${tmp.kind === k}">${APP_KINDS[k]}</button>`).join('')}</div>
      <label class="f">${school ? 'School' : 'Company'}</label>

      <button class="btn sec" data-act="parseText">Find dates</button>
    </div>
    ${suggestions.length ? `<div class="card"><h2>${ic('sparkles')} Suggestions</h2>
      ${suggestions.map((s, i) => `<div class="check" style="align-items:flex-start">
        <span style="font-size:18px">${s.kind === 'habit' ? '🔁' : '☑️'}</span>
        <div style="flex:1">
          <input data-sug="${i}" value="${esc(s.title)}" style="padding:6px 8px;font-size:15px">
          <div class="meta" style="margin-top:4px">
            <span>${esc(new Date(s.when).toLocaleString(undefined,
              { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }))}</span>
            <span>· ${esc(s.source)}</span>
            ${s.kind === 'habit' ? '<span class="pill">repeats</span>' : ''}
          </div>
        </div>
        <button data-act="sugAdd:${i}" style="font-size:22px;color:var(--tint)">＋</button>
        <button data-act="sugDrop:${i}" style="font-size:18px;color:var(--dim);margin-left:8px">✕</button>
      </div>`).join('')}
      <button class="btn sec" data-act="sugAddAll">Add all</button></div>` : ''}`;
  }

  function redraw() { $('#sheetInner').innerHTML = body(); wire(); }

  function wire() {
    const f = document.getElementById('icsFile');
    if (f) f.onchange = () => {
      const file = f.files && f.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const known = new Set(DB.tasks.map(t => t.eventId).filter(Boolean));
        const found = R.parseICS(reader.result).filter(s => !known.has(s.uid));
        merge(found);
      };
      reader.readAsText(file);
    };
  }

  function merge(found) {
    if (!found.length) { toast('Nothing new with a date in there.'); return; }
    const seen = new Set(suggestions.map(s => s.title + '|' + s.when));
    found.forEach(s => { if (!seen.has(s.title + '|' + s.when)) suggestions.push(s); });
    redraw();
  }

  openSheet('Smart Add', body(), () => {
    wire();
    sheetSubmit = {
      redraw,
      get list() { return suggestions; },
      parse() { merge(R.parseText(val('smartText'), new Date(), DB.prefs.dayFirst)); },
      title(i) { const e = document.querySelector(`[data-sug="${i}"]`); return e ? e.value.trim() : suggestions[i].title; },
      accept(i) {
        const s = suggestions[i];
        if (!s) return;
        const title = this.title(i) || s.title;
        if (s.kind === 'habit') {
          DB.habits.push({ id: uid(), name: title, icon: '📅', color: PALETTE[DB.habits.length % PALETTE.length],
            kind: 'checkbox', schedule: s.weekday == null ? 'daily' : 'custom',
            weekdays: s.weekday == null ? [] : [s.weekday], monthDay: 1, target: 1, checklist: [],
            area: 'Career', archived: false, created: today(), sort: DB.habits.length });
        } else {
          const when = new Date(s.when);
          DB.tasks.push({ id: uid(), title, notes: '', due: R.ymd(when),
            dueTime: String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0'),
            project: 'Personal', priority: 1, done: false, subtasks: [], habitId: null,
            eventId: s.uid || null, created: today() });
        }
        suggestions.splice(i, 1);
        save(); redraw();
      },
      drop(i) { suggestions.splice(i, 1); redraw(); },
    };
  });
}

function restore(data) {
  if (!data || typeof data !== 'object') throw new Error('not a Project 1% backup');
  let n = 0;
  const have = k => new Set(DB[k].map(x => x.id));
  ['habits', 'accounts', 'txns', 'tasks', 'goals', 'cards', 'sessions', 'inbox', 'apps', 'memory', 'trades'].forEach(k => {
    const seen = have(k);
    (data[k] || []).forEach(rec => {
      if (rec && rec.id && !seen.has(rec.id)) { DB[k].push(rec); seen.add(rec.id); n++; }
    });
  });
  Object.keys(data.logs || {}).forEach(key => { if (!(key in DB.logs)) { DB.logs[key] = data.logs[key]; n++; } });
  Object.keys(data.budgets || {}).forEach(c => { if (!(c in DB.budgets)) { DB.budgets[c] = data.budgets[c]; n++; } });
  Object.keys(data.reviews || {}).forEach(k => { if (!(k in DB.reviews)) { DB.reviews[k] = data.reviews[k]; n++; } });
  Object.keys(data.plans || {}).forEach(k => { if (!(k in DB.plans)) { DB.plans[k] = data.plans[k]; n++; } });
  save();
  return n;
}

/** A backup file. A device with no check-ins yet (a fresh install, where the plan has just
    loaded itself) takes the backup whole, or your edits to plan records would be skipped as
    duplicates of the fresh copies. Anywhere else, only the missing records merge in. */
function restoreBackup(data) {
  if (data && Array.isArray(data.habits) && data.logs && !Object.keys(DB.logs).length) {
    DB = Object.assign(JSON.parse(JSON.stringify(BLANK)), data);
    DB.prefs = Object.assign({}, BLANK.prefs, DB.prefs);
    save();
    return 'Backup restored.';
  }
  return restore(data) + ' records restored.';
}

function download(name, data, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const file = new File([blob], name, { type: mime });
  // iOS standalone web apps ignore <a download>, but the share sheet works.
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(() => {});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function toCSV() {
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  let csv = 'date,amount,category,note,account,habit\n';
  DB.txns.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    const acc = DB.accounts.find(a => a.id === t.accountId);
    const hb = habitById(t.habitId);
    csv += [t.date, t.amount, q(t.category), q(t.note), q(acc ? acc.name : ''), q(hb ? hb.name : '')].join(',') + '\n';
  });
  return csv;
}

// ---------- Face ID gate (WebAuthn) ----------
// This gates the UI, nothing more: without a server there's no key to hold data
// hostage. Honest about that in Settings and the README.
async function enableLock() {
  if (!window.PublicKeyCredential) { alert('This browser has no Face ID support.'); return false; }
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Project 1%' },
      user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'you', displayName: 'You' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
      timeout: 60000,
    } });
    DB.prefs.lockId = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
    save();
    return true;
  } catch (e) { alert('Face ID setup was cancelled.'); return false; }
}

async function unlock() {
  const id = DB.prefs.lockId;
  if (!id) return true;
  try {
    const raw = Uint8Array.from(atob(id), c => c.charCodeAt(0));
    await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type: 'public-key', id: raw }],
      userVerification: 'required', timeout: 60000,
    } });
    return true;
  } catch (e) { return false; }
}

// ---------- the day, by the hour ----------
// Habits and tasks land on the clock; money does not. A transaction has a date and no
// time, and asking anyone to type "09:14" for a coffee is how a tracker gets abandoned.
// Spending stays a list under the grid.

/** A stacked habit borrows the time of the one it follows, plus a minute so it sorts
    after it. That is habit stacking: the trigger is another habit, not a clock. */
function stackedAt(h, seen) {
  const guard = seen || {};
  let cur = h, hops = 0;
  while (cur && cur.stackAfter && !guard[cur.id] && hops < 8) {
    guard[cur.id] = 1;
    const next = habitById(cur.stackAfter);
    if (!next) break;
    cur = next;
    hops++;
    if (cur.at) return R.hhmm(Math.min(1439, R.minutesOf(cur.at) + hops));
  }
  return null;
}

function daySlots(day) {
  // The routine is the fixed shape of the day (meals, breaks, Claude sessions). Blocks are
  // shown, never ticked or scored, and go first so a habit at the same minute sorts after.
  // ponytail: comes from the plan file, no editor; add one when the routine changes often.
  const wd = R.fromYMD(day).getDay();
  const out = (DB.routine || []).filter(b => !b.days || b.days.includes(wd)).map(b => ({
    at: b.at, act: '', icon: b.icon, name: b.name, color: 'var(--dim)', done: false,
    meta: b.to ? `until ${b.to}` : '', block: true,
  }));
  scheduledOn(day).forEach(h => out.push({
    at: h.at || stackedAt(h), act: `hopenday:${h.id}|${day}`, icon: h.icon, name: h.name,
    color: h.color, done: habitDone(h, day),
    meta: R.goalOf(h) > 1 ? `${Math.round(logValue(h.id, day))}/${R.goalOf(h)}` : '',
  }));
  // Cards due are a real thing to do today, so they belong on the day like anything
  // else — in the any-time bucket, because a review has no hour of its own.
  if (day === today()) {
    const due = dueNow().length;
    if (due) out.push({ at: null, act: 'study', icon: '🧠', color: 'var(--tint)',
                        name: `Review ${due} card${due === 1 ? '' : 's'}`, done: false, meta: '' });
  }
  (idx().tk[day] || []).forEach(t => out.push({
    at: t.dueTime, act: `tbrief:${t.id}`, tick: `taskdone:${t.id}`, icon: t.done ? '✅' : '☑️', name: t.title,
    color: 'var(--green)', done: t.done, meta: t.project || '',
  }));
  return out;
}

function slotChip(s) {
  return `<button class="slot${s.done ? ' done' : ''}" data-act="${s.act}" style="--hc:${esc(s.color)}">
    <span>${esc(s.icon)}</span><span style="flex:1;text-align:left">${esc(s.name)}</span>
    ${s.at ? `<span class="t">${esc(s.at)}</span>` : ''}
    ${s.meta ? `<span class="t">${esc(s.meta)}</span>` : ''}</button>`;
}

function hourGrid(day) {
  const now = new Date();
  const isToday = day === today();
  const nowHour = now.getHours();
  // Widen the window to hold the current hour too, or at 5am the red line has nowhere
  // to be drawn.
  const sched = R.daySchedule(daySlots(day),
    isToday ? Math.min(6, nowHour) : 6, isToday ? Math.max(22, nowHour) : 22);
  const nowPos = ((now.getMinutes() / 60) * 100).toFixed(1);

  const rows = sched.hours.map((h, i) => {
    const marker = isToday && h.hour === nowHour;
    // The row grows with its contents, so the now-line is positioned inside the hour
    // it belongs to rather than at an absolute offset down a grid of assumed heights.
    const style = [marker ? `--nowpos:${nowPos}%` : '', S.anim ? `animation-delay:${i * 14}ms` : '']
      .filter(Boolean).join(';');
    return `<div class="hrow${marker ? ' now' : ''}${S.anim ? ' enter' : ''}"${style ? ` style="${style}"` : ''}>
      <span class="hlabel">${String(h.hour).padStart(2, '0')}</span>
      <div class="hlane" data-act="addAt:${day}|${h.hour}">${h.items.map(slotChip).join('')}</div>
    </div>`;
  }).join('');

  return `<div class="card">
    <h2>${ic('clock')} ${isToday ? 'Today, by the hour' : 'By the hour'}</h2>
    ${sched.anytime.length ? `<div class="hrow anytime">
      <span class="hlabel">any</span>
      <div class="hlane">${sched.anytime.map(slotChip).join('')}</div></div>` : ''}
    <div class="hours">${rows}</div>
    <p class="hint" style="margin-top:12px">Tap an hour to put something there. A habit
      with no time of day sits under “any” — give it one in its editor to move it onto the clock.</p>
  </div>`;
}

function dayBody(day) {

  const score = Math.round((x.score || 0) * 100);

// ---------- plan: the goal engine (core/) ----------
// Grow → Plan is the engine in core/: who you are becoming → vision → goal → practice →
// session, with a decision queue for anything it will not do on its own. It keeps its
// own storage key because its snapshot format is versioned apart from DB. The calendar
// is an on-device one; there is no server, so nothing here reads your mail or Google.
// ponytail: the whole plan, audit trail included, is one localStorage entry sharing the
// ~5MB quota with DB. Move to IndexedDB when the audit trail gets near that.
const PKEY = 'p1p.engine.v1';
let PLAN = null;

function planLoad() {
  if (!window.P1 || !P1.engine || !P1.calendar)
    return { error: 'The plan engine did not load. Upload the core folder next to index.html.' };
  const { createEngine } = P1.engine, { MemoryCalendar } = P1.calendar;
  const raw = localStorage.getItem(PKEY);
  try {
    const saved = raw ? JSON.parse(raw) : null;
    const secret = (saved && saved.secret) || uid() + uid() + uid();
    const E = createEngine({ secret });
    if (saved) {
      const cal = MemoryCalendar.restore(saved.cal);
      return { E, cal, secret, u: E.restore(saved.state, { device: cal }), lastTick: saved.lastTick || null };
    }
    let tz = 'UTC';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) {}
    if (!P1.signals.isIANA(tz)) tz = 'UTC';
    const u = E.user('me', { tz }), cal = new MemoryCalendar({ id: 'device' });
    u.connectCalendar('device', cal, { primary: true });
    return { E, cal, secret, u, lastTick: null };
  } catch (e) {
    // Never overwrite a save we could not read: the next planSave would destroy it.
    return { error: `Your saved plan could not be loaded (${e.message}). Nothing has been changed or overwritten.`, raw };
  }
}

async function planSave() {
  const P = PLAN;
  const blob = JSON.stringify({ secret: P.secret, lastTick: P.lastTick, state: await P.u.dump(), cal: P.cal.dump() });
  try { localStorage.setItem(PKEY, blob); changed(); }
  catch (e) { toast('Storage is full. Export your plan, then erase it to start lighter.'); }
}

/** Every write goes through here: run it, save, repaint. Engine refusals are shown, never swallowed. */
async function planRun(fn) {
  try { const r = await fn(PLAN.u); await planSave(); render(); return r; }
  catch (e) {
    if (!e.code) throw e; // a bug, not a refusal: let the crash box show it
    await planSave(); render(); toast(e.message); return undefined;
  }
}

async function planBoot() {
  PLAN = planLoad();
  if (PLAN.error || PLAN.lastTick === today()) return;
  PLAN.lastTick = today();
  // The daily heartbeat: misses, due reviews, load, purge. No render here: boot may be
  // sitting behind the lock screen.
  try { await PLAN.u.tick(); } catch (e) { if (!e.code) throw e; }
  await planSave();
}

async function planGoalSave() {
  const u = PLAN.u, domainId = val('gDom'), vtext = val('gVision').trim();
  const n = id => { const v = parseFloat(val(id)); return isNaN(v) ? null : v; };
  const ind = (name, target, extra) => name ? [{ name, target, ...extra }] : [];
  const msg = await planRun(async u => {
    let vision = u.list('vision', v => v.domainId === domainId && (!vtext || v.text === vtext))[0];
    if (!vision && vtext) vision = await u.createVision({ domainId, text: vtext });
    const g = await u.createGoal({
      title: val('gTitle').trim(), domainId, visionId: vision ? vision.id : undefined, outcome: val('gOutcome').trim() || null,
      leading: ind(val('gLeadN').trim(), n('gLeadT')), lagging: ind(val('gLagN').trim(), n('gLagT'), document.getElementById('gLagDown').checked ? { direction: 'down' } : {}),
      targetDate: val('gDate') || null, antiGoals: val('gAnti').trim() ? [val('gAnti').trim()] : [], releaseCondition: val('gRelease').trim() || null,
      obstacles: val('gObs').trim() ? [val('gObs').trim()] : [], motivation: { ambivalent: document.getElementById('gAmb').checked },
      tests: { origin: val('gOrigin'), ...(val('gSub').trim() ? { substitution: val('gSub').trim() } : {}) },
    });
    if (val('pTitle').trim()) await u.createPractice({ title: val('pTitle').trim(), domain: val('pDom'), goalIds: [g.id], mvd: { minutes: n('pMvd') || 0 }, target: { minutes: n('pMin') || 0, perWeek: n('pPer') || 0 } });
    const miss = u.wellFormed(g.id);
    if (miss.length) return `Saved as a draft. Before it can go live it needs ${miss.join('; ')}.`;
    if (g.motivation.ambivalent) return 'Saved as a draft: you said you are in two minds. Make it live from the goal when you have decided.';
    await u.setGoalStatus(g.id, 'active', { rationale: 'written and complete' });
    return 'Live. Every session you schedule for it now traces back to your vision.';
  });
  if (msg) { closeSheet(); toast(msg); }
}
