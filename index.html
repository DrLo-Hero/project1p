<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Project 1%</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Project 1%">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme: light dark;
  /* Neutrals are biased a few degrees toward the accent rather than pure grey, so the
     greys read as chosen instead of inherited. Semantic colours stay iOS-native. */
  --bg:#f3f4f8; --card:#ffffff; --card2:#eceef4; --fg:#0c0e14; --dim:#5d6377;
  --line:rgba(18,22,40,.10); --tint:#4f8ef7; --green:#34c759; --red:#ff375f; --orange:#ff9f0a;
  --purple:#af52de;
  --radius:16px; --pad:16px;
  /* Elevation: a card is separated by a hairline and a soft shadow, not by colour alone. */
  --sh1:0 1px 2px rgba(12,14,20,.05), 0 1px 1px rgba(12,14,20,.04);
  --sh2:0 4px 16px rgba(12,14,20,.07), 0 1px 2px rgba(12,14,20,.05);
  --sh3:0 12px 34px rgba(12,14,20,.16);
  --hair:1px solid var(--line);
  /* Type scale. One ratio, used everywhere, so nothing is sized by feel. */
  --t-cap:11px; --t-sm:13px; --t-md:15px; --t-lg:17px; --t-xl:22px; --t-hero:46px;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0a0b0f; --card:#16181f; --card2:#20232c; --fg:#f0f1f5; --dim:#8e94a6;
         --line:rgba(150,160,190,.16);
         --sh1:0 1px 2px rgba(0,0,0,.5);
         --sh2:0 4px 16px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.4);
         --sh3:0 12px 34px rgba(0,0,0,.62); }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* iOS Safari only fires click on non-button elements that look clickable.
   Without this, tapping a transaction row or a task title does nothing. */
[data-act]{cursor:pointer}
#crash{position:fixed;inset:auto 12px 12px;z-index:99;background:#ff375f;color:#fff;
       border-radius:12px;padding:12px 14px;font:13px/1.45 ui-monospace,Menlo,monospace;
       white-space:pre-wrap;word-break:break-word;max-height:45dvh;overflow:auto}
#crash[hidden]{display:none}
html,body{margin:0;padding:0;height:100%}
/* No webfont on purpose: sw.js skips cross-origin requests, so a CDN face would
   silently fall back the moment the app goes offline. The native UI stack is the
   one typeface guaranteed to be there, tuned here rather than left at defaults. */
body{
  background:var(--bg); color:var(--fg);
  font:var(--t-md)/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text",
       "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}

/* Keyboard users get the same affordance the mouse gets. One rule, every control. */
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
/* Hover only where a pointer can actually hover — on touch this would stick after a tap. */
@media (hover:hover) and (pointer:fine){
  .card.coachcard:hover,.track:hover,.goal:hover,.opt:hover{background:var(--card2)}
  .chip:hover{transform:translateY(-2px)}
  .seg button:hover:not([aria-pressed="true"]),nav button:hover{color:var(--fg)}
  .btn:hover{filter:brightness(1.06)}
  .mini:hover,.grades button:hover,.stars button:hover{background:var(--line)}
}
.chip{transition:transform .18s var(--ease),box-shadow .18s var(--ease)}

#app{display:flex;flex-direction:column;height:100dvh}
header{
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-bottom:var(--hair); position:sticky;top:0;z-index:5;
}
header h1{font-size:var(--t-lg);font-weight:650;letter-spacing:-.01em;margin:0;flex:1;text-align:center}
header button{width:34px;height:34px;border-radius:17px;color:var(--fg);font-size:18px;
  display:flex;align-items:center;justify-content:center;background:var(--card2)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--pad);padding-bottom:120px}

nav{
  display:flex;
  background:color-mix(in srgb, var(--card) 84%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-top:var(--hair);
  padding-bottom:env(safe-area-inset-bottom);position:sticky;bottom:0;z-index:5;
}
nav button{flex:1;padding:9px 0 7px;font-size:10px;font-weight:550;letter-spacing:.01em;
  color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .18s var(--ease);position:relative}
nav button .ic{line-height:0;font-size:22px}
nav button[aria-current="page"]{color:var(--tint)}
/* The active tab is named twice — colour and a rail — so it survives a colour-blind read. */
nav button[aria-current="page"]::before{
  content:"";position:absolute;top:0;left:50%;width:22px;height:2px;margin-left:-11px;
  border-radius:0 0 2px 2px;background:var(--tint)}

/* On a desktop window the app is a phone column pinned to the left, which reads like an
   unfinished port. Centre it and give it an edge instead. */
@media (min-width:720px){
  body{background:
    radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--tint) 7%, transparent), transparent 60%),
    var(--bg)}
  #app{max-width:480px;margin:0 auto;height:100dvh;
       border-left:var(--hair);border-right:var(--hair);background:var(--bg);box-shadow:var(--sh3)}
  #fab{right:auto;left:50%;margin-left:180px}
}

#fab{
  position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:28px;color:#fff;font-size:26px;z-index:6;
  display:flex;align-items:center;justify-content:center;
  /* A flat disc reads as a sticker. The gradient plus a tinted shadow sits it on the page. */
  background:linear-gradient(160deg, color-mix(in srgb, var(--tint) 88%, #fff), var(--tint));
  box-shadow:0 8px 22px color-mix(in srgb, var(--tint) 42%, transparent), 0 2px 6px rgba(0,0,0,.2);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
}
#fab:active{transform:scale(.92)}
@media (hover:hover) and (pointer:fine){
  #fab:hover{transform:translateY(-2px);
    box-shadow:0 12px 28px color-mix(in srgb, var(--tint) 50%, transparent), 0 2px 6px rgba(0,0,0,.22)}
}

.card{background:var(--card);border-radius:var(--radius);padding:var(--pad);margin-bottom:14px;
      border:var(--hair);box-shadow:var(--sh1)}
/* Section heads are a label, not a sentence: small caps-ish, tracked out, with the icon
   sized to the text so the two sit on one optical line. */
.card h2{font-size:var(--t-cap);font-weight:650;color:var(--dim);margin:0 0 13px;
         text-transform:uppercase;letter-spacing:.07em;
         display:flex;align-items:center;gap:7px}
.card h2 svg{width:14px;height:14px;flex:0 0 14px;opacity:.85}
.hint{color:var(--dim);font-size:var(--t-sm);margin:0}

/* ---------- icons ----------
   One inline <symbol> sprite, drawn once in the document and referenced by <use>.
   No icon font, no library: it inherits currentColor, scales, and works offline. */
#sprite{display:none}
.i{width:1em;height:1em;display:inline-block;vertical-align:-.125em;
   fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i.fill{fill:currentColor;stroke:none}
.row{display:flex;align-items:center;gap:10px}
.row + .row{margin-top:10px}
.spacer{flex:1}
.big{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1}
.sub{color:var(--dim);font-size:13px}
.divider{height:1px;background:var(--line);margin:10px 0}
.mono{font-variant-numeric:tabular-nums}

.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
@media (prefers-color-scheme: dark){ .bar{background:#3a3a3c} }
.bar i{display:block;height:100%;border-radius:4px;background:var(--tint);transition:width .25s}

.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;margin:0 calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad)}
.chip{flex:0 0 150px;background:var(--card2);border-radius:14px;padding:12px;scroll-snap-align:start}
@media (prefers-color-scheme: dark){ .chip{background:var(--card2)} }
.chip .top{display:flex;align-items:center;justify-content:space-between;font-size:20px}
.chip .nm{font-size:14px;font-weight:500;margin:8px 0;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip .act{display:block;width:100%;margin-top:10px;padding:6px;border-radius:999px;font-size:12px;font-weight:600;text-align:center}
.flame{font-size:12px;font-weight:600;color:var(--orange)}

.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:11px;color:var(--dim)}
.day{aspect-ratio:1;border-radius:8px;background:var(--card2);display:flex;flex-direction:column;
     align-items:center;justify-content:center;gap:3px;font-size:12px;position:relative}
.day.today{outline:2px solid var(--tint);outline-offset:-2px}

.yearwrap{overflow-x:auto;margin:0 calc(var(--pad) * -1);padding:4px var(--pad)}
.year{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.year i{border-radius:2px;background:var(--card2);display:block}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);justify-content:center}
.legend i{width:12px;height:12px;border-radius:3px;display:block}

.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .tick{font-size:20px;line-height:1.2;width:24px;flex:0 0 24px;text-align:center}
.list .meta{font-size:12px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.strike{text-decoration:line-through;color:var(--dim)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;background:var(--card2);color:var(--dim)}

.seg{display:flex;background:var(--card2);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:13px;font-weight:500;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (prefers-color-scheme: dark){ .seg button[aria-pressed="true"]{background:#636366} }

#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.4)}
#sheet.open{display:block}
#sheetBody{
  position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;
  background:var(--bg);border-radius:20px 20px 0 0;
  padding:0 var(--pad) calc(24px + env(safe-area-inset-bottom));
}
#sheetBody header{background:var(--bg);border-radius:20px 20px 0 0;padding-top:14px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}

label.f{display:block;margin:14px 0 6px;font-size:13px;color:var(--dim)}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);appearance:none;font-size:16px;
}
textarea{min-height:90px;resize:vertical}
.inline{display:flex;gap:10px}
.inline > *{flex:1}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--tint);color:#fff;
     font-weight:600;text-align:center;margin-top:18px}
.btn.sec{background:var(--card);color:var(--tint)}
.btn.danger{background:var(--card);color:var(--red)}
.btn[disabled]{opacity:.4}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.picks button{width:42px;height:42px;border-radius:21px;font-size:20px;background:var(--card);
              display:flex;align-items:center;justify-content:center}
.picks button[aria-pressed="true"]{outline:2px solid var(--tint)}
.swatch{width:30px;height:30px;border-radius:15px}
.dows{display:flex;gap:6px;margin-top:6px}
.dows button{flex:1;height:38px;border-radius:19px;background:var(--card);font-size:12px;font-weight:600}
.dows button[aria-pressed="true"]{background:var(--tint);color:#fff}
.check{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--card2);flex:0 0 51px;transition:background .2s}
.sw[aria-pressed="true"]{background:var(--green)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;
           background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim);margin-top:10px}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:2px;display:block}

.wizard{text-align:center;padding:10px 0 0}
.wizard .art{font-size:56px;margin-bottom:10px}
.wizard h2{font-size:26px;font-weight:700;color:var(--fg);margin:0 0 8px;display:block;text-transform:none}
.wizard p{color:var(--dim);margin:0 0 6px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:14px;margin-top:10px;text-align:left;width:100%}
.opt .tickbox{margin-left:auto;font-size:20px}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0 0}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);display:block}
.dots i.on{background:var(--tint)}
.banner{background:var(--card);border-left:3px solid var(--orange);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}

/* ---------- motion ----------
   Everything here is CSS. No animation library, no per-element JS timers: the
   browser composites transform/opacity off the main thread, which is the only way
   371 grid cells stay smooth on a phone. */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.35);opacity:.4}60%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes drawring{from{stroke-dashoffset:var(--from)}}
@keyframes burst{0%{transform:scale(.3);opacity:.85}100%{transform:scale(3.4);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

button,[data-act]{transition:transform .12s ease}
button:active,[data-act]:active{transform:scale(.96)}
/* The grid is the tap target for its cells; scaling the whole board on touch
   makes the cell under your finger move away from it. */
.hgrid:active{transform:none}
.fadein{animation:fadeUp .26s cubic-bezier(.22,1,.36,1) both}
.bar i{transition:width .45s cubic-bezier(.22,1,.36,1)}
.flame{display:inline-block;animation:breathe 2.6s ease-in-out infinite}
.ring{display:block;flex:0 0 auto}
.ring circle + circle{animation:drawring .9s cubic-bezier(.22,1,.36,1)}
.burst{position:fixed;left:50%;top:44%;width:76px;height:76px;margin:-38px 0 0 -38px;
  border-radius:50%;border:3px solid var(--hc);pointer-events:none;z-index:40;
  animation:burst .6s ease-out forwards}

/* ---------- habit grids ---------- */
.hcard{animation:rise .3s cubic-bezier(.22,1,.36,1) both}
.hico{font-size:22px;width:40px;height:40px;flex:0 0 40px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:color-mix(in srgb, var(--hc) 16%, transparent)}
.tickbtn{width:38px;height:38px;flex:0 0 38px;border-radius:19px;font-size:19px;font-weight:700;
  color:var(--hc);background:color-mix(in srgb, var(--hc) 15%, transparent);
  display:flex;align-items:center;justify-content:center;transition:background .25s,color .25s,transform .12s}
.tickbtn.on{background:var(--hc);color:#fff}
.gridwrap{overflow-x:auto;margin:14px calc(var(--pad) * -1) 0;padding:2px var(--pad)}
.hgrid{display:grid;grid-template-rows:repeat(7,var(--cell));grid-auto-flow:column;
       grid-auto-columns:var(--cell);gap:3px;--cell:12px;width:max-content;
       animation:wipe .55s cubic-bezier(.22,1,.36,1) both}
.hgrid i{border-radius:3px;background:var(--card2);display:block}
@media (prefers-color-scheme: dark){ .hgrid i{background:#232325} }
.hgrid i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hgrid i.l1{background:color-mix(in srgb, var(--hc) 28%, transparent)}
.hgrid i.l2{background:color-mix(in srgb, var(--hc) 50%, transparent)}
.hgrid i.l3{background:color-mix(in srgb, var(--hc) 74%, transparent)}
.hgrid i.l4{background:var(--hc)}
.hgrid i.now{box-shadow:0 0 0 1.5px var(--fg)}
.hgrid i.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.mini{font-size:13px;color:var(--tint);padding:7px 12px;border-radius:9px;background:var(--card2)}

/* ---------- companion ---------- */
.coachcard{display:block;width:100%;text-align:left;border-left:3px solid var(--tint);
           animation:rise .3s cubic-bezier(.22,1,.36,1) both}
.coachcard.warn{border-left-color:var(--orange)}
.coachcard.good{border-left-color:var(--green)}
.cico{font-size:22px;width:30px;flex:0 0 30px;text-align:center;line-height:1.3}
.chev{color:var(--dim);font-size:20px}
.tip{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
     padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35}
.tip:last-child{border-bottom:0}

/* ---------- dashboard ---------- */
.heroNum{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1.05;
         font-variant-numeric:tabular-nums;margin:2px 0 4px}
.heroDelta{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;min-height:1.2em}
/* pan-y, not none: a vertical swipe still scrolls the page, a sideways drag scrubs. */
.scrub{width:100%;height:auto;display:block;margin:14px 0 8px;touch-action:pan-y}
.scrub:active{transform:none}
.heroLine{stroke-dasharray:1;animation:drawline 1.1s cubic-bezier(.22,1,.36,1)}
@keyframes drawline{from{stroke-dashoffset:1}}
.ranges{margin:0}
.ranges button{font-size:12px;padding:5px}
.sparkline{flex:0 0 auto;margin:0 4px;opacity:.85}
.track{display:flex;align-items:center;gap:11px;width:100%;padding:12px 0;
       border-bottom:1px solid var(--line);text-align:left}
.track:last-of-type{border-bottom:0}

/* ---------- goals, cards, practice ---------- */
.goal{display:block;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line)}
.goal:first-of-type{padding-top:2px}
.goal:last-child{border-bottom:0;padding-bottom:2px}
.ident{font-size:12px;color:var(--tint);margin-top:4px}
.intent{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.55;
        background:var(--card2);border-radius:9px;padding:9px 11px}
.intent b{color:var(--fg);font-weight:600}
.face{min-height:132px;display:flex;align-items:center;justify-content:center;text-align:center;
      font-size:19px;line-height:1.45;padding:20px 4px}
.face.back{border-top:1px solid var(--line);font-size:16px;color:var(--dim);
           animation:fadeUp .3s cubic-bezier(.22,1,.36,1) both}
.face.back b{color:var(--fg);font-weight:600}
.grades{display:flex;gap:8px;margin-top:14px}
.grades button{flex:1;padding:15px 0;border-radius:12px;font-size:13px;font-weight:600;
               background:var(--card2)}
.grades button .k{display:block;font-size:10px;color:var(--dim);font-weight:500;margin-top:3px}
.stars{display:flex;gap:7px}
.stars button{flex:1;padding:12px 0;border-radius:10px;background:var(--card2);font-size:14px}
.stars button[aria-pressed="true"]{background:var(--tint);color:#fff}
.deck{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.deck i{height:6px;border-radius:3px;flex:1 0 12px;background:var(--card2);display:block}
.qa{font-size:12px;color:var(--dim);margin-top:4px}

/* ---------- the hour grid ---------- */
.hours{margin-top:2px}
.hrow{display:flex;gap:10px;min-height:44px;border-top:1px solid var(--line);position:relative}
.hrow:last-child{border-bottom:1px solid var(--line)}
.hrow.enter{animation:fadeUp .3s cubic-bezier(.22,1,.36,1) both}
.hrow.anytime{border-top:0;border-bottom:1px solid var(--line);min-height:0;padding-bottom:8px}
.hlabel{flex:0 0 30px;font-size:11px;color:var(--dim);padding-top:5px;text-align:right;
        font-variant-numeric:tabular-nums}
.hlane{flex:1;display:flex;flex-direction:column;gap:5px;padding:5px 0 7px;min-width:0;min-height:34px}
.slot{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-size:13px;
      width:100%;background:color-mix(in srgb, var(--hc) 14%, transparent);border-left:3px solid var(--hc)}
.slot.done{opacity:.5}
.slot .t{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
/* The line sits inside the hour it belongs to, so a row that grew to fit three items
   doesn't push it out of place. */
.hrow.now::after{content:"";position:absolute;left:30px;right:0;top:var(--nowpos);
                 height:2px;background:var(--red);pointer-events:none}
.hrow.now::before{content:"";position:absolute;left:26px;top:calc(var(--nowpos) - 3px);
                  width:8px;height:8px;border-radius:4px;background:var(--red);z-index:1;
                  pointer-events:none;animation:breathe 2.6s ease-in-out infinite}

/* ---------- calendar marks ---------- */
.dnum{line-height:1;font-variant-numeric:tabular-nums}
.marks{display:flex;gap:3px;height:5px}
.marks i{width:5px;height:5px;border-radius:3px;display:block}
.marks i.off{background:var(--fg);opacity:.1}
.day.future{opacity:.42}

/* ---------- sheet ---------- */
#sheet{opacity:0;transition:opacity .24s ease}
#sheet.in{opacity:1}
#sheetBody{transform:translateY(101%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
#sheet.in #sheetBody{transform:none}

/* ---------- refinement pass ----------
   Appended last on purpose: these override the blocks above at equal specificity
   rather than editing each in place, so the cascade order is the whole story. */

/* Anything that pairs an icon with a word lines them up the same way. */
.flame,.mini,.tip,.opt strong{display:inline-flex;align-items:center;gap:5px}
.flame{gap:3px}
.mini{gap:6px;font-weight:550;border:var(--hair);transition:background .18s var(--ease)}
.hico{color:var(--hc)}
.cico{display:flex;align-items:center;justify-content:center}
.meta{align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}

/* Digits that stack in a column have to share a width or the column wobbles. */
.big,.heroNum,.heroDelta,.sub,.mono,.dnum,.hlabel,.track,.chip .act,.pill{
  font-variant-numeric:tabular-nums}

/* Hero: the number is the page. A faint wash of the accent lifts it off the card
   stack without adding another border. */
.card.hero{position:relative;overflow:hidden;
  background:
    radial-gradient(120% 100% at 0% 0%, color-mix(in srgb, var(--tint) 10%, transparent), transparent 62%),
    var(--card)}
.heroNum{font-size:var(--t-hero);letter-spacing:-.03em;font-weight:700}
.heroDelta{letter-spacing:-.01em}
.card.hero .sub{text-transform:uppercase;letter-spacing:.07em;font-size:var(--t-cap);font-weight:650}

/* Segmented control: an inset well with a raised thumb, so pressed state is a
   surface change and not only a colour change. */
.seg{box-shadow:inset 0 1px 2px rgba(12,14,20,.06);gap:2px}
.seg button{font-weight:550;color:var(--dim);transition:color .18s var(--ease),background .18s var(--ease)}
.seg button[aria-pressed="true"]{color:var(--fg);font-weight:600;
  background:var(--card);box-shadow:var(--sh1)}
@media (prefers-color-scheme: dark){
  .seg{box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
  .seg button[aria-pressed="true"]{background:#32363f}
}

.bar{box-shadow:inset 0 1px 2px rgba(12,14,20,.07)}
.chip{border:var(--hair);box-shadow:var(--sh1)}
.chip .nm{font-weight:550;letter-spacing:-.01em}
.chip .act{border:var(--hair);border-color:transparent}

/* Primary action: same treatment as the FAB so the two read as one button family. */
.btn{background:linear-gradient(160deg, color-mix(in srgb, var(--tint) 88%, #fff), var(--tint));
     box-shadow:0 4px 14px color-mix(in srgb, var(--tint) 32%, transparent);
     letter-spacing:-.01em;transition:transform .14s var(--ease),filter .18s var(--ease)}
.btn.sec,.btn.danger{background:var(--card);box-shadow:var(--sh1);border:var(--hair)}
.btn:active{transform:scale(.985)}

/* Rows are the main interactive surface; give them a hit area with an edge, not just text. */
.track,.goal{border-radius:10px;padding-left:8px;padding-right:8px;margin-left:-8px;margin-right:-8px;
             width:calc(100% + 16px);transition:background .18s var(--ease)}
.pill{font-weight:600;letter-spacing:.02em;border:var(--hair)}
.tick{transition:transform .14s var(--ease),color .18s var(--ease)}

input:focus,select:focus,textarea:focus{border-color:var(--tint);outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--tint) 18%, transparent)}
label.f{text-transform:uppercase;letter-spacing:.06em;font-size:var(--t-cap);font-weight:650}

#sheetBody{box-shadow:var(--sh3)}
#sheet{background:rgba(8,9,14,.46);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.grab{background:var(--dim);opacity:.35}

.day{transition:transform .14s var(--ease)}
.day.today{outline-width:2px;box-shadow:0 0 0 4px color-mix(in srgb, var(--tint) 14%, transparent)}
.banner{box-shadow:var(--sh1);border:var(--hair);border-left:3px solid var(--orange)}
.coachcard{border:var(--hair);border-left:3px solid var(--tint)}
.coachcard.warn{border-left-color:var(--orange)}
.coachcard.good{border-left-color:var(--green)}
.intent{border:var(--hair)}
.wizard h2{letter-spacing:-.02em;text-transform:none}
.opt{border:var(--hair);box-shadow:var(--sh1);transition:background .18s var(--ease)}


/* ---------- briefings and approvals ----------
   Added after the original design; they use its tokens and nothing else. */
.qrow{gap:8px;margin-top:9px}
.qrow .btn{margin:0;flex:0 0 auto;width:auto;padding:8px 18px;font-size:13px}
.bp{margin:0 0 9px;line-height:1.55}
.blist{margin:2px 0 10px;padding-left:20px}
.blist li{margin:4px 0;line-height:1.5;padding-left:2px}
.blist li::marker{color:var(--tint)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:7px 14px;margin:0 0 8px}
.kv dt{font-size:var(--t-cap);font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding-top:2px}
.kv dd{margin:0;line-height:1.45}
.bref{display:inline-block;margin:4px 14px 2px 0;color:var(--tint);font-size:13.5px}
.phases .pm{display:block;border:0;padding:12px 0 2px;font-size:var(--t-cap);font-weight:650;letter-spacing:.07em;color:var(--tint)}
.s14{display:flex;gap:3px}
.s14 i{flex:1;height:16px;border-radius:3px;background:var(--card2)}
.s14 i.on{background:var(--hc)}
.s14 i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}

/* Motion is decoration. If the OS says no, it all goes. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;
                       transition-duration:1ms !important}
}
</style>
</head>

<!-- No data-act on #sheet: it would swallow every tap inside the sheet (labels,
     inputs, blank space) and close the form mid-edit. The backdrop-only listener
     at the bottom of the script handles dismissal. -->

<div id="crash" hidden></div>

<script>
'use strict';
/* Project 1% — offline habit / money / task tracker.
   One file, no framework, no dependencies. Rules live in rules.js so they can be
   tested in Node (see test.js). */

const BUILD = '2026-11-09.11';

// A thrown error used to mean a blank white screen and no way to report it.
// Put the message on the glass instead.
function showCrash(what, err) {
  const box = document.getElementById('crash');
  if (!box) return;
  box.hidden = false;
  box.textContent = `${what}: ${(err && (err.stack || err.message)) || err}\n\nbuild ${BUILD}`;
}
window.addEventListener('error', e => showCrash('Error', e.error || e.message));
window.addEventListener('unhandledrejection', e => showCrash('Error', e.reason));
if (typeof todayKey !== 'function') {
  showCrash('Setup', 'rules.js did not load — upload it next to index.html');
}

// ---------- storage ----------
const KEY = 'p1p.v1';
// New top-level keys are free: DB is merged over BLANK on load, so a save written by
// an older build picks them up empty rather than needing a migration.
const BLANK = { habits: [], logs: {}, accounts: [], txns: [], budgets: {}, tasks: [],
                goals: [], cards: [], sessions: [], reviews: {}, inbox: [], plans: {}, apps: [], memory: [], trades: [], queue: [], routine: [],
                gsync: { map: {}, seen: [], lastSync: null, mailAt: null, pushOK: false, err: null },
                prefs: { onboarded: false, cur: 'USD', dayFirst: false, lockId: null,
                         lastReview: null, birthday: null } };

let DB;
try { DB = Object.assign({}, BLANK, JSON.parse(localStorage.getItem(KEY) || '{}')); }
catch (e) { DB = JSON.parse(JSON.stringify(BLANK)); }
DB.prefs = Object.assign({}, BLANK.prefs, DB.prefs);

let saveTimer = null;
function writeNow() {
  clearTimeout(saveTimer); saveTimer = null;
  dropIndex();

  catch (e) { alert('Storage is full — export a backup from Settings and remove some history.'); return; }
  changed();
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(writeNow, 120); }
/** Writes a save that is still waiting on its timer. */
function flushSave() { if (saveTimer) writeNow(); }
// iOS freezes and then kills a home-screen app in the background without warning, so a
// save still on its 120ms timer was lost. Write it the moment the app leaves the screen.
addEventListener('pagehide', flushSave);
// Back on screen: pick up what another device changed. Leaving: try to upload now.

const R = window; // rules.js exposes its functions as globals
const today = () => R.todayKey();

function habitProgress(h, day) { return R.fraction(logValue(h.id, day), R.goalOf(h)); }
function habitDone(h, day) { return habitProgress(h, day) >= 1; }
function streakOf(h) { return R.streak(h, logValue, today()); }

function scheduledOn(day) { return liveHabits().filter(h => R.isScheduled(h, day)); }
function dayScore(day) {
  const hs = scheduledOn(day);
  if (!hs.length) return null;
  return hs.reduce((s, h) => s + habitProgress(h, day), 0) / hs.length;
}
function budgetTotal() { const v = DB.budgets[TOTAL]; return v > 0 ? v : null; }

// ---------- charts (hand-rolled SVG; three charts don't justify a library) ----------
function donut(slices, size) {
  size = size || 200;
  const total = slices.reduce((s, x) => s + x.amount, 0);
  if (!total) return '';
  const r = size / 2, ir = r * 0.62, cx = r, cy = r;
  if (slices.length === 1) {
    return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-height:200px"><circle cx="${cx}" cy="${cy}"
      r="${(r + ir) / 2}" fill="none" stroke="${PALETTE[0]}" stroke-width="${r - ir}"/></svg>`;
  }
  let a = -Math.PI / 2, out = '';
  slices.forEach((s, i) => {
    const ang = (s.amount / total) * Math.PI * 2, b = a + ang, big = ang > Math.PI ? 1 : 0;
    const p = (rad, ang2) => [cx + rad * Math.cos(ang2), cy + rad * Math.sin(ang2)];
    const [x1, y1] = p(r, a), [x2, y2] = p(r, b), [x3, y3] = p(ir, b), [x4, y4] = p(ir, a);
    out += `<path d="M${x1} ${y1} A${r} ${r} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${ir} ${ir} 0 ${big} 0 ${x4} ${y4} Z"
             fill="${PALETTE[i % PALETTE.length]}"/>`;
    a = b;
  });
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-height:200px">${out}</svg>`;
}

function plot(series, labels, opts) {
  opts = opts || {};
  const w = 320, h = opts.height || 130, pad = 22, bottom = 18;
  const all = series.flatMap(s => s.points);
  const max = Math.max(1, ...all), min = Math.min(0, ...all);
  const span = (max - min) || 1;
  const n = labels.length;
  const x = i => pad + (n === 1 ? (w - pad * 2) / 2 : (i * (w - pad * 2)) / (n - 1));
  const y = v => h - bottom - ((v - min) / span) * (h - bottom - 6);
  let out = `<line x1="${pad}" y1="${y(min)}" x2="${w - pad}" y2="${y(min)}" stroke="var(--line)"/>`;
  for (const s of series) {
    const pts = s.points.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    if (opts.area) {
      out += `<polygon points="${x(0)},${y(min)} ${pts} ${x(n - 1)},${y(min)}" fill="${s.color}" opacity=".18"/>`;
    }
    out += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
    out += s.points.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${s.color}"/>`).join('');
  }
  out += labels.map((l, i) =>
    `<text x="${x(i)}" y="${h - 4}" font-size="10" fill="var(--dim)" text-anchor="middle">${esc(l)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${out}</svg>`;
}

const reduced = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// Accent is the one HabitKit theme knob worth having: it repaints every --tint use.
function applyAccent() {
  const root = document.documentElement;
  if (root && root.style) {
    // An accent picked during the field-palette days is dropped, so the default blue shows.
    if (DB.prefs.accent && PALETTE.includes(DB.prefs.accent)) root.style.setProperty('--tint', DB.prefs.accent);
    else if (root.style.removeProperty) root.style.removeProperty('--tint');
  }
  let n = 0;
  DB.habits.forEach(h => { const c = FIELD_COLORS[String(h.color).toLowerCase()]; if (c) { h.color = c; n++; } });
  if (n) save();
}

/** A progress ring that draws itself. The final value is inline, so if the keyframe
    never runs (reduced motion, ancient Safari) the ring is still correct. */
function ring(pct, size, color) {
  const r = (size - 11) / 2, c = 2 * Math.PI * r, mid = size / 2;
  const to = c * (1 - Math.min(Math.max(pct, 0), 100) / 100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="9"/>
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${to.toFixed(1)}"
      style="--from:${c.toFixed(1)}" transform="rotate(-90 ${mid} ${mid})"/></svg>`;
}

function countUp(el, to) {
  if (!el || !isFinite(to)) return;
  if (reduced() || !window.requestAnimationFrame) { el.textContent = to + '%'; return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 800);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + '%';
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/** One expanding ring when a habit crosses the line. Removes itself. */
function burst(color) {
  if (reduced() || !document.body.appendChild) return;
  const el = document.createElement('div');
  el.className = 'burst';
  el.style.cssText = '--hc:' + color;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function render() {
  try { paint(); } catch (e) { showCrash('Render failed', e); }
}

function paint() {
  dropIndex();
  $('#title').textContent = TITLES[S.tab];
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.act === 'tab:' + S.tab ? 'page' : 'false'));
  const html =
    S.tab === 'dash' ? viewDash() :
    S.tab === 'habits' ? viewHabits() :
    S.tab === 'cal' ? viewCal() :
    S.tab === 'grow' ? viewGrow() :
    S.tab === 'fin' ? viewFin() : viewTasks();
  // The wrapper is a fresh element every paint, which is what re-triggers the
  // entry animation — a class on #main itself would only ever run once.
  const entering = S.anim; // a tab or range change, not a check-in
  $('#main').innerHTML = `<div${entering ? ' class="fadein"' : ''}>${html}</div>`;
  $('#main').scrollTop = S.keepScroll || 0;
  S.keepScroll = 0;
  S.anim = false;
  S.pop = null;
  wireScrub();
  if (entering) {
    const hero = document.getElementById('heroVal');
    if (hero) countUp(hero, Number(hero.dataset.to));
  }
}

// ---------- per-paint indexes ----------
// Scanning every transaction once per calendar cell is 365 x txns on the year grid.
// Build the lookups once a paint instead; save() drops them when anything changes.
let IDX = null;
function dropIndex() { IDX = null; }
function idx() {
  if (IDX) return IDX;
  const tx = {}, tk = {}, spendDay = {}, mtd = {};
  DB.txns.forEach(t => {
    (tx[t.date] = tx[t.date] || []).push(t);
    if (t.amount < 0) spendDay[t.date] = (spendDay[t.date] || 0) - t.amount;
  });
  DB.tasks.forEach(t => { if (t.due) (tk[t.due] = tk[t.due] || []).push(t); });
  // Month-to-date spend, memoised back to the 1st — at most 31 steps deep.
  const spentTo = day => {
    if (day in mtd) return mtd[day];
    const prev = R.addDays(day, -1);
    const carry = R.monthKey(prev) === R.monthKey(day) ? spentTo(prev) : 0;
    return (mtd[day] = carry + (spendDay[day] || 0));
  };
  return (IDX = { tx, tk, spendDay, spentTo });
}
function indexCtx() {
  return { habits: DB.habits, logValue, tasks: DB.tasks,
           budget: budgetTotal() || 0, spentTo: idx().spentTo,
           reviews: DB.reviews, deckFrom: deckFrom() };
}

// ---------- dashboard ----------
// Laid out like a brokerage app, because the question is the same one: am I up or
// down, and on what. One headline figure, one chart you can drag your finger across,
// then the three positions that make it up.

const RANGES = [['1W', 7], ['1M', 30], ['3M', 90], ['1Y', 365], ['ALL', 0]];
const rangeName = () => (RANGES.find(r => r[1] === S.range) || RANGES[1])[0];

function rangeStart() {
  const d = today();
  if (S.range) return R.addDays(d, -(S.range - 1));
  const firsts = DB.habits.map(h => h.created)
    .concat(DB.txns.map(t => t.date), DB.tasks.map(t => t.due || t.created))
    .filter(Boolean).sort();
  const first = firsts[0] || R.addDays(d, -29);
  // Two weeks minimum, or "ALL" on a fresh install is a single dot.
  return first < R.addDays(d, -13) ? first : R.addDays(d, -13);
}

/** Line and area path data for values laid out across a w x h box. */
function sparkPath(values, w, h, pad) {
  const max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  const flat = max === min, span = (max - min) || 1, n = values.length;
  const x = i => (n === 1 ? w / 2 : (i * w) / (n - 1));
  // A flat run centres rather than sitting on the floor: unchanging is not zero.
  const y = v => (flat ? h / 2 : pad + (1 - (v - min) / span) * (h - pad * 2));
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  return { x, y, pts, line: 'M' + pts.join(' L'),
           area: `M${x(0).toFixed(1)},${h} L${pts.join(' L')} L${x(n - 1).toFixed(1)},${h} Z` };
}

function spark(values, color, w, h) {
  w = w || 60; h = h || 26;
  if (values.length < 2) return `<span style="width:${w}px;flex:0 0 ${w}px"></span>`;
  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <path d="${sparkPath(values, w, h, 3).line}" fill="none" stroke="${color}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function heroChart(series, color) {
  const w = 340, h = 108;
  const vals = series.map(p => Math.round(p.score * 100));
  const p = sparkPath(vals, w, h, 8);
  return `<svg id="heroChart" class="scrub" viewBox="0 0 ${w} ${h}"
      data-vals="${vals.join(',')}" data-keys="${series.map(s => s.key).join(',')}"
      data-pts="${p.pts.join(' ')}">
    <defs><linearGradient id="hgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".26"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${p.area}" fill="url(#hgrad)"/>
    <path class="heroLine" d="${p.line}" fill="none" stroke="${color}" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round" pathLength="1"/>
    <line id="heroCross" y1="0" y2="${h}" stroke="var(--fg)" stroke-width="1" opacity="0"/>
    <circle id="heroDot" r="4.5" fill="${color}" stroke="var(--card)" stroke-width="2.5" opacity="0"/>
  </svg>`;
}

// Drag across the chart and the headline follows your finger. Direct DOM writes, no
// re-render: repainting the view on every pointermove drops frames immediately.
function wireScrub() {
  const svg = document.getElementById('heroChart');
  const val = document.getElementById('heroVal');
  const sub = document.getElementById('heroSub');
  if (!svg || !val || !sub || !svg.getBoundingClientRect) return;
  const vals = String(svg.dataset.vals || '').split(',').filter(Boolean).map(Number);
  const keys = String(svg.dataset.keys || '').split(',').filter(Boolean);
  const pts = String(svg.dataset.pts || '').split(' ').filter(Boolean);
  const cross = document.getElementById('heroCross');
  const dot = document.getElementById('heroDot');
  if (vals.length < 2 || !cross || !dot) return;

  const rest = { val: val.textContent, sub: sub.innerHTML, col: sub.style.color };
  const show = clientX => {
    const r = svg.getBoundingClientRect();
    if (!r.width) return;
    const i = Math.max(0, Math.min(vals.length - 1,
      Math.round(((clientX - r.left) / r.width) * (vals.length - 1))));
    const xy = pts[i].split(',');
    cross.setAttribute('x1', xy[0]); cross.setAttribute('x2', xy[0]);
    dot.setAttribute('cx', xy[0]); dot.setAttribute('cy', xy[1]);
    cross.style.opacity = '.35'; dot.style.opacity = '1';
    val.textContent = vals[i] + '%';
    sub.style.color = 'var(--dim)';
    sub.textContent = R.fromYMD(keys[i]).toLocaleDateString(undefined,
      { weekday: 'short', day: 'numeric', month: 'short' });
  };
  const off = () => {
    cross.style.opacity = '0'; dot.style.opacity = '0';
    val.textContent = rest.val; sub.innerHTML = rest.sub; sub.style.color = rest.col;
  };
  svg.addEventListener('pointerdown', e => show(e.clientX));
  svg.addEventListener('pointermove', e => show(e.clientX));
  svg.addEventListener('pointerup', off);
  svg.addEventListener('pointerleave', off);
  svg.addEventListener('pointercancel', off);
}

function trackRow(o) {

const signed = n => (n >= 0 ? '▲ ' : '▼ ') + Math.abs(n);
const upDown = n => (n >= 0 ? 'var(--green)' : 'var(--red)');

function viewDash() {
  const d = today();
  const ctx = indexCtx();
  const from = rangeStart();
  const series = R.indexSeries(from, d, ctx);
  const vals = series.map(p => Math.round(p.score * 100));
  const avg = Math.round(vals.reduce((s, v) => s + v, 0) / vals.length);

  // The brokerage question is "up or down since when", so the comparison is the same
  // stretch of time immediately before this one.
  const span = R.daysBetween(from, d) + 1;
  const prev = R.indexSeries(R.addDays(from, -span), R.addDays(from, -1), ctx);
  const prevAvg = prev.length
    ? Math.round(prev.reduce((s, p) => s + p.score * 100, 0) / prev.length) : avg;
  const delta = avg - prevAvg;
  const col = upDown(delta);

  const hs = scheduledOn(d);
  const pct = hs.length ? Math.round((hs.reduce((s, h) => s + habitProgress(h, d), 0) / hs.length) * 100) : 0;
  const doneCount = hs.filter(h => habitDone(h, d)).length;

  let out = `<div class="card hero">
    <div class="sub">Overall · ${esc(rangeName() === 'ALL' ? 'all time' : 'past ' + rangeName())}</div>
    <div class="heroNum" id="heroVal" data-to="${avg}">${avg}%</div>
    <div class="heroDelta" id="heroSub" style="color:${col}">${signed(delta)} pts vs the stretch before</div>
    ${heroChart(series, col)}
    <div class="seg ranges">${RANGES.map(r =>
      `<button data-act="range:${r[1]}" aria-pressed="${S.range === r[1]}">${r[0]}</button>`).join('')}</div>
    <p class="hint" style="margin-top:4px;text-align:center">Drag across the chart for any day</p>
  </div>`;
  out += dailyBrief();

  // The plan lives in a file beside the app; until it's in, say so where it can't be missed.
  if (!DB.goals.some(g => String(g.id).startsWith('p1g-'))) out += `<button class="card coachcard" data-act="loadPlan">
    <div class="row"><span class="cico">🎯</span><span style="flex:1"><strong>Load my 2027 plan</strong><br>
      <span class="hint">Your goals with the habits, tasks, cards and applications behind each one.</span></span>
      <span class="chev">›</span></div></button>`;
  out += queueCard();
  const adj = DB.memory.filter(m => m.d === d && m.coll && !m.undone).length;
  if (adj) out += `<button class="card coachcard" data-act="growto:goals">
    <div class="row"><span class="cico">🧭</span><span style="flex:1">The plan adjusted ${adj} thing${adj === 1 ? '' : 's'}
      today to fit what you got done.</span><span class="chev">›</span></div></button>`;
  out += todayPlanCard();

  const tips = R.coach(coachCtx());
  if (tips.length) {
    const top = tips[0];
    out += `<button class="card coachcard ${esc(top.tone)}" data-act="coach">
      <div class="row" style="align-items:flex-start"><span class="cico">${top.icon}</span>
        <span style="flex:1"><span class="sub" style="display:block;margin-bottom:3px">Companion</span>
          ${esc(top.text)}</span>
        <span class="chev">›</span></div></button>`;
  }

  // The three positions. Same shape as a holdings list: what it is, how it has moved,
  // where it stands.
  const bud = budgetTotal();
  const spentMonth = R.spend(monthTxns(R.monthKey(d)).map(t => t.amount));
  const net = DB.accounts.reduce((s, a) => s + accountBalance(a), 0);
  const inRange = DB.txns.filter(t => t.date >= from && t.date <= d);
  const netMove = inRange.reduce((s, t) => s + t.amount, 0);
  const openCount = openTasks().length;
  const doneInRange = DB.tasks.filter(t => t.done && t.completedAt && t.completedAt >= from).length;
  const overdue = DB.tasks.filter(isOverdue).length;

  // Each track moves against the same stretch before it, exactly like the headline.
  // Comparing the last bucket to the first would measure this range against a
  // half-finished today, so every morning would read as a collapse.
  const avgOf = (arr, k) => {
    const v = arr.map(p => p[k]).filter(x => x != null);
    return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
  };
  const trackDelta = k => {
    const a = avgOf(series, k), b = avgOf(prev, k);
    return a == null || b == null ? null : Math.round((a - b) * 100);
  };
  const trackSpark = (k, color) =>
    spark(series.map(p => p[k]).filter(x => x != null).map(x => Math.round(x * 100)), color);
  const pts = n => (n == null ? '—' : signed(n) + ' pts');
  const ptsColor = n => (n == null ? 'var(--dim)' : upDown(n));
  const hDelta = trackDelta('habits'), tDelta = trackDelta('tasks'), lDelta = trackDelta('learn');
  const ret = R.retention(liveCards(), d);
  const openGoals = liveGoals().length;

  out += `<div class="card"><h2>${ic('layers')} Tracks</h2>
    ${trackRow({
      act: 'tab:habits', icon: ic('repeat'), color: 'var(--tint)', name: 'Habits',
      sub: hs.length ? `${doneCount} of ${hs.length} done today` : 'nothing scheduled today',
      spark: trackSpark('habits', 'var(--tint)'),
      value: pct + '%', delta: pts(hDelta), deltaColor: ptsColor(hDelta),
    })}
    ${trackRow({
      act: 'tab:fin', icon: ic('card'), color: 'var(--orange)', name: 'Money',
      sub: bud ? `${money0(spentMonth)} of ${money0(bud)} this month` : 'no budget set',
      spark: trackSpark('money', 'var(--orange)'),
      value: money0(net), delta: (netMove >= 0 ? '▲ ' : '▼ ') + money0(Math.abs(netMove)),
      deltaColor: upDown(netMove),
    })}
    ${trackRow({
      act: 'tab:task', icon: ic('check-square'), color: 'var(--green)', name: 'Tasks',
      sub: overdue ? `${overdue} past due` : `${openCount} open`,
      spark: trackSpark('tasks', 'var(--green)'),
      value: doneInRange + ' done', delta: pts(tDelta), deltaColor: ptsColor(tDelta),
    })}
    ${DB.apps.some(appOpen) ? appTrack() : ''}
    ${ret.total ? trackRow({
      act: 'growto:learn', icon: ic('bulb'), color: 'var(--purple)', name: 'Learning',
      sub: ret.due ? `${ret.due} card${ret.due === 1 ? '' : 's'} due now` : `${ret.learned} of ${ret.total} learned`,
      spark: trackSpark('learn', 'var(--purple)'),
      value: ret.recall == null ? '—' : Math.round(ret.recall * 100) + '%',
      delta: pts(lDelta), deltaColor: ptsColor(lDelta),
    }) : ''}`;
  if (bud) {
    const ratio = Math.min(spentMonth / bud, 1) * 100;
    out += `<div class="bar" style="margin-top:12px"><i style="width:${ratio}%;background:${
      spentMonth > bud ? 'var(--red)' : ratio > 80 ? 'var(--orange)' : 'var(--green)'}"></i></div>
      <p class="hint" style="margin-top:8px">${spentMonth > bud
        ? esc(money(spentMonth - bud)) + ' over this month’s budget'
        : esc(money(bud - spentMonth)) + ' left of this month’s budget'}</p>`;
  }
  out += `</div>`;

  if (openGoals) {
    out += `<div class="card"><h2>${ic('target')} What it is all for</h2>${liveGoals().slice(0, 4).map(g => goalCard(g, true)).join('')}</div>`;
  }

  out += `<div class="card"><h2>${ic('repeat')} Today's habits</h2>`;
  if (!hs.length) out += `<p class="hint">No habits due today. Tap + to add one.</p>`;
  else out += `<div class="strip">${hs.map(chip).join('')}</div>`;
  out += `</div>`;

  return out;
}

/** The morning brief: everything on today, overdue first, then by the clock, then any time. */
function dailyBrief() {
  const d = today();
  const slots = daySlots(d);
  // Planned sessions from Grow → Plan live in the engine's own calendar, not DB.
  if (!PLAN) PLAN = planLoad();
  if (!PLAN.error) {
    const t0 = R.fromYMD(d).getTime(), t1 = R.fromYMD(R.addDays(d, 1)).getTime();
    PLAN.u.list('session', s => s.status === 'planned' && s.start >= t0 && s.start < t1).forEach(s => slots.push({
      at: new Date(s.start).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: PLAN.u.tz }),
      act: 'growto:plan', icon: '📅', name: s.title, color: 'var(--purple)', done: false, meta: `${s.minutes} min`,
    }));
  }
  const late = DB.tasks.filter(isOverdue).map(t => ({
    at: null, act: `tbrief:${t.id}`, tick: `taskdone:${t.id}`, icon: '☑️', name: t.title,
    done: false, meta: fmtDue(t.due), late: true,
  }));
  const sched = R.daySchedule(slots);
  const items = [...late, ...sched.placed, ...sched.anytime];
  const todo = items.filter(s => !s.block); // routine blocks show the day; only these count
  const left = todo.filter(s => !s.done);
  const n = new Date(), nowMins = n.getHours() * 60 + n.getMinutes();
  const next = sched.placed.find(s => !s.done && s.mins >= nowMins);

  const summary = !items.length ? 'Nothing on today. Tap + to add something.'
    : !todo.length ? 'Your routine for today.'
    : !left.length ? `All ${todo.length} done. Good day.`
    : [`${left.length} of ${todo.length} left`,
       late.length && `${late.length} overdue`,
       next && `next: ${next.name} at ${next.at}`].filter(Boolean).join(' · ');

  const row = s => `<li>
    <span class="sub" style="flex:0 0 40px;padding-top:3px;font-variant-numeric:tabular-nums">${esc(s.at || '')}</span>
    ${s.tick && !s.done ? `<button class="tick" data-act="${s.tick}">○</button>` : `<span class="tick">${s.done ? '✅' : esc(s.icon)}</span>`}
    <div style="flex:1" data-act="${s.act}"><div class="${s.done ? 'strike' : ''}"${s === next ? ' style="font-weight:600"' : ''}>${esc(s.name)}</div>
      ${s.meta || s.late || s === next ? `<div class="meta">${s.late ? `<span style="color:var(--red)">overdue · ${esc(s.meta)}</span>`
        : s.meta ? `<span>${esc(s.meta)}</span>` : ''}${s === next ? '<span style="color:var(--tint)">up next</span>' : ''}</div>` : ''}
    </div></li>`;

  return `<div class="card"><h2>${ic('clock')} Daily brief</h2>
    <p class="sub" style="margin:0 0 6px">${esc(dayTitle(d))} · ${esc(summary)}</p>
    ${items.length ? `<ul class="list">${items.map(row).join('')}</ul>` : ''}</div>`;
}

function chip(h) {
  const d = today();
  const p = Math.round(habitProgress(h, d) * 100);
  const st = streakOf(h);
  const v = logValue(h.id, d), g = R.goalOf(h);
  const label = h.kind === 'checkbox' ? (p >= 100 ? '✓ Done' : 'Check in')
    : h.kind === 'timer' ? `${Math.round(v)} / ${g} min` : `${Math.round(v)} / ${g}`;
  return `<div class="chip">
    <div class="top"><span>${esc(h.icon)}</span>${st ? `<span class="flame">${ic('flame')}${st}</span>` : ''}</div>
    <button class="nm" data-act="hbrief:${h.id}" style="text-align:left;display:block;width:100%">${esc(h.name)}</button>
    <div class="bar"><i style="width:${p}%;background:${esc(h.color)}"></i></div>
    <button class="act" data-act="hquick:${h.id}"
      style="background:${esc(h.color)}22;color:${esc(h.color)}">${esc(label)}</button>
  </div>`;
}

function fmtDue(day) {
  if (!day) return '';
  const t = today();
  if (day === t) return 'Today';
  if (day === R.addDays(t, 1)) return 'Tomorrow';
  if (day === R.addDays(t, -1)) return 'Yesterday';
  return R.fromYMD(day).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

// ---------- habits: the grid board ----------
// HabitKit's whole idea, and the reason people pay for it: one contribution grid per
// habit, in that habit's colour. Cells carry no data-act of their own — 371 of them
// would be 20 KB of attributes per habit. The board holds one, and the click handler
// works out the date from the cell's index.

function gridStart() { return R.addDays(R.startOfWeek(today()), -(S.gridWeeks - 1) * 7); }

function gridCells(h) {
  const end = today(), g = R.goalOf(h);
  let out = '';
  for (let key = gridStart(); key <= end; key = R.addDays(key, 1)) {
    const f = R.fraction(logValue(h.id, key), g);
    const cls = [
      f >= 1 ? 'l4' : f >= .66 ? 'l3' : f >= .33 ? 'l2' : f > 0 ? 'l1' : '',
      R.isScheduled(h, key) ? '' : 'off',
      key === end ? 'now' : '',
      key === end && S.pop === h.id ? 'pop' : '',
    ].filter(Boolean).join(' ');
    out += cls ? `<i class="${cls}"></i>` : '<i></i>';
  }
  return out;
}

/** Progress towards the period's goal, and towards today's if there is more than one
    step to it. periodProgress has been in rules.js since the first build, tested and
    unused — this is what it was for. */
function habitBars(h) {
  const d = today();
  const p = R.periodProgress(h, logValue, d);
  const goal = R.goalOf(h);
  const pctOf = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);
  let out = `<div class="row" style="margin-top:14px;font-size:13px">
      <span class="sub">${h.schedule === 'monthly' ? 'This month' : 'This week'}</span>
      <span class="spacer"></span><span class="sub mono">${p.done}/${p.total}</span></div>
    <div class="bar" style="margin-top:6px"><i style="width:${pctOf(p.done, p.total)}%;background:var(--hc)"></i></div>`;
  if (goal > 1 && R.isScheduled(h, d)) {
    const v = Math.round(logValue(h.id, d));
    out += `<div class="row" style="margin-top:10px;font-size:13px">
        <span class="sub">Today</span><span class="spacer"></span>
        <span class="sub mono">${v}/${goal}${h.kind === 'timer' ? ' min' : ''}</span></div>
      <div class="bar" style="margin-top:6px"><i style="width:${pctOf(v, goal)}%;background:var(--hc)"></i></div>`;
  }
  return out;
}

function habitCard(h) {
  const d = today();
  const st = streakOf(h);
  const r = R.completionRate(h, logValue, d, 30);
  const due = R.isScheduled(h, d);
  const done = habitDone(h, d);
  return `<div class="card hcard" style="--hc:${esc(h.color)}">
    <div class="row">
      <span class="hico">${esc(h.icon)}</span>
      <button style="flex:1;text-align:left" data-act="hbrief:${h.id}">
        <div style="font-weight:600">${esc(h.name)} <span class="chev" style="font-size:15px">›</span></div>
        <div class="sub">${st ? `<span class="flame">${ic('flame')}</span> ${st} day${st > 1 ? 's' : ''}` : 'no streak yet'}
          · ${Math.round(r.rate * 100)}% of 30 days</div>
      </button>
      ${due ? `<button class="tickbtn${done ? ' on' : ''}" data-act="hquick:${h.id}"
                 aria-label="Check in">${done ? '✓' : '+'}</button>`
            : `<span class="pill">rest day</span>`}
    </div>
    ${habitBars(h)}
    <div class="gridwrap"><div class="hgrid" data-act="grid:${h.id}">${gridCells(h)}</div></div>
    <div class="row" style="margin-top:12px">
      <button class="mini" data-act="share:${h.id}">${ic('share')} Share image</button>
      <span class="spacer"></span>
      <button class="mini" data-act="hedit:${h.id}">Edit</button>
    </div>
  </div>`;
}

function viewHabits() {
  const live = liveHabits();
  let out = `<div class="seg">${[[13, '3 months'], [26, '6 months'], [53, 'Year']].map(w =>
    `<button data-act="gridweeks:${w[0]}" aria-pressed="${S.gridWeeks === w[0]}">${w[1]}</button>`).join('')}</div>`;
  if (!live.length) return out + `<div class="card"><p class="hint">
    No habits yet. Tap + to add one — unlimited, no tier, no upgrade screen.</p></div>`;
  return out + live.map(habitCard).join('') +
    `<div class="legend">Less ${[0, .3, .55, .8, 1].map(l =>
      `<i style="background:${l ? `color-mix(in srgb, var(--tint) ${Math.round(l * 100)}%, transparent)` : 'var(--card2)'}"></i>`).join('')} More</div>`;
}

// A shareable PNG of one grid. HabitKit puts this behind the subscription; it is a
// canvas and thirty lines.
function fillRound(c, x, y, w, h, r) {
  if (c.roundRect) { c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); }
  else c.fillRect(x, y, w, h);
}

function shareGrid(hid) {
  const h = habitById(hid);
  if (!h) return;
  const cell = 13, gap = 3, pad = 26, head = 82, foot = 34;
  const days = R.daysBetween(gridStart(), today()) + 1;
  const cols = Math.ceil(days / 7);
  const w = pad * 2 + cols * (cell + gap) - gap;
  const tall = head + 7 * (cell + gap) - gap + foot;
  const cv = document.createElement('canvas');
  const k = 3; // retina; the file is still well under 300 KB
  cv.width = w * k; cv.height = tall * k;
  const c = cv.getContext('2d');
  c.scale(k, k);
  const dark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const font = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif';
  c.fillStyle = dark ? '#101012' : '#ffffff';
  c.fillRect(0, 0, w, tall);

  c.fillStyle = dark ? '#ffffff' : '#000000';
  c.font = `600 20px ${font}`;
  c.fillText(`${h.icon} ${h.name}`, pad, pad + 20);
  const st = streakOf(h), r = R.completionRate(h, logValue, today(), 30);
  c.fillStyle = dark ? '#98989f' : '#6c6c70';
  c.font = `14px ${font}`;
  c.fillText(`${st} day streak · ${Math.round(r.rate * 100)}% of the last 30 days`, pad, pad + 44);

  const g = R.goalOf(h);
  let i = 0;
  for (let key = gridStart(); key <= today(); key = R.addDays(key, 1), i++) {
    const f = R.fraction(logValue(h.id, key), g);
    const off = !R.isScheduled(h, key);
    c.globalAlpha = f > 0 ? 0.28 + f * 0.72 : 1;
    c.fillStyle = f > 0 ? h.color : dark ? (off ? '#171719' : '#242426') : (off ? '#f6f7f9' : '#e9ecf1');
    fillRound(c, pad + Math.floor(i / 7) * (cell + gap), head + (i % 7) * (cell + gap), cell, cell, 3);
  }
  c.globalAlpha = 1;
  c.fillStyle = dark ? '#48484a' : '#b4b4bc';
  c.font = `12px ${font}`;
  c.fillText('Project 1%', pad, tall - pad + 8);

  cv.toBlob(b => {
    if (b) download(`${(h.name || 'habit').replace(/[^\w]+/g, '-').toLowerCase()}.png`, b, 'image/png');
    else toast('This browser could not render the image.');
  }, 'image/png');
}

// ---------- companion ----------
function coachCtx() {
  const d = today();
  return {
    habits: DB.habits, logValue, today: d, tasks: DB.tasks,
    budget: budgetTotal() || 0,
    spentMonth: R.spend(monthTxns(R.monthKey(d)).map(t => t.amount)),
    money, hour: new Date().getHours(),
    goals: DB.goals, cards: DB.cards, sessions: DB.sessions,
    goalDone, lastReview: DB.prefs.lastReview, birthday: DB.prefs.birthday,
    areasWithGoals: true, areaSilent: silentAreas(),
  };
}
/** Areas you have written a goal in but logged nothing towards. Covey's "sharpen the
    saw" made checkable: the neglected dimension is usually what breaks the others. */
function silentAreas() {
  const d = today();
  return liveGoals().map(g => g.area).filter((a, i, all) => all.indexOf(a) === i).map(area => {
    const hs = liveHabits().filter(h => h.area === area);
    let days = 0;
    while (days < 30 && !hs.some(h => logValue(h.id, R.addDays(d, -days)) > 0)) days++;
    return { area, days };
  }).filter(x => x.days >= 10).sort((a, b) => b.days - a.days);
}

// ponytail: coach() re-runs on every paint — a few thousand date comparisons, under a
// millisecond at any believable habit count. Cache it against a dirty flag if that changes.

function coachSheet() {
  const d = today();
  const tips = R.coach(coachCtx());
  let done = 0, total = 0;
  const rows = liveHabits().map(h => {
    const r = R.completionRate(h, logValue, d, 30);
    done += r.done; total += r.total;
    return { h, r, st: streakOf(h) };
  }).sort((a, b) => a.r.rate - b.r.rate);
  const pct = total ? Math.round((done / total) * 100) : 0;

  openSheet('Companion', `
    <div class="card">
      <h2>${ic('compass')} Where you actually are</h2>
      <div class="row" style="gap:18px">
        ${ring(pct, 96, pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--tint)' : 'var(--orange)')}
        <div style="flex:1"><div class="big">${pct}%</div>
          <div class="sub" style="margin-top:6px">${done} of ${total} scheduled days kept over the last 30</div></div>
      </div>
    </div>
    <div class="card"><h2>${ic('message')} What I would do next</h2>
      ${tips.length ? tips.slice(0, 7).map(x => x.act
        ? `<button class="tip" data-act="${esc(x.act)}"><span class="cico">${x.icon}</span>
             <span style="flex:1">${esc(x.text)}</span><span class="chev">›</span></button>`
        : `<div class="tip"><span class="cico">${x.icon}</span>
             <span style="flex:1">${esc(x.text)}</span></div>`).join('')
        : '<p class="hint">Nothing worth flagging. Keep going.</p>'}
      <p class="hint" style="margin-top:12px">Worked out on this phone from your own logs —
        no account, no upload, no model to pay for.</p>
    </div>
    <div class="card"><h2>${ic('bars')} Weakest first</h2>
      ${rows.length ? rows.map(x => `<div style="margin-bottom:14px">
        <div class="row"><span>${esc(x.h.icon)} ${esc(x.h.name)}</span><span class="spacer"></span>
          <span class="sub mono">${Math.round(x.r.rate * 100)}%${x.st ? ' · ' + ic('flame') + x.st : ''}</span></div>
        <div class="bar" style="margin-top:6px"><i style="width:${Math.round(x.r.rate * 100)}%;background:${esc(x.h.color)}"></i></div>
      </div>`).join('') : '<p class="hint">No habits yet.</p>'}
    </div>`);
}

// ---------- grow: goals, learning, practice, review ----------
// Four things sit above the trackers: what you are aiming at, what you are learning,
// how you are practising, and what actually happened. The techniques encoded here are
// the ones that survive testing — spacing, retrieval, interleaving, implementation
// intentions, deliberate practice, a written aim with a date. Everything is worked out
// on this phone from your own logs.

const GROWS = [['goals', 'Goals'], ['plan', 'Plan'], ['learn', 'Learn'], ['practice', 'Practice'], ['review', 'Review']];

const liveGoals = () => DB.goals.filter(g => !g.archived);
const goalById = id => DB.goals.find(g => g.id === id);
const liveCards = () => DB.cards.filter(c => !c.archived);
const dueNow = () => R.dueCards(liveCards(), today());
// A goal with a `track` counts itself from the logs; the +/- buttons add anything the
// logs can't see (an hour studied away from the timer, a call that wasn't outreach).
const goalDone = id => {
  const g = goalById(id);
  return g ? (R.trackedDone(g, adaptCtx()) || 0) + (g.done || 0) : 0;
};
const adaptCtx = () => ({ today: today(), tasks: DB.tasks, habits: DB.habits, goals: DB.goals, trades: DB.trades, logValue, logOf });
const ADAPT_COLLS = () => ({ tasks: DB.tasks, habits: DB.habits, goals: DB.goals, apps: DB.apps });

/** Apply what R.adapt says and remember each change, with what it replaced, in DB.memory. */
function runAdapt() {
  const ch = R.adapt(adaptCtx());
  ch.forEach(c => {
    const rec = (ADAPT_COLLS()[c.coll] || []).find(x => x.id === c.id);
    if (!rec) return;
    const from = {};
    Object.keys(c.set).forEach(k => { from[k] = rec[k] === undefined ? null : rec[k]; });
    Object.assign(rec, c.set);
    DB.memory.push({ id: uid(), d: today(), kind: c.kind, text: c.text, coll: c.coll, rid: c.id, from });
  });
  // ponytail: keeps the last 500 adjustments; older ones fall off rather than eat the 5 MB quota.
  if (DB.memory.length > 500) DB.memory = DB.memory.slice(-500);
  if (ch.length) save();
  return ch.length;
}

function memoryCard(n) {
  const ms = DB.memory.slice(-n).reverse();
  if (!ms.length) return '';
  return `<div class="card"><h2>${ic('repeat')} What the plan adjusted</h2>
    <p class="hint">It moves tasks that slipped and the ones behind them, steps habits up or down
      after two weeks, and sets calories from your weigh-ins. Undo any of it and it leaves that one alone.</p>
    <ul class="list">${ms.map(m => `
    <li><div style="flex:1"><div${m.undone ? ' class="strike"' : ''}>${esc(m.text)}</div>
      <div class="meta"><span>${esc(fmtDue(m.d))}</span></div></div>
      ${m.coll && !m.undone ? `<button class="btn sec" style="margin:0;flex:0 0 72px" data-act="memUndo:${m.id}">Undo</button>` : ''}</li>`).join('')}</ul></div>`;
}

function undoMemory(id) {
  const m = DB.memory.find(x => x.id === id);
  if (m && m.added) {
    DB[m.coll] = (DB[m.coll] || []).filter(x => x.id !== m.rid);
    m.undone = true; save(); return;
  }
  const rec = m && (ADAPT_COLLS()[m.coll] || []).find(x => x.id === m.rid);
  if (rec) {
    Object.assign(rec, m.from);
    if (m.coll === 'apps') rec.noMail = true;
    // Undo is a decision: the plan stops adjusting that record.
    if (m.coll === 'tasks') rec.pinned = true;
    if (m.coll === 'habits') rec.noAdapt = true;
    if (m.coll === 'goals') rec.kcalAt = today();
  }
  if (m) m.undone = true;
  save();
}


// ---------- approval queue ----------
// Anything that comes from outside the app (Gmail, Google Calendar, a plan update) is a
// proposal. Nothing changes until you approve it, and an approved change can still be undone.
function queueAdd(items) {
  const have = new Set(DB.queue.map(q => q.ref));
  let n = 0;
  items.forEach(it => {
    if (!it || have.has(it.ref)) return;
    have.add(it.ref);
    DB.queue.push(Object.assign({ id: uid(), status: 'pending', d: today() }, it));
    n++;
  });
  // ponytail: keeps the newest 300 decisions; older approved/skipped ones fall off.
  if (DB.queue.length > 300) DB.queue = DB.queue.filter(q => q.status === 'pending').concat(DB.queue.filter(q => q.status !== 'pending').slice(-200));
  if (n) save();
  return n;
}
const queuePending = () => DB.queue.filter(q => q.status === 'pending');

function approveItem(id) {
  const q = DB.queue.find(x => x.id === id);
  if (!q || q.status !== 'pending') return;
  (q.ops || []).forEach(o => {
    if (o.op === 'gpush') { DB.gsync.pushOK = true; return; }
    const list = DB[o.coll];
    if (!list) return;
    if (o.op === 'add') {
      if (list.some(x => x.id === o.rec.id)) return;
      list.push(JSON.parse(JSON.stringify(o.rec)));
      DB.memory.push({ id: uid(), d: today(), kind: q.src, text: q.text.replace(/\?$/, '') + ' (approved).', coll: o.coll, rid: o.rec.id, added: true, from: {} });
    } else if (o.op === 'set') {
      const rec = list.find(x => x.id === o.id);
      if (!rec) return;
      const from = {};
      Object.keys(o.set).forEach(k => { from[k] = rec[k] === undefined ? null : rec[k]; });
      Object.assign(rec, o.set);
      DB.memory.push({ id: uid(), d: today(), kind: q.src, text: q.text.replace(/\?$/, '') + ' (approved).', coll: o.coll, rid: o.id, from });
    }
  });
  q.status = 'approved';
  runAdapt(); // a moved deadline still pulls whatever waits on it
  save();
  if (gToken() && DB.gsync.pushOK) gPush().then(save).catch(e => { DB.gsync.err = e.message; save(); });
}
function rejectItem(id) {
  const q = DB.queue.find(x => x.id === id);
  if (!q || q.status !== 'pending') return;
  q.status = 'skipped';
  // Skipping a calendar move puts the plan's version back on the calendar at the next sync.
  const m = q.gkey && DB.gsync.map[q.gkey];
  if (m) { if (q.gdel) delete DB.gsync.map[q.gkey]; else m.sig = ''; }
  save();
}

function queueCard() {

        <div class="row qrow">
