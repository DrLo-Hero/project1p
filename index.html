<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Project 1%</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Project 1%">
<meta name="theme-color" content="#f3efe8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme: light dark;
  /* Quiet luxury: warm ivory and stone, espresso type, one bronze accent. Semantic
     colours are muted earth tones (sage, terracotta, ochre, heather) so nothing shouts. */
  --bg:#f3efe8; --card:#fbf9f5; --card2:#ebe5db; --fg:#211d18; --dim:#7b7266;
  --line:rgba(70,56,40,.12); --tint:#8c6c43; --green:#5d8a68; --red:#b4594b; --orange:#bf8a46;
  --purple:#857399;
  --radius:18px; --pad:16px;
  /* Elevation is a hairline and a whisper of shadow, never a drop shadow you notice. */
  --sh1:0 1px 1px rgba(60,44,24,.04);
  --sh2:0 10px 30px -12px rgba(60,44,24,.14), 0 1px 2px rgba(60,44,24,.04);
  --sh3:0 24px 60px -20px rgba(60,44,24,.28);
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --sans:"Jost","Futura","Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --hair:1px solid var(--line);
  /* Type scale. One ratio, used everywhere, so nothing is sized by feel. */
  --t-cap:11px; --t-sm:13px; --t-md:15px; --t-lg:17px; --t-xl:22px; --t-hero:46px;
  --ease:cubic-bezier(.22,1,.36,1);
  /* Surfaces that differ by theme get a token, so a theme is one block, not a hunt. */
  --well:var(--card2); --thumb:var(--card); --inset:inset 0 1px 2px rgba(12,14,20,.06);
  --glass:rgba(251,249,245,.78);
}
/* Theme: Auto follows the device; Light or Dark (Settings, or the sun/moon button)
   pins it with data-theme on <html>. */
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121110; --card:#1a1917; --card2:#24221f; --fg:#ede7dd; --dim:#9b9285;
         --line:rgba(237,231,221,.10); --tint:#c9a878;
         --green:#86ab8e; --red:#cf7a6b; --orange:#d4a465; --purple:#a594bb;
         --sh1:0 1px 1px rgba(0,0,0,.3);
         --sh2:0 12px 32px -14px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.3);
         --sh3:0 24px 60px -20px rgba(0,0,0,.75);
         --well:#2a2824; --thumb:#36332e; --inset:inset 0 1px 2px rgba(0,0,0,.35);
         --glass:rgba(26,25,23,.78); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#121110; --card:#1a1917; --card2:#24221f; --fg:#ede7dd; --dim:#9b9285;
         --line:rgba(237,231,221,.10); --tint:#c9a878;
         --green:#86ab8e; --red:#cf7a6b; --orange:#d4a465; --purple:#a594bb;
         --sh1:0 1px 1px rgba(0,0,0,.3);
         --sh2:0 12px 32px -14px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.3);
         --sh3:0 24px 60px -20px rgba(0,0,0,.75);
         --well:#2a2824; --thumb:#36332e; --inset:inset 0 1px 2px rgba(0,0,0,.35);
         --glass:rgba(26,25,23,.78); color-scheme:dark; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* iOS Safari only fires click on non-button elements that look clickable.
   Without this, tapping a transaction row or a task title does nothing. */
[data-act]{cursor:pointer}
#crash{position:fixed;inset:auto 12px 12px;z-index:99;background:#ff375f;color:#fff;
       border-radius:12px;padding:12px 14px;font:13px/1.45 ui-monospace,Menlo,monospace;
       white-space:pre-wrap;word-break:break-word;max-height:45dvh;overflow:auto}
#crash[hidden]{display:none}
html,body{margin:0;padding:0;height:100%}
/* Two faces, shipped with the app (app/fonts, OFL) so they work offline: Jost, a clean
   geometric sans, for everything you read; Cormorant Garamond for what you look at —
   the clock, the titles, the big numbers. Native fonts stand in until they load. */
@font-face{font-family:"Jost";src:url(fonts/jost.woff2) format("woff2");font-weight:300 600;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant.woff2) format("woff2");font-weight:300 600;font-display:swap}
body{
  background:var(--bg); color:var(--fg);
  font:var(--t-md)/1.5 var(--sans);
  font-feature-settings:"kern","liga";
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}

/* Keyboard users get the same affordance the mouse gets. One rule, every control. */
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
/* Hover only where a pointer can actually hover — on touch this would stick after a tap. */
@media (hover:hover) and (pointer:fine){
  .card.coachcard:hover,.track:hover,.goal:hover,.opt:hover{background:var(--card2)}
  .chip:hover{transform:translateY(-2px)}
  .seg button:hover:not([aria-pressed="true"]),nav button:hover{color:var(--fg)}
  .btn:hover{filter:brightness(1.06)}
  .mini:hover,.grades button:hover,.stars button:hover{background:var(--line)}
}
.chip{transition:transform .18s var(--ease),box-shadow .18s var(--ease)}

#app{display:flex;flex-direction:column;height:100dvh}
header{
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-bottom:var(--hair); position:sticky;top:0;z-index:5;
}
header h1{font-size:var(--t-lg);font-weight:650;letter-spacing:-.01em;margin:0;flex:1;text-align:center}
header button{width:34px;height:34px;border-radius:17px;color:var(--fg);font-size:18px;
  display:flex;align-items:center;justify-content:center;background:var(--card2)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--pad);padding-bottom:120px}

nav{
  display:flex;
  background:color-mix(in srgb, var(--card) 84%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-top:var(--hair);
  padding-bottom:env(safe-area-inset-bottom);position:sticky;bottom:0;z-index:5;
}
nav button{flex:1;padding:9px 0 7px;font-size:10px;font-weight:550;letter-spacing:.01em;
  color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .18s var(--ease);position:relative}
nav button .ic{line-height:0;font-size:22px}
nav button[aria-current="page"]{color:var(--tint)}
/* The active tab is named twice — colour and a rail — so it survives a colour-blind read. */
nav button[aria-current="page"]::before{
  content:"";position:absolute;top:0;left:50%;width:22px;height:2px;margin-left:-11px;
  border-radius:0 0 2px 2px;background:var(--tint)}

/* On a tablet, a wall or a desktop the app uses the screen, the way a smart calendar
   does: Today and the week spread into columns, everything else stays a readable
   column in the middle, and sheets become a centred panel instead of a full-width drawer. */
@media (min-width:760px){
  body{background:
    radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--tint) 7%, transparent), transparent 60%),
    var(--bg)}
  #app{max-width:none;margin:0 auto;height:100dvh}
  #main > div{max-width:720px;margin:0 auto}
  #main > div.wide{max-width:none}
  main{padding:20px 24px 120px}
  nav{justify-content:center}
  nav button{flex:0 1 120px}
  #fab{right:max(24px, calc(50% - 696px))}
}

#fab{
  position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:28px;color:#fff;font-size:26px;z-index:6;
  display:flex;align-items:center;justify-content:center;
  /* A flat disc reads as a sticker. The gradient plus a tinted shadow sits it on the page. */
  background:linear-gradient(160deg, color-mix(in srgb, var(--tint) 88%, #fff), var(--tint));
  box-shadow:0 8px 22px color-mix(in srgb, var(--tint) 42%, transparent), 0 2px 6px rgba(0,0,0,.2);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
}
#fab:active{transform:scale(.92)}
@media (hover:hover) and (pointer:fine){
  #fab:hover{transform:translateY(-2px);
    box-shadow:0 12px 28px color-mix(in srgb, var(--tint) 50%, transparent), 0 2px 6px rgba(0,0,0,.22)}
}

.card{background:var(--card);border-radius:var(--radius);padding:var(--pad);margin-bottom:14px;
      border:var(--hair);box-shadow:var(--sh1)}
/* Section heads are a label, not a sentence: small caps-ish, tracked out, with the icon
   sized to the text so the two sit on one optical line. */
.card h2{font-size:var(--t-cap);font-weight:650;color:var(--dim);margin:0 0 13px;
         text-transform:uppercase;letter-spacing:.07em;
         display:flex;align-items:center;gap:7px}
.card h2 svg{width:14px;height:14px;flex:0 0 14px;opacity:.85}
.hint{color:var(--dim);font-size:var(--t-sm);margin:0}

/* ---------- icons ----------
   One inline <symbol> sprite, drawn once in the document and referenced by <use>.
   No icon font, no library: it inherits currentColor, scales, and works offline. */
#sprite{display:none}
.i{width:1em;height:1em;display:inline-block;vertical-align:-.125em;
   fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i.fill{fill:currentColor;stroke:none}
.row{display:flex;align-items:center;gap:10px}
.row + .row{margin-top:10px}
.spacer{flex:1}
.big{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1}
.sub{color:var(--dim);font-size:13px}
.divider{height:1px;background:var(--line);margin:10px 0}
.mono{font-variant-numeric:tabular-nums}

.bar{height:8px;border-radius:4px;background:var(--well);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--tint);transition:width .25s}

.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;margin:0 calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad)}
.chip{flex:0 0 150px;background:var(--card2);border-radius:14px;padding:12px;scroll-snap-align:start}
.chip .top{display:flex;align-items:center;justify-content:space-between;font-size:20px}
.chip .nm{font-size:14px;font-weight:500;margin:8px 0;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip .act{display:block;width:100%;margin-top:10px;padding:6px;border-radius:999px;font-size:12px;font-weight:600;text-align:center}
.flame{font-size:12px;font-weight:600;color:var(--orange)}

.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:11px;color:var(--dim)}
.day{aspect-ratio:1;border-radius:8px;background:var(--card2);display:flex;flex-direction:column;
     align-items:center;justify-content:center;gap:3px;font-size:12px;position:relative}
.day.today{outline:2px solid var(--tint);outline-offset:-2px}

.yearwrap{overflow-x:auto;margin:0 calc(var(--pad) * -1);padding:4px var(--pad)}
.year{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.year i{border-radius:2px;background:var(--card2);display:block}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);justify-content:center}
.legend i{width:12px;height:12px;border-radius:3px;display:block}

.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .tick{font-size:20px;line-height:1.2;width:24px;flex:0 0 24px;text-align:center}
.list .meta{font-size:12px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.strike{text-decoration:line-through;color:var(--dim)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;background:var(--card2);color:var(--dim)}

.seg{display:flex;background:var(--card2);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:13px;font-weight:500;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}

#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.4)}
#sheet.open{display:block}
#sheetBody{
  position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;
  background:var(--bg);border-radius:20px 20px 0 0;
  padding:0 var(--pad) calc(24px + env(safe-area-inset-bottom));
}
#sheetBody header{background:var(--bg);border-radius:20px 20px 0 0;padding-top:14px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}

label.f{display:block;margin:14px 0 6px;font-size:13px;color:var(--dim)}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);appearance:none;font-size:16px;
}
textarea{min-height:90px;resize:vertical}
.inline{display:flex;gap:10px}
.inline > *{flex:1}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--tint);color:#fff;
     font-weight:600;text-align:center;margin-top:18px}
.btn.sec{background:var(--card);color:var(--tint)}
.btn.danger{background:var(--card);color:var(--red)}
.btn[disabled]{opacity:.4}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.picks button{width:42px;height:42px;border-radius:21px;font-size:20px;background:var(--card);
              display:flex;align-items:center;justify-content:center}
.picks button[aria-pressed="true"]{outline:2px solid var(--tint)}
.swatch{width:30px;height:30px;border-radius:15px}
.dows{display:flex;gap:6px;margin-top:6px}
.dows button{flex:1;height:38px;border-radius:19px;background:var(--card);font-size:12px;font-weight:600}
.dows button[aria-pressed="true"]{background:var(--tint);color:#fff}
.check{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--card2);flex:0 0 51px;transition:background .2s}
.sw[aria-pressed="true"]{background:var(--green)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;
           background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim);margin-top:10px}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:2px;display:block}

.wizard{text-align:center;padding:10px 0 0}
.wizard .art{font-size:56px;margin-bottom:10px}
.wizard h2{font-size:26px;font-weight:700;color:var(--fg);margin:0 0 8px;display:block;text-transform:none}
.wizard p{color:var(--dim);margin:0 0 6px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:14px;margin-top:10px;text-align:left;width:100%}
.opt .tickbox{margin-left:auto;font-size:20px}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0 0}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);display:block}
.dots i.on{background:var(--tint)}
.banner{background:var(--card);border-left:3px solid var(--orange);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}

/* ---------- motion ----------
   Everything here is CSS. No animation library, no per-element JS timers: the
   browser composites transform/opacity off the main thread, which is the only way
   371 grid cells stay smooth on a phone. */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.35);opacity:.4}60%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes drawring{from{stroke-dashoffset:var(--from)}}
@keyframes burst{0%{transform:scale(.3);opacity:.85}100%{transform:scale(3.4);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

button,[data-act]{transition:transform .12s ease}
button:active,[data-act]:active{transform:scale(.96)}
/* The grid is the tap target for its cells; scaling the whole board on touch
   makes the cell under your finger move away from it. */
.hgrid:active{transform:none}
.fadein{animation:fadeUp .26s cubic-bezier(.22,1,.36,1) both}
.bar i{transition:width .45s cubic-bezier(.22,1,.36,1)}
.flame{display:inline-block;animation:breathe 2.6s ease-in-out infinite}
.ring{display:block;flex:0 0 auto}
.ring circle + circle{animation:drawring .9s cubic-bezier(.22,1,.36,1)}
.burst{position:fixed;left:50%;top:44%;width:76px;height:76px;margin:-38px 0 0 -38px;
  border-radius:50%;border:3px solid var(--hc);pointer-events:none;z-index:40;
  animation:burst .6s ease-out forwards}

/* ---------- habit grids ---------- */
.hcard{animation:rise .3s cubic-bezier(.22,1,.36,1) both}
.hico{font-size:22px;width:40px;height:40px;flex:0 0 40px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:color-mix(in srgb, var(--hc) 16%, transparent)}
.tickbtn{width:38px;height:38px;flex:0 0 38px;border-radius:19px;font-size:19px;font-weight:700;
  color:var(--hc);background:color-mix(in srgb, var(--hc) 15%, transparent);
  display:flex;align-items:center;justify-content:center;transition:background .25s,color .25s,transform .12s}
.tickbtn.on{background:var(--hc);color:#fff}
.gridwrap{overflow-x:auto;margin:14px calc(var(--pad) * -1) 0;padding:2px var(--pad)}
.hgrid{display:grid;grid-template-rows:repeat(7,var(--cell));grid-auto-flow:column;
       grid-auto-columns:var(--cell);gap:3px;--cell:12px;width:max-content;
       animation:wipe .55s cubic-bezier(.22,1,.36,1) both}
.hgrid i{border-radius:3px;background:var(--well);display:block}
.hgrid i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hgrid i.l1{background:color-mix(in srgb, var(--hc) 28%, transparent)}
.hgrid i.l2{background:color-mix(in srgb, var(--hc) 50%, transparent)}
.hgrid i.l3{background:color-mix(in srgb, var(--hc) 74%, transparent)}
.hgrid i.l4{background:var(--hc)}
.hgrid i.now{box-shadow:0 0 0 1.5px var(--fg)}
.hgrid i.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.mini{font-size:13px;color:var(--tint);padding:7px 12px;border-radius:9px;background:var(--card2)}

/* ---------- companion ---------- */
.coachcard{display:block;width:100%;text-align:left;border-left:3px solid var(--tint);
           animation:rise .3s cubic-bezier(.22,1,.36,1) both}
.coachcard.warn{border-left-color:var(--orange)}
.coachcard.good{border-left-color:var(--green)}
.cico{font-size:22px;width:30px;flex:0 0 30px;text-align:center;line-height:1.3}
.chev{color:var(--dim);font-size:20px}
.tip{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
     padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35}
.tip:last-child{border-bottom:0}

/* ---------- dashboard ---------- */
.heroNum{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1.05;
         font-variant-numeric:tabular-nums;margin:2px 0 4px}
.heroDelta{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;min-height:1.2em}
/* pan-y, not none: a vertical swipe still scrolls the page, a sideways drag scrubs. */
.scrub{width:100%;height:auto;display:block;margin:14px 0 8px;touch-action:pan-y}
.scrub:active{transform:none}
.heroLine{stroke-dasharray:1;animation:drawline 1.1s cubic-bezier(.22,1,.36,1)}
@keyframes drawline{from{stroke-dashoffset:1}}
.ranges{margin:0}
.ranges button{font-size:12px;padding:5px}
.sparkline{flex:0 0 auto;margin:0 4px;opacity:.85}
.track{display:flex;align-items:center;gap:11px;width:100%;padding:12px 0;
       border-bottom:1px solid var(--line);text-align:left}
.track:last-of-type{border-bottom:0}

/* ---------- goals, cards, practice ---------- */
.goal{display:block;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line)}
.goal:first-of-type{padding-top:2px}
.goal:last-child{border-bottom:0;padding-bottom:2px}
.ident{font-size:12px;color:var(--tint);margin-top:4px}
.intent{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.55;
        background:var(--card2);border-radius:9px;padding:9px 11px}
.intent b{color:var(--fg);font-weight:600}
.face{min-height:132px;display:flex;align-items:center;justify-content:center;text-align:center;
      font-size:19px;line-height:1.45;padding:20px 4px}
.face.back{border-top:1px solid var(--line);font-size:16px;color:var(--dim);
           animation:fadeUp .3s cubic-bezier(.22,1,.36,1) both}
.face.back b{color:var(--fg);font-weight:600}
.grades{display:flex;gap:8px;margin-top:14px}
.grades button{flex:1;padding:15px 0;border-radius:12px;font-size:13px;font-weight:600;
               background:var(--card2)}
.grades button .k{display:block;font-size:10px;color:var(--dim);font-weight:500;margin-top:3px}
.stars{display:flex;gap:7px}
.stars button{flex:1;padding:12px 0;border-radius:10px;background:var(--card2);font-size:14px}
.stars button[aria-pressed="true"]{background:var(--tint);color:#fff}
.deck{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.deck i{height:6px;border-radius:3px;flex:1 0 12px;background:var(--card2);display:block}
.qa{font-size:12px;color:var(--dim);margin-top:4px}

/* ---------- the hour grid ---------- */
.hours{margin-top:2px}
.hrow{display:flex;gap:10px;min-height:44px;border-top:1px solid var(--line);position:relative}
.hrow:last-child{border-bottom:1px solid var(--line)}
.hrow.enter{animation:fadeUp .3s cubic-bezier(.22,1,.36,1) both}
.hrow.anytime{border-top:0;border-bottom:1px solid var(--line);min-height:0;padding-bottom:8px}
.hlabel{flex:0 0 30px;font-size:11px;color:var(--dim);padding-top:5px;text-align:right;
        font-variant-numeric:tabular-nums}
.hlane{flex:1;display:flex;flex-direction:column;gap:5px;padding:5px 0 7px;min-width:0;min-height:34px}
.slot{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-size:13px;
      width:100%;background:color-mix(in srgb, var(--hc) 14%, transparent);border-left:3px solid var(--hc)}
.slot.done{opacity:.5}
.slot .t{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
/* The line sits inside the hour it belongs to, so a row that grew to fit three items
   doesn't push it out of place. */
.hrow.now::after{content:"";position:absolute;left:30px;right:0;top:var(--nowpos);
                 height:2px;background:var(--red);pointer-events:none}
.hrow.now::before{content:"";position:absolute;left:26px;top:calc(var(--nowpos) - 3px);
                  width:8px;height:8px;border-radius:4px;background:var(--red);z-index:1;
                  pointer-events:none;animation:breathe 2.6s ease-in-out infinite}

/* ---------- calendar marks ---------- */
.dnum{line-height:1;font-variant-numeric:tabular-nums}
.marks{display:flex;gap:3px;height:5px}
.marks i{width:5px;height:5px;border-radius:3px;display:block}
.marks i.off{background:var(--fg);opacity:.1}
.day.future{opacity:.42}

/* ---------- sheet ---------- */
#sheet{opacity:0;transition:opacity .24s ease}
#sheet.in{opacity:1}
#sheetBody{transform:translateY(101%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
#sheet.in #sheetBody{transform:none}

/* ---------- refinement pass ----------
   Appended last on purpose: these override the blocks above at equal specificity
   rather than editing each in place, so the cascade order is the whole story. */

/* Anything that pairs an icon with a word lines them up the same way. */
.flame,.mini,.tip,.opt strong{display:inline-flex;align-items:center;gap:5px}
.flame{gap:3px}
.mini{gap:6px;font-weight:550;border:var(--hair);transition:background .18s var(--ease)}
.hico{color:var(--hc)}
.cico{display:flex;align-items:center;justify-content:center}
.meta{align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}

/* Digits that stack in a column have to share a width or the column wobbles. */
.big,.heroNum,.heroDelta,.sub,.mono,.dnum,.hlabel,.track,.chip .act,.pill{
  font-variant-numeric:tabular-nums}

/* Hero: the number is the page. A faint wash of the accent lifts it off the card
   stack without adding another border. */
.card.hero{position:relative;overflow:hidden;
  background:
    radial-gradient(120% 100% at 0% 0%, color-mix(in srgb, var(--tint) 10%, transparent), transparent 62%),
    var(--card)}
.heroNum{font-size:var(--t-hero);letter-spacing:-.03em;font-weight:700}
.heroDelta{letter-spacing:-.01em}
.card.hero .sub{text-transform:uppercase;letter-spacing:.07em;font-size:var(--t-cap);font-weight:650}

/* Segmented control: an inset well with a raised thumb, so pressed state is a
   surface change and not only a colour change. */
.seg{box-shadow:var(--inset);gap:2px}
.seg button{font-weight:550;color:var(--dim);transition:color .18s var(--ease),background .18s var(--ease)}
.seg button[aria-pressed="true"]{color:var(--fg);font-weight:600;
  background:var(--thumb);box-shadow:var(--sh1)}

.bar{box-shadow:inset 0 1px 2px rgba(12,14,20,.07)}
.chip{border:var(--hair);box-shadow:var(--sh1)}
.chip .nm{font-weight:550;letter-spacing:-.01em}
.chip .act{border:var(--hair);border-color:transparent}

/* Primary action: same treatment as the FAB so the two read as one button family. */
.btn{background:linear-gradient(160deg, color-mix(in srgb, var(--tint) 88%, #fff), var(--tint));
     box-shadow:0 4px 14px color-mix(in srgb, var(--tint) 32%, transparent);
     letter-spacing:-.01em;transition:transform .14s var(--ease),filter .18s var(--ease)}
.btn.sec,.btn.danger{background:var(--card);box-shadow:var(--sh1);border:var(--hair)}
.btn:active{transform:scale(.985)}

/* Rows are the main interactive surface; give them a hit area with an edge, not just text. */
.track,.goal{border-radius:10px;padding-left:8px;padding-right:8px;margin-left:-8px;margin-right:-8px;
             width:calc(100% + 16px);transition:background .18s var(--ease)}
.pill{font-weight:600;letter-spacing:.02em;border:var(--hair)}
.tick{transition:transform .14s var(--ease),color .18s var(--ease)}

input:focus,select:focus,textarea:focus{border-color:var(--tint);outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--tint) 18%, transparent)}
label.f{text-transform:uppercase;letter-spacing:.06em;font-size:var(--t-cap);font-weight:650}

#sheetBody{box-shadow:var(--sh3)}
#sheet{background:rgba(8,9,14,.46);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.grab{background:var(--dim);opacity:.35}

.day{transition:transform .14s var(--ease)}
.day.today{outline-width:2px;box-shadow:0 0 0 4px color-mix(in srgb, var(--tint) 14%, transparent)}
.banner{box-shadow:var(--sh1);border:var(--hair);border-left:3px solid var(--orange)}
.coachcard{border:var(--hair);border-left:3px solid var(--tint)}
.coachcard.warn{border-left-color:var(--orange)}
.coachcard.good{border-left-color:var(--green)}
.intent{border:var(--hair)}
.wizard h2{letter-spacing:-.02em;text-transform:none}
.opt{border:var(--hair);box-shadow:var(--sh1);transition:background .18s var(--ease)}


/* ---------- briefings and approvals ----------
   Added after the original design; they use its tokens and nothing else. */
.qrow{gap:8px;margin-top:9px}
.qrow .btn{margin:0;flex:0 0 auto;width:auto;padding:8px 18px;font-size:13px}
.bp{margin:0 0 9px;line-height:1.55}
.blist{margin:2px 0 10px;padding-left:20px}
.blist li{margin:4px 0;line-height:1.5;padding-left:2px}
.blist li::marker{color:var(--tint)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:7px 14px;margin:0 0 8px}
.kv dt{font-size:var(--t-cap);font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding-top:2px}
.kv dd{margin:0;line-height:1.45}
.bref{display:inline-block;margin:4px 14px 2px 0;color:var(--tint);font-size:13.5px}
.phases .pm{display:block;border:0;padding:12px 0 2px;font-size:var(--t-cap);font-weight:650;letter-spacing:.07em;color:var(--tint)}
.s14{display:flex;gap:3px}
.s14 i{flex:1;height:16px;border-radius:3px;background:var(--card2)}
.s14 i.on{background:var(--hc)}
.s14 i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- the smart calendar ----------
   Today read from across a room: a big clock, the week, now and next, the day as a
   timeline, the program. Same tokens as everything above. */
:root{--radius:20px}
@media (min-width:760px){
  /* Sheets: a centred panel, not a drawer the width of a wall. After the sheet's own
     transform rules above, so these win. */
  #sheetBody{left:50%;right:auto;width:min(600px, 100%);bottom:16px;border-radius:20px;
             transform:translate(-50%, 110%)}
  #sheet.in #sheetBody{transform:translate(-50%, 0)}
}
.quiet *{animation:none !important}
.sect{font-size:var(--t-cap);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:20px 4px 10px}
.tl .meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px;font-size:12px;color:var(--dim)}
  background:linear-gradient(90deg, var(--green) var(--p), var(--line) var(--p))}

/* ---------- the shell, refined ----------
   A borderless header, a floating tab bar. */
header{border-bottom:0;background:color-mix(in srgb, var(--bg) 70%, transparent)}
nav{margin:0 auto calc(env(safe-area-inset-bottom) + 10px);width:min(520px, calc(100% - 24px));padding:4px;
    border-radius:24px;border:var(--hair);box-shadow:var(--sh2);background:var(--glass)}
nav button{border-radius:18px;padding:7px 0 6px}
nav button[aria-current="page"]{background:color-mix(in srgb, var(--tint) 13%, transparent)}
nav button[aria-current="page"]::before{display:none}
#fab{bottom:calc(84px + env(safe-area-inset-bottom))}

/* The slide names, in the header on Home. */
.pills{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--well);box-shadow:var(--inset)}
header .pills button{width:auto;height:auto;background:none}
.pills button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--dim);
  transition:background .3s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease)}
header .pills button[aria-current="true"],.pills button[aria-current="true"]{background:var(--thumb);color:var(--fg);box-shadow:var(--sh1)}
@media (max-width:430px){ .pills button{padding:5px 9px;font-size:12px} }

/* ---------- the deck ----------
   Slides side by side, snapped. Swipe, tap a name, or use the arrow keys. Each slide
   scales and fades with the swipe itself (a scroll-driven animation), so the motion is
   tied to your finger rather than played at you. */
main.deckmode{padding:0;overflow:hidden}
.sdeck{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;
      overscroll-behavior-x:contain;scrollbar-width:none}
.sdeck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;
       -webkit-overflow-scrolling:touch}
.sbody{max-width:1240px;margin:0 auto;padding:18px var(--pad) 110px}
.shead{margin:4px 2px 22px}
.shead h1{font-size:clamp(32px, 4vw, 48px);font-weight:750;letter-spacing:-.04em;line-height:1.02;margin:0}
.shead p{margin:6px 0 0;color:var(--dim);font-size:var(--t-md)}
.duo{display:grid;gap:0 20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){ .duo{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:start} }
@keyframes deckin{0%{opacity:.2;transform:scale(.88)}50%{opacity:1;transform:none}100%{opacity:.2;transform:scale(.88)}}
@media (prefers-reduced-motion: no-preference){
  /* The slide box itself never moves: snapping measures the transformed box, so scaling
     the slide made the deck stop short and cut its edge off. The slide only names its
     place on the deck's scroll; what is inside it scales and fades along that timeline. */
  @supports (animation-timeline: view()){
    .slide{view-timeline:--slide inline}
    .slide > *{animation:deckin linear both;animation-timeline:--slide;animation-range:cover;transform-origin:50% 40%}
  }
}

/* ---------- Home: the photo third and the calendar two-thirds ---------- */
.home2{height:100%;display:grid;gap:16px;padding:6px 16px 14px;
       grid-template-columns:minmax(300px,1fr) minmax(0,2fr);grid-template-rows:minmax(0,1fr)}
.info{position:relative;overflow:hidden;border-radius:28px;color:#fff;min-height:0;box-shadow:var(--sh2);
      background:linear-gradient(160deg, #2b3a55, #11151f)}
#scene{position:absolute;inset:0}
#scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
           transition:opacity 2.4s ease;will-change:opacity,transform}
#scene img.show{opacity:1}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.16) translate(-2%, -1.5%)}}
@media (prefers-reduced-motion: no-preference){ #scene img.show{animation:kb 70s linear both} }
/* A scrim top and bottom, so white type reads on any photo. */
#scene::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.52) 0%, rgba(0,0,0,.14) 36%, rgba(0,0,0,.22) 62%, rgba(0,0,0,.7) 100%)}
.scap{position:absolute;left:20px;right:20px;bottom:15px;z-index:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
      font-size:12px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.scap span{color:rgba(255,255,255,.62)}
.info-body{position:relative;z-index:1;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;
           padding:20px 20px 52px;text-shadow:0 1px 14px rgba(0,0,0,.35);scrollbar-width:none}
.ib-top{display:flex;gap:8px;justify-content:flex-end;margin-bottom:-14px}
.ib-time{font-size:clamp(64px, 7.4vw, 124px);font-weight:300;letter-spacing:-.055em;line-height:.9;
         font-variant-numeric:tabular-nums}
.ib-time small{font-size:.26em;font-weight:500;letter-spacing:0;margin-left:.22em;opacity:.85}
.ib-date{font-size:clamp(20px, 1.8vw, 27px);font-weight:600;letter-spacing:-.02em}
.ib-greet{font-size:14px;opacity:.88;margin-top:-8px}
.glass{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
       border:1px solid rgba(255,255,255,.22);border-radius:18px;color:#fff;text-shadow:none}
.gbtn{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:17px}
.wx{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;text-align:left}
.wxi{font-size:40px;line-height:1}
.wxt{font-size:34px;font-weight:300;letter-spacing:-.03em;margin-right:8px}
.wxl{font-size:15px;font-weight:600}
.wx small,.upn small,.tt small{display:block;font-size:12px;opacity:.82}
.wxd{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 6px;text-align:center}
.wxd span{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:21px}
.wxd b{font-size:14px;font-weight:600}
.wxd small{font-size:11px;opacity:.75}
.sunrow{font-size:13px;opacity:.92;padding:0 4px}
.tide{padding:12px 16px}
.ttl{flex:1;font-size:14px;font-weight:600}
.tt{text-align:right}
.tt b{display:block;font-size:15px;font-weight:600}
.tline{display:block;width:100%;height:40px;margin-top:8px}
.upn{display:flex;flex-direction:column;gap:1px;width:100%;padding:12px 16px;text-align:left}
.upn b{font-size:16px;font-weight:600;margin-bottom:5px}
.upn b:last-child{margin-bottom:0}

.calpane{margin:0;display:flex;flex-direction:column;min-height:0;padding:16px 14px 8px;border-radius:28px}
.cp-top{display:flex;align-items:center;gap:6px;margin:0 4px 12px}
.cp-month{margin:0;font-size:clamp(22px, 2.2vw, 30px);font-weight:700;letter-spacing:-.035em}
.tg{flex:1;min-height:0;display:flex;flex-direction:column;--days:7}
.tg-head,.tg-body{display:grid;grid-template-columns:44px repeat(var(--days), minmax(0,1fr))}
.tg-h{min-width:0;padding:0 3px 8px;border-bottom:var(--hair)}
.tg-d{display:flex;align-items:center;gap:6px;width:100%;padding:3px 4px;border-radius:10px}
.tg-d small{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.tg-d b{font-size:21px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
        min-width:34px;height:34px;border-radius:17px;display:inline-flex;align-items:center;justify-content:center}
.tg-h.today .tg-d b{background:var(--tint);color:#fff}
.tg-h.today .tg-d small{color:var(--tint)}
.tg-any{display:flex;flex-direction:column;gap:3px;margin-top:5px;min-height:20px}
.any{max-width:100%;padding:2px 7px;border-radius:6px;font-size:11px;text-align:left;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
     background:color-mix(in srgb, var(--hc) 18%, var(--card));box-shadow:inset 2px 0 0 var(--hc)}
.any.done{opacity:.5;text-decoration:line-through}
.any.more{background:none;box-shadow:none;color:var(--dim)}
.tg-body{flex:1;min-height:0}
.tg-hours{position:relative}
.tg-hours span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--dim);
               white-space:nowrap;font-variant-numeric:tabular-nums}
.tg-col{position:relative;min-width:0;border-left:var(--hair);
  background-image:repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(100% / var(--hours)))}
.tg-col.today{background-color:color-mix(in srgb, var(--tint) 5%, transparent)}
.band{position:absolute;left:0;right:0;overflow:hidden;border-top:1px dashed var(--line);
      background:color-mix(in srgb, var(--fg) 3.5%, transparent)}
.band span{position:absolute;right:4px;top:2px;font-size:10px;color:var(--dim);white-space:nowrap;opacity:.75}
.ev{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;margin-left:2px;
    padding:3px 6px;border-radius:8px;font-size:11.5px;line-height:1.25;text-align:left;
    background:color-mix(in srgb, var(--hc) 22%, var(--card));border-left:3px solid var(--hc);
    box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ev b{max-width:100%;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{font-size:10.5px;color:var(--dim)}
.ev.done{opacity:.5}
.ev.done b{text-decoration:line-through}
@media (hover:hover) and (pointer:fine){ .ev:hover{z-index:3;filter:brightness(1.04);box-shadow:var(--sh2)} }
.nowl{position:absolute;left:-1px;right:0;z-index:2;height:2px;background:var(--red);pointer-events:none}
.nowl::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:4px;background:var(--red)}

/* Narrower screens show fewer days; a phone stacks the photo over the calendar. */
@media (max-width:1279px){ .tg{--days:5} .tg .x5{display:none} }
@media (max-width:759px){
  .home2{grid-template-columns:minmax(0,1fr);grid-template-rows:none;height:auto;padding:6px 12px 110px}
  .info{min-height:min(76vh, 640px)}
  .tg{--days:3}
  .tg .x3{display:none}
  .tg-body{flex:none;height:calc(var(--hours) * 46px)}
}

/* ---------- transitions ----------
   A tab change hands over rather than cross-fades: the old page fades out first, then the
   new one rises in, so two different layouts are never on screen at once (a straight
   cross-fade laid the old title over the new slide names and ghosted the cards). The header
   and tab bar have names of their own, so they stay put and only their contents change.
   #app > header, not header: the sheet has a header too, and a name used twice cancels
   the whole transition. A theme change washes in as a circle from where you tapped. */
#app > header{view-transition-name:p1-header}
#tabs{view-transition-name:p1-tabs}
#fab{view-transition-name:p1-fab}
::view-transition-group(*){animation-duration:.38s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-old(root){animation:vt-out .14s ease-in both}
::view-transition-new(root){animation:vt-in .34s .1s cubic-bezier(.22,1,.36,1) both}
/* The bars stay live through a tab change, so their markers can be seen gliding. */
::view-transition-old(p1-header),::view-transition-old(p1-tabs){display:none}
::view-transition-new(p1-header),::view-transition-new(p1-tabs){animation:none}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-fade{from{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
/* The theme circle covers the whole screen, header and tab bar included. */
html.vt-theme #app > header,html.vt-theme #tabs,html.vt-theme #fab{view-transition-name:none}
html.vt-theme::view-transition-old(root){animation:none}
html.vt-theme::view-transition-new(root){animation:reveal .8s cubic-bezier(.22,1,.36,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vx, 50%) var(--vy, 0))}to{clip-path:circle(150vmax at var(--vx, 50%) var(--vy, 0))}}

.nncard{padding:0;overflow:hidden}
.nn{padding:var(--pad) var(--pad) var(--pad) calc(var(--pad) - 4px);border-left:4px solid var(--hc)}
.nn + .nn{border-top:var(--hair)}
.nnl{display:block;font-size:var(--t-cap);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
     color:var(--hc);margin-bottom:6px}
.nnt{font-size:var(--t-xl);font-weight:650;letter-spacing:-.02em;line-height:1.2}
.nn .bar i{background:var(--hc)}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;align-items:flex-start;gap:12px;padding:9px 0}
.tl li + li{border-top:1px solid var(--line)}
.tlt{flex:0 0 46px;display:flex;flex-direction:column;font-size:var(--t-sm);font-weight:600;padding-top:2px;
     font-variant-numeric:tabular-nums}
.tlt small{font-size:11px;font-weight:500;color:var(--dim)}
.tlb{flex:1;min-width:0;border-left:3px solid var(--hc);padding:1px 0 1px 10px}
.tl li.blk .tlb{border-left-style:dotted;color:var(--dim)}
.tl li.done .tlb{opacity:.55}
.tl li.now .tlb{background:color-mix(in srgb, var(--hc) 13%, transparent);border-radius:0 10px 10px 0;padding:7px 10px}
.tl li.nowline{align-items:center;gap:8px;padding:3px 0;color:var(--red);font-size:11px;font-weight:700;border-top:0}
.tl li.nowline + li{border-top:0}
.tl li.nowline::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--red)}
.tk{flex:0 0 30px;width:30px;height:30px;border-radius:15px;border:2px solid var(--hc);position:relative;
    transition:background .18s var(--ease)}
.tk.big{flex-basis:44px;width:44px;height:44px;border-radius:22px}
.tk.on{background:var(--hc);border-color:var(--hc)}
.tk.on::after,.tk:active::after{content:"";position:absolute;left:30%;top:22%;width:28%;height:42%;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.earlier summary{cursor:pointer;list-style:none;color:var(--dim);font-size:var(--t-sm);font-weight:600;padding:6px 0}
.earlier summary::-webkit-details-marker{display:none}
.earlier summary::before{content:"▸ "}
.earlier[open] summary::before{content:"▾ "}
.tlh{font-size:var(--t-cap);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:14px 0 2px}

.prog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0}
.prog + .prog{border-top:1px solid var(--line)}
.rw{position:relative;display:flex;flex:0 0 auto}
.rw b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
      font-variant-numeric:tabular-nums}

    padding:6px 8px;border-radius:8px;font-size:12.5px;line-height:1.3;
    background:color-mix(in srgb, var(--hc) 16%, var(--card));border-left:3px solid var(--hc)}

/* Display mode: nothing but the day. */
body.kiosk header,body.kiosk nav,body.kiosk #fab{display:none}
body.kiosk #app{max-width:none}
body.kiosk main{padding-top:calc(env(safe-area-inset-top) + 18px)}
body.kiosk .ib-time{font-size:clamp(80px, 9vw, 170px)}

/* ---------- quiet luxury, and everything fitted to the screen ----------
   Last in the sheet on purpose: it restyles what is above without editing it.
   Serif for what you look at, a geometric sans for what you read, hairlines instead of
   shadows, muted colour, generous air. On a tablet or wall every slide is exactly one
   screen: the columns stretch to the bottom, the longest card scrolls inside itself, and
   type scales with the height of the display rather than sitting at phone sizes. */

/* Type */
h1,h2,h3{font-weight:500}
header h1{font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:.01em}
.card h2{font-size:10.5px;font-weight:500;letter-spacing:.18em;color:var(--dim);margin-bottom:16px}
.card h2 svg{opacity:.7}
.heroNum,.big,.wizard h2,.shead h1,.cp-month,.nnt,.wxt,.ib-time,.ib-date,.tg-d b{font-family:var(--serif)}
.heroNum{font-weight:400;letter-spacing:-.01em;font-size:clamp(46px, 7vh, 84px)}
.heroDelta,.sub,.hint,.meta{letter-spacing:.01em}
.sect,label.f,.nnl,.tlh,.tg-d small,.card.hero .sub{letter-spacing:.18em;font-weight:500}
.nnt{font-size:clamp(24px, 3.2vh, 34px);font-weight:500;letter-spacing:0;line-height:1.15}
.nnl{font-size:10.5px;color:var(--dim)}

/* Surfaces: hairlines, almost no shadow */
.card{border:1px solid var(--line);box-shadow:none;padding:clamp(16px, 2.2vh, 24px)}
.card.hero{background:var(--card)}
.chip,.opt,.banner,.coachcard,.intent{box-shadow:none}
.coachcard,.coachcard.warn,.coachcard.good{border-left-width:1px}
.coachcard{border-left-color:var(--line)}
.coachcard .cico{color:var(--tint)}
.seg{background:transparent;border:1px solid var(--line);box-shadow:none;border-radius:999px}
.seg button{border-radius:999px;font-weight:500;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.bar{background:var(--line);box-shadow:none;height:4px}
.bar i{border-radius:2px}
input,select,textarea{background:var(--card);border-color:var(--line);border-radius:12px}

/* Buttons: ink on paper */
.btn{background:var(--fg);color:var(--bg);box-shadow:none;border-radius:999px;font-weight:500;letter-spacing:.06em}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line);box-shadow:none}
.mini{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;font-weight:500;letter-spacing:.03em}
#fab{width:52px;height:52px;background:var(--fg);color:var(--bg);box-shadow:var(--sh2);font-size:22px}
@media (hover:hover) and (pointer:fine){ #fab:hover{box-shadow:var(--sh3)} .mini:hover{background:var(--well)} }
.tickbtn{border:1px solid color-mix(in oklab, var(--hc) 60%, var(--dim));background:transparent}
.tickbtn.on{background:color-mix(in oklab, var(--hc) 70%, var(--dim));border-color:transparent}

/* Header, slide names and the tab bar */
header{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:8px}
header button{background:transparent;border:1px solid var(--line)}
.pills{background:transparent;border:1px solid var(--line);box-shadow:none;padding:3px}
header .pills button,.pills button{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:6px 15px}
header .pills button[aria-current="true"],.pills button[aria-current="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
nav{box-shadow:var(--sh2);border-color:var(--line)}
nav button{font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;gap:4px}
nav button .ic{font-size:20px}
nav button[aria-current="page"]{background:transparent;color:var(--fg)}
nav button[aria-current="page"]::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;
  border-radius:2px;background:var(--tint)}
@media (max-width:430px){ header .pills button,.pills button{padding:5px 8px;letter-spacing:.08em;font-size:10px} }

/* Colour in the schedule is a hint of each habit's hue, never the full saturation */
.ev,.any,.tlb,.nn,.wi,.slot,.tk{--hm:color-mix(in oklab, var(--hc) 62%, #8a8178)}
.ev{background:color-mix(in oklab, var(--hm) 13%, var(--card));border-left:2px solid var(--hm);border-radius:6px;box-shadow:none}
.any{background:color-mix(in oklab, var(--hm) 12%, var(--card));box-shadow:inset 2px 0 0 var(--hm)}
.tlb{border-left:2px solid var(--hm)}
.nn{border-left:2px solid var(--hm)}
.nnl{color:var(--hm)}
.tk{border:1.5px solid var(--hm)}
.tk.on{background:var(--hm);border-color:var(--hm)}
.slot{background:color-mix(in oklab, var(--hm) 12%, transparent);border-left:2px solid var(--hm)}
.tl li.now .tlb{background:color-mix(in oklab, var(--hm) 10%, transparent)}
.tl li.nowline,.tl li.nowline::after{color:var(--tint);background:transparent}
.tl li.nowline::after{background:var(--tint);height:1px}
.nowl{background:var(--tint);height:1px}
.nowl::before{background:var(--tint)}

/* ---------- the deck fills the screen ---------- */
/* The wrapper between #main and the deck had no height, so the deck grew to its content
   and the bottom of every slide was cut off. */
main.deckmode > div{height:100%}
.shead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 20px;margin:0 2px clamp(12px, 2.4vh, 26px)}
.shead h1{font-weight:400;font-size:clamp(36px, 5.6vh, 64px);letter-spacing:-.01em;line-height:1}
.shead p{margin:0;font-size:13px;letter-spacing:.04em}

/* Tablet and up, when there is height to work with: one screen per slide, no gaps. */
@media (min-width:900px) and (min-height:560px){
  .sbody{height:100%;max-width:none;display:flex;flex-direction:column;
         padding:clamp(12px, 2.4vh, 30px) clamp(18px, 3vw, 56px) clamp(12px, 2vh, 22px)}
  .duo{flex:1;min-height:0;align-items:stretch;gap:clamp(14px, 1.6vw, 26px)}
  .duo > div{display:flex;flex-direction:column;gap:clamp(12px, 1.6vh, 18px);min-height:0}
  .duo > div > .card{margin:0;flex:0 1 auto;min-height:0;overflow:auto}
  /* The last card in each column takes the rest of the height. */
  .duo > div > .card:last-child{flex:1 1 0}
  .duo .card{scrollbar-width:thin}
  /* Rows spread over the height they are given instead of leaving a hole underneath. */
  .duo .card:has(> .prog),.duo .card:has(> .track){display:flex;flex-direction:column}
  .duo .card > .prog,.duo .card > .track{flex:1 0 auto}
  /* Today's habits become a grid of tiles that fills its card. */
  .duo .card:has(> .strip){display:flex;flex-direction:column}
  .duo .card > .strip{flex:1;display:grid;grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));grid-auto-rows:minmax(150px, 1fr);
    gap:12px;margin:0;padding:0;overflow:visible}
  .duo .strip .chip{display:flex;flex-direction:column;justify-content:space-between}
  /* The score chart grows into its card. */
  .duo .card.hero{display:flex;flex-direction:column}
  .duo .card.hero .scrub{flex:1;min-height:120px;height:100%}
}

/* ---------- Home: the info third ---------- */
.home2{padding:clamp(6px, 1vh, 12px) clamp(12px, 1.4vw, 22px) clamp(10px, 1.6vh, 18px);gap:clamp(12px, 1.2vw, 20px)}
.info{border-radius:24px;box-shadow:var(--sh3)}
.info-body{padding:clamp(18px, 2.6vh, 30px) clamp(18px, 1.8vw, 30px) clamp(40px, 5vh, 54px);gap:clamp(6px, 1vh, 12px);
           justify-content:flex-start}
.ib-top{position:absolute;top:clamp(14px, 2vh, 22px);right:clamp(14px, 1.4vw, 22px);margin:0;z-index:2}
.ib-time{font-weight:300;font-size:clamp(64px, 15vh, 190px);letter-spacing:-.025em;line-height:.82;margin-top:clamp(4px, 1vh, 14px)}
.ib-time small{font-family:var(--sans);font-size:.15em;font-weight:400;letter-spacing:.2em;margin-left:.35em;vertical-align:.2em}
.ib-date{font-weight:500;font-size:clamp(22px, 3.4vh, 40px);letter-spacing:.005em;line-height:1.1}
.ib-greet{margin-top:0;font-size:clamp(12px, 1.5vh, 15px);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.ib-cards{margin-top:auto;display:flex;flex-direction:column;gap:clamp(8px, 1.2vh, 12px)}
.glass{background:rgba(18,14,10,.28);border:1px solid rgba(255,255,255,.16);border-radius:18px;
       -webkit-backdrop-filter:blur(22px) saturate(120%);backdrop-filter:blur(22px) saturate(120%)}
.gbtn{width:36px;height:36px}
.gbtn .i{width:18px;height:18px;stroke-width:1.4}
.wx{display:flex;flex-direction:column;align-items:stretch;gap:clamp(8px, 1.2vh, 12px);padding:clamp(12px, 1.7vh, 18px) clamp(14px, 1.4vw, 20px)}
.wxnow{display:flex;align-items:center;gap:14px}
.wxtx{flex:1;min-width:0}
.wxi .i,.wxg{width:clamp(34px, 5vh, 52px);height:clamp(34px, 5vh, 52px);stroke-width:1.1}
.wxt{font-weight:300;font-size:clamp(32px, 5vh, 56px);letter-spacing:-.01em;line-height:1;margin-right:6px}
.wxl{font-size:clamp(13px, 1.6vh, 16px);font-weight:500;letter-spacing:.04em}
.wxd{display:grid;grid-template-columns:repeat(3, 1fr);padding-top:clamp(8px, 1.2vh, 12px);border-top:1px solid rgba(255,255,255,.14);text-align:center}
.wxd span{display:flex;flex-direction:column;align-items:center;gap:2px}
.wxd .wxg{width:clamp(20px, 2.8vh, 28px);height:clamp(20px, 2.8vh, 28px);stroke-width:1.3}
.wxd b{font-size:clamp(13px, 1.6vh, 16px);font-weight:500}
.wxd small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.sunrow{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;letter-spacing:.04em;opacity:.9}
.wxs{width:16px;height:16px;stroke-width:1.4}
.sunrow .wxs + .wxs,.sunrow .wxs:nth-of-type(2){margin-left:10px}
.tide{padding:clamp(10px, 1.5vh, 16px) clamp(14px, 1.4vw, 20px)}
.ttl{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.tt b{font-size:clamp(14px, 1.7vh, 17px);font-weight:500}
.tline{height:clamp(26px, 4vh, 44px)}
.upn{padding:clamp(10px, 1.5vh, 16px) clamp(14px, 1.4vw, 20px)}
.upn small{letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}
.upn b{font-family:var(--serif);font-size:clamp(18px, 2.4vh, 24px);font-weight:500;line-height:1.2}
/* The photo credit sits in the panel's flow, under the cards, so it can never overlap them. */
.scap{position:static;font-size:11.5px;letter-spacing:.04em;margin-top:2px}
.info .info-body{padding-bottom:clamp(12px, 1.8vh, 18px)}
/* Short screens: the same cards, closer together. */
@media (min-width:760px) and (max-height:880px){
  .ib-time{font-size:clamp(52px, 10vh, 120px)}
  .wx,.tide,.upn{padding-top:9px;padding-bottom:9px}
  .wx{gap:6px}
  .wxd{padding-top:6px}
  .wxd .wxg{width:20px;height:20px}
  .tline{height:24px;margin-top:4px}
  .upn b{font-size:17px;margin-bottom:2px}
}

/* ---------- Home: the calendar two-thirds ---------- */
.calpane{border-radius:24px;padding:clamp(14px, 2vh, 24px) clamp(12px, 1.2vw, 20px) clamp(8px, 1vh, 12px);overflow:hidden}
.cp-top{margin:0 4px clamp(8px, 1.4vh, 16px)}
.cp-month{font-weight:500;font-size:clamp(26px, 4vh, 44px);letter-spacing:0}
.tg{flex:1 1 0}
.tg-head,.tg-body{grid-template-columns:clamp(40px, 3.4vw, 54px) repeat(var(--days), minmax(0,1fr))}
.tg-d b{font-weight:500;font-size:clamp(20px, 3vh, 32px);min-width:clamp(32px, 4.4vh, 46px);height:clamp(32px, 4.4vh, 46px);border-radius:999px}
.tg-h.today .tg-d b{background:var(--fg);color:var(--bg)}
.tg-h.today .tg-d small{color:var(--fg)}
.tg-d small{font-size:clamp(10px, 1.2vh, 12px)}
.tg-body{flex:1 1 0;min-height:0}
.tg-hours span{font-size:clamp(10px, 1.15vh, 12.5px);letter-spacing:.04em}
.tg-col{background-image:repeating-linear-gradient(to bottom, color-mix(in oklab, var(--line) 70%, transparent) 0 1px, transparent 1px calc(100% / var(--hours)))}
.tg-col.today{background-color:color-mix(in oklab, var(--tint) 4%, transparent)}
.band{border-top:1px dotted var(--line);background:color-mix(in oklab, var(--fg) 2.5%, transparent)}
.ev{font-size:clamp(10.5px, 1.25vh, 13.5px);padding:clamp(2px, .35vh, 5px) clamp(5px, .5vw, 8px)}
.ev b{font-weight:500}
.ev small{font-size:.88em}
.any{font-size:clamp(10.5px, 1.2vh, 12.5px);border-radius:5px}

/* Phones keep natural scrolling; the calendar gets a fixed hour height there. */
@media (max-width:759px){
  .info{min-height:calc(100dvh - 170px)}
  /* The panel grows with what is in it, and leaves room for a credit that wraps. */
  .info .info-body{height:auto;min-height:calc(100dvh - 170px);padding-bottom:18px}
  .ib-time{font-size:clamp(72px, 22vw, 110px)}
}
/* Display mode: no header or tab bar, so the clock can be bigger still. */
body.kiosk .ib-time{font-size:clamp(80px, 18vh, 230px)}


/* Fit fixes */
/* Cormorant's default figures are old-style (the 4 and 9 drop below the line); a clock
   wants lining figures that sit on it, and columns of times want them all one width. */
.ib-time,.ib-date,.tg-d b,.wxt,.heroNum,.cp-month,.nnt,.upn b,.big,.shead h1{font-variant-numeric:lining-nums tabular-nums}
/* The month is a title, not one of the small card labels. */
.calpane h2.cp-month{display:block;margin:0;font-family:var(--serif);font-size:clamp(26px, 4vh, 44px);font-weight:500;
  letter-spacing:0;text-transform:none;color:var(--fg)}
.ib-time{font-size:clamp(56px, 11.5vh, 180px);line-height:.86}
.info-body{padding-bottom:clamp(36px, 4.4vh, 50px)}
.ib-cards{gap:clamp(6px, 1vh, 12px)}
.wxtx .sunrow{justify-content:flex-start;margin-top:2px;font-size:12px;opacity:.85}
@media (min-width:900px) and (min-height:560px){
  /* Only the last card in a column gives up height; the rest keep their content whole. */
  .duo > div{overflow:auto;scrollbar-width:none}
  .duo > div > .card{flex:0 0 auto}
  .duo > div > .card:last-child{flex:1 1 0;min-height:160px}
}


/* ---------- the two bars ----------
   One language top and bottom: a hairline track on frosted paper, small tracked capitals,
   and a single ink marker that glides to the open item. The bottom bar runs the full
   width and shares it evenly; on a phone its labels sit under the icons. */
.pills,.tabtrack{position:relative;isolation:isolate}
.thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;z-index:-1;border-radius:999px;background:var(--fg);opacity:0;
  pointer-events:none;box-shadow:0 6px 18px -8px rgba(30,22,12,.45);
  transition:transform .55s cubic-bezier(.22,1,.36,1),width .55s cubic-bezier(.22,1,.36,1),opacity .3s ease}
header{display:flex;align-items:center;gap:12px}
header .pills{margin:0 auto;padding:4px;border:1px solid var(--line);background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);box-shadow:var(--sh1)}
header .pills .thumb{top:4px;bottom:4px}
header .pills button,.pills button{position:relative;padding:8px clamp(12px, 1.6vw, 22px);border-radius:999px;background:transparent;border:0;
  font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  transition:color .4s ease}
header .pills button[aria-current="true"],.pills button[aria-current="true"]{background:transparent;color:var(--bg);box-shadow:none}

nav{width:auto;margin:0 clamp(12px, 1.4vw, 22px) calc(env(safe-area-inset-bottom) + 12px);padding:4px;border-radius:999px;
  border:1px solid var(--line);background:var(--glass);box-shadow:var(--sh2);
  -webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%)}
.tabtrack{display:flex;width:100%;gap:2px}
nav button,nav button[aria-current="page"]{flex:1 1 0;flex-direction:row;justify-content:center;align-items:center;gap:10px;
  padding:12px 8px;border-radius:999px;background:transparent;font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);transition:color .4s ease}
nav button .ic{font-size:17px;line-height:0}
nav button .ic .i{stroke-width:1.5}
nav button[aria-current="page"]{color:var(--bg)}
nav button[aria-current="page"]::before,nav button[aria-current="page"]::after{display:none}
@media (hover:hover) and (pointer:fine){
  nav button:not([aria-current="page"]):hover,header .pills button:not([aria-current="true"]):hover{color:var(--fg)}
}
#fab{bottom:calc(env(safe-area-inset-bottom) + 80px)}
@media (max-width:640px){
  nav{border-radius:26px}
  nav .thumb{border-radius:22px}
  nav button,nav button[aria-current="page"]{flex-direction:column;gap:4px;padding:8px 2px 7px;font-size:9px;letter-spacing:.1em}
  nav button .ic{font-size:19px}
  header .pills button,.pills button{padding:6px 9px;font-size:10px;letter-spacing:.08em}
}
/* A workspace's title sits where a slide's does. */
#main > div > .shead{margin-top:4px}


/* ---------- workspaces in halves and thirds ---------- */
@media (min-width:900px) and (min-height:560px){
  main.wsmode{padding:0;overflow:hidden}
  #main > div.ws{max-width:none;height:100%;display:flex;flex-direction:column;gap:clamp(10px, 1.4vh, 16px);
    padding:clamp(12px, 2.4vh, 30px) clamp(18px, 3vw, 56px) clamp(12px, 2vh, 22px)}
  .ws > .shead{margin-bottom:0}
  .ws > :not(.bcols){flex:none}
  .ws > .seg,.ws > .legend{width:100%;max-width:820px;margin:0}
  .ws > .row{width:100%;margin:0}
  .bcols{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(var(--n), minmax(0, 1fr));gap:clamp(14px, 1.6vw, 26px)}
  .bcol{display:flex;flex-direction:column;gap:clamp(12px, 1.6vh, 18px);min-height:0;overflow:auto;scrollbar-width:thin;
    padding-bottom:2px}
  .bcol > .card,.bcol > .unit{margin:0;flex:none}
  .unit{display:flex;flex-direction:column;gap:10px}
  .unit > .seg{margin:0}
  /* The last card in each column takes what is left, so every column ends at the bottom. */
  .bcol > :last-child{flex:1 0 auto}
  .bcol > .unit:last-child > .card{flex:1 0 auto}
  .bfoot{display:flex;gap:12px;flex-wrap:wrap}
  .bfoot > .btn{width:auto;margin:0;padding:11px 26px}
  .bfoot > .inline{width:100%}
  /* Habits: an even grid of cards across the whole width; the page scrolls. */
  #main > div.wsgrid{max-width:none;display:grid;grid-template-columns:repeat(auto-fill, minmax(min(360px, 100%), 1fr));
    gap:clamp(14px, 1.6vw, 24px);align-items:stretch;padding:clamp(12px, 2.4vh, 30px) clamp(18px, 3vw, 56px) 30px}
  .wsgrid > :not(.card){grid-column:1 / -1;margin:0}
  .wsgrid > .seg{max-width:820px}
  .wsgrid > .card{margin:0}
  main.wspad{padding:0}
}


/* ---------- windows ---------- */
@media (min-width:900px) and (min-height:560px){
  /* A centred window that settles in from slightly small, rather than a drawer from below. */
  #sheet{background:rgba(20,15,10,.34);-webkit-backdrop-filter:blur(6px) saturate(110%);backdrop-filter:blur(6px) saturate(110%)}
  #sheetBody{top:50%;bottom:auto;left:50%;right:auto;width:min(720px, calc(100vw - 48px));max-height:min(88vh, 980px);
    border-radius:28px;border:1px solid var(--line);padding:0 clamp(18px, 2vw, 30px) clamp(18px, 2.4vh, 28px);
    transform:translate(-50%, -48%) scale(.97);opacity:0;transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s ease}
  #sheet.in #sheetBody{transform:translate(-50%, -50%);opacity:1}
  #sheetBody .grab{display:none}
  #sheetBody header{position:sticky;top:0;z-index:2;padding:clamp(14px, 2vh, 22px) 0 clamp(12px, 1.6vh, 18px);margin-bottom:4px;
    background:color-mix(in srgb, var(--bg) 92%, transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  #sheetBody header h1{font-family:var(--serif);font-size:clamp(26px, 3.4vh, 36px);font-weight:400;letter-spacing:0;text-align:left;
    order:-1;flex:1;margin:0}
  #sheetBody header button{width:auto;height:auto;padding:8px 18px;border-radius:999px;border:1px solid var(--line);
    background:transparent;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--fg)}
  #sheetBody header > span{display:none}
  /* A window of cards: wide, a fixed height, and the cards dealt into columns. */
  #sheetBody.sheet-board{width:min(1360px, calc(100vw - 64px));height:min(88vh, 1040px);max-height:none;
    display:flex;flex-direction:column;overflow:hidden}
  .sheet-board #sheetInner{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(10px, 1.4vh, 16px)}
  .sheet-board #sheetInner > :not(.bcols){flex:none;margin:0}
  .sheet-board #sheetInner > .bfoot .btn{margin:0}
  .sheet-board .card{margin:0}
  /* A form: a compact panel; its controls keep the room they need, nothing stretched. */
  #sheetBody.sheet-form{overflow-y:auto}
}


@media (min-width:900px) and (min-height:560px){
  .bfoot .btn,.bfoot .mini{white-space:nowrap}
  /* A long form: a wider window, two balanced columns, the actions across the foot. */
  #sheetBody.sheet-form2{width:min(1120px, calc(100vw - 64px));overflow-y:auto}
  .sheet-form2 #sheetInner{column-count:2;column-gap:clamp(28px, 3vw, 48px)}
  .sheet-form2 .fld{break-inside:avoid;padding-bottom:6px}
  .sheet-form2 .fld > label.f:first-child{margin-top:8px}
  .sheet-form2 #sheetInner > :not(.fld){column-span:all}
  .sheet-form2 #sheetInner > .btn{display:inline-block;width:auto;min-width:200px;margin:18px 12px 0 0;padding:12px 30px}
}


/* ---------- glyphs ----------
   Line icons in place of emoji: a light stroke, in the muted hue of whatever they belong to
   (a habit, an event), the accent for the companion, and a quiet grey everywhere else. */
.i.g{stroke-width:1.5;color:var(--hm, var(--dim))}
.hico{--hm:color-mix(in oklab, var(--hc) 62%, #8a8178);color:var(--hm);background:color-mix(in oklab, var(--hm) 12%, transparent)}
.hico .i.g{width:20px;height:20px}
.cico .i.g{color:var(--tint);width:22px;height:22px}
.chip .top .i.g{width:22px;height:22px}
.picks button .i.g{width:20px;height:20px;color:var(--fg)}
.picks button[aria-pressed="true"]{outline:1px solid var(--fg);outline-offset:2px}
.tick .i.g{width:20px;height:20px}
.opt .i.g{width:22px;height:22px;color:var(--tint)}
.wizard .art .i{width:56px;height:56px;stroke-width:1.1;color:var(--tint)}
.inbox-acts .i.g,button .i.g{vertical-align:-.15em}
/* The tick: a hairline ring; done, it fills with ink and shows a check. */
.tm{display:inline-block;position:relative;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--dim);
  vertical-align:middle;transition:background .2s ease,border-color .2s ease}
.tm.on{background:var(--fg);border-color:var(--fg)}
.tm.on::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--bg);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}


/* A habit tile speaks in its habit's muted hue: the icon, the bar, and a quiet action pill
   that fills with that hue once the day's check-in is done. */
.chip{--hm:color-mix(in oklab, var(--hc) 62%, #8a8178)}
.chip .top .i.g{color:var(--hm)}
.chip .bar i{background:var(--hm)}
.chip .act{background:color-mix(in oklab, var(--hm) 12%, transparent);color:color-mix(in oklab, var(--hm) 80%, var(--fg));
  border:1px solid color-mix(in oklab, var(--hm) 30%, transparent);font-weight:500;letter-spacing:.06em}
.chip .act.on{background:var(--hm);color:#fff;border-color:transparent}


/* Habit cards: the round check-in, the bars and the history grid all take the muted hue. */
.hcard{--hm:color-mix(in oklab, var(--hc) 62%, #8a8178)}
.hcard .tickbtn{color:var(--hm);border-color:color-mix(in oklab, var(--hm) 55%, transparent)}
.hcard .tickbtn.on{background:var(--hm);color:#fff;border-color:transparent}
.hcard .bar i{background:var(--hm) !important}
.hgrid i.l1{background:color-mix(in oklab, var(--hm, var(--hc)) 26%, transparent)}
.hgrid i.l2{background:color-mix(in oklab, var(--hm, var(--hc)) 48%, transparent)}
.hgrid i.l3{background:color-mix(in oklab, var(--hm, var(--hc)) 72%, transparent)}
.hgrid i.l4{background:var(--hm, var(--hc))}


/* ---------- photo banners ---------- */
.hero-band{position:relative;isolation:isolate;overflow:hidden;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
  flex-wrap:wrap;gap:14px 24px;min-height:clamp(120px, 17vh, 210px);margin:0 0 clamp(12px, 2vh, 22px);
  padding:clamp(16px, 2.4vh, 28px) clamp(18px, 2vw, 30px) clamp(30px, 3.6vh, 40px);border-radius:24px;color:#fff;
  background:linear-gradient(160deg, #2b3a55, #11151f);box-shadow:var(--sh2)}
.hb-img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}
@keyframes hbdrift{from{transform:scale(1.04)}to{transform:scale(1.12) translate(-1.5%, -1%)}}
@media (prefers-reduced-motion: no-preference){ .hb-img{animation:hbdrift 45s ease-in-out infinite alternate} }
/* Dark on the left where the title sits, clearer to the right where the photo shows. */
.hero-band::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(100deg, rgba(12,9,6,.66) 0%, rgba(12,9,6,.32) 55%, rgba(12,9,6,.14) 100%),
             linear-gradient(0deg, rgba(12,9,6,.38), transparent 60%)}
.hero-band.shead{display:flex;align-items:flex-end}
.hb-text{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 20px;min-width:0}
.hero-band h1{color:#fff;text-shadow:0 1px 16px rgba(0,0,0,.3)}
.hero-band p{color:rgba(255,255,255,.84)}
.hb-stats{display:flex;flex-wrap:wrap;gap:10px}
.hb-stat{display:flex;flex-direction:column;align-items:flex-start;min-width:clamp(100px, 8.5vw, 150px);padding:10px 16px;text-align:left}
.hb-stat b{font-family:var(--serif);font-size:clamp(22px, 3.2vh, 34px);font-weight:500;line-height:1.05;
  font-variant-numeric:lining-nums tabular-nums}
.hb-stat small{margin-top:3px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.84}
button.hb-stat{cursor:pointer;transition:background .2s ease}
@media (hover:hover) and (pointer:fine){ button.hb-stat:hover{background:rgba(255,255,255,.18)} }
.hb-cap{position:absolute;right:clamp(14px, 1.6vw, 22px);bottom:9px;display:flex;align-items:center;gap:5px;
  font-size:10.5px;letter-spacing:.04em;color:rgba(255,255,255,.72)}
.hb-cap .i{width:12px;height:12px}
@media (max-width:640px){
  .hero-band{min-height:0;padding-bottom:34px}
  .hb-stats{width:100%}
  .hb-stat{flex:1 1 0;min-width:0;padding:8px 10px}
  .hb-stat small{letter-spacing:.08em}
}


/* ---------- the calendar: Day, Week, Month ---------- */
.cp-top{flex-wrap:wrap;row-gap:8px}
.calpane .cp-seg{width:auto;margin:0 0 0 clamp(8px, 1.4vw, 18px);flex:none}
.cp-seg button{padding:5px clamp(10px, 1vw, 16px);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.cm{flex:1;min-height:0;display:flex;flex-direction:column}
.cm-dow{display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:6px;padding:0 0 6px;
  font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.cm-dow span{padding-left:8px}
.cm-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));
  grid-template-rows:repeat(var(--rows), minmax(0, 1fr));gap:6px}
.mc{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:3px;padding:6px;border-radius:12px;
  background:color-mix(in oklab, var(--fg) 3%, transparent);border:1px solid transparent}
.mc.blank{background:transparent}
.mc.past{opacity:.72}
.mc.today{border-color:var(--fg)}
.mc-d{align-self:flex-start;min-width:28px;padding:3px 6px;border-radius:999px;font-family:var(--serif);
  font-size:clamp(16px, 2.2vh, 22px);font-weight:500;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.mc.today .mc-d{background:var(--fg);color:var(--bg)}
.mc .any small{color:var(--dim);margin-right:2px}
@media (max-width:759px){
  .cm-grid{grid-template-rows:repeat(var(--rows), minmax(78px, auto))}
  .mc .any.x2{display:none}
}


/* ---------- phones: the calendar sizes to its content ----------
   On a tablet the calendar stretches to the screen's height. A phone scrolls instead, so
   there is no height to stretch into: left to stretch, the grid collapsed to nothing and the
   card cut it off. Here every part takes the room its content needs. Last on purpose. */
@media (max-width:759px){
  /* Banner figures stay compact on a narrow screen instead of wrapping into tall cards. */
  .hb-stat b{font-size:clamp(18px, 5.4vw, 22px);white-space:nowrap}
  .hb-stat small{font-size:9.5px;letter-spacing:.06em}
  .calpane{overflow:visible}
  .calpane .tg,.calpane .cm,.calpane .cm-grid{flex:none;min-height:auto}
  .calpane .tg-body{flex:none;height:calc(var(--hours) * 46px);min-height:0}
}

/* Motion is decoration. If the OS says no, it all goes. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;
                       transition-duration:1ms !important}
}
</style>

  </header>
  <main id="main"></main>
  <!-- Two bars, one system. The top is the overview (Home's four slides); the bottom is
       the workspaces, ordered by how the day runs: the routine, the to-dos, the long
       game, the money. The calendar is Home's own, so it has no tab of its own. A dark marker glides to whichever is open. -->
  <nav id="tabs" aria-label="Workspaces"><div class="tabtrack"><i class="thumb" aria-hidden="true"></i>
    <button data-act="tab:habits"><span class="ic"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-grid"/></svg></span><span class="lb">Habits</span></button>
    <button data-act="tab:task"><span class="ic"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-check-square"/></svg></span><span class="lb">Tasks</span></button>
