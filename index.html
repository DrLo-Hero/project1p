async function planAct(arg, el) {
  const id = el.dataset.id, d = el.dataset.d;
  switch (arg) {
    case 'raw': download(`project1percent-plan-unreadable-${today()}.json`, PLAN.raw, 'application/json'); break;
    case 'setup': planSetupSheet(); break;
    case 'setupSave': await planSetupSave(); break;
    case 'goalNew': planGoalNewSheet(); break;
    case 'goalSave': await planGoalSave(); break;
    case 'goal': planGoalSheet(id); break;
    case 'pracSave': await planPracticeSave(id); break;
    case 'metric': {
      const v = parseFloat(val('mVal'));
      if (isNaN(v)) { toast('Enter a number.'); break; }
      if (await planRun(u => u.recordMetric(id, val('mInd'), v))) planGoalSheet(id);
      break;
    }
    case 'status': {
      const r = await planRun(u => u.setGoalStatus(id, d, { rationale: val('gWhy').trim() }));
      if (r) { closeSheet(); toast(`"${r.goal.title}" is now ${r.goal.status}.`); }
      break;
    }
    case 'sched': planSchedSheet(); break;
    case 'schedSave': await planSchedSave(false); break;
    case 'schedAck': await planSchedSave(true); break;
    case 'log': await planRun(u => u.logSession(id, { status: d })); break;
    case 'why': {
      const w = PLAN.u.why(id);
      openSheet('Why is this here?', `<ul class="list">${w.story.map(s => `<li><div style="flex:1">${esc(s)}</div></li>`).join('')}</ul>`);
      break;
    }
    case 'decide': {
      const [action, key, v] = d.split('|');
      const edits = {};
      if (key === 'when') {
        const at = val('pi_' + id);
        if (!at) { toast('Pick a time first.'); break; }
        edits.start = pAt(at.slice(0, 10), at.slice(11, 16)); edits.end = edits.start + 36e5;
      } else if (key === 'reason') edits.reason = val('wr_' + id).trim();
      else if (key) edits[key] = v;
      await planRun(u => u.decide(id, action, { edits }));
      break;
    }
    case 'undo': {
      const r = await planRun(u => u.undo(id));
      if (r) toast(r.status === 'already_undone' ? 'Already undone.' : 'Undone.');
      break;
    }
    case 'belief': await planRun(u => u.correctBelief(id, { reject: d === 'reject' })); break;
    case 'import': planImportSheet(); break;
    case 'importGo': await planImportGo(); break;
    case 'reviewNew': {
      const r = await planRun(u => u.generateReview(d));
      if (r) planReviewSheet(r.id);
      break;
    }
    case 'review': planReviewSheet(id); break;
    case 'revItem': {
      const [item, dec] = d.split('|');
      if (await planRun(u => u.decideReviewItem(id, item, dec))) planReviewSheet(id);
      break;
    }
    case 'revAll': if (await planRun(u => u.approveReview(id))) closeSheet(); break;
    case 'export': download(`project1percent-plan-${today()}.json`, JSON.stringify(PLAN.u.export(), null, 2), 'application/json'); break;
    case 'erase':
      if (confirm('Erase your goals, sessions, reviews and their history from this device? This cannot be undone.') && confirm('Really erase the plan?')) {
        await PLAN.E.deleteAccount('me').catch(() => null); // the signed report needs HTTPS; the wipe does not
        localStorage.removeItem(PKEY);
        PLAN = planLoad();
        render();
        toast('Plan erased.');
      }
      break;
  }
}

// ---------- actions ----------
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const [act, argRaw] = el.dataset.act.split(':');
  const arg = argRaw == null ? '' : argRaw;
  // A companion tip carries the action it is advising — jumping there means the
  // sheet has to get out of the way first.
  if (el.classList.contains('tip')) closeSheet();
  const S2 = sheetSubmit;

  switch (act) {
    case 'tab': S.tab = arg; S.anim = true; render(); break;
    case 'growto': S.tab = 'grow'; S.growView = arg; S.anim = true; render(); break;
    case 'close': closeSheet(); break;
    case 'settings': settingsSheet(); break;
    case 'smart': smartSheet(); break;
    case 'fab': quickAdd(); break;
    case 'qaCapture': closeSheet(); setTimeout(captureSheet, 220); break;
    case 'coach': coachSheet(); break;

    case 'grow': S.growView = arg; S.anim = true; render(); break;
    case 'reviewview': S.reviewView = arg; S.anim = true; render(); break;
    case 'eng': await planAct(arg, el); break;

    case 'capture': captureSheet(); break;
    case 'saveCapture': {
      const text = val('cbText').trim();
      if (!text) { closeSheet(); break; }
      DB.inbox.push({ id: uid(), text, created: today() });
      save(); closeSheet(); render();
      toast('Caught. Sort it later.');
      break;
    }
    case 'inbox': closeSheet(); setTimeout(inboxSheet, 220); break;
    case 'inboxDel':
      DB.inbox = DB.inbox.filter(x => x.id !== arg);
      save(); if (S2 && S2.redraw) S2.redraw(); render(); break;
    case 'inboxTo': {
      const [kind, id] = arg.split('|');
      const item = DB.inbox.find(x => x.id === id);
      if (!item) break;
      DB.inbox = DB.inbox.filter(x => x.id !== id);
      save();
      closeSheet();
      // The captured text becomes the title, prefilled — triage should be one tap plus
      // whatever the real record needs, not retyping what you already wrote.
      setTimeout(() => {
        if (kind === 'task') { taskSheet(null, null); presetGoal('tkTitle', item.text); }
        else if (kind === 'card') { cardSheet(null, null); presetGoal('cFront', item.text); }
        else if (kind === 'goal') { goalSheet(null); presetGoal('gStat', item.text); }
        else { habitSheet(null); presetGoal('hName', item.text); }
      }, 220);
      break;
    }

    case 'plan': closeSheet(); setTimeout(() => planSheet(arg || today()), 220); break;
    case 'planOn': if (S2 && S2.tmp.order.length < 6) { S2.tmp.order.push(arg); S2.redraw(); } break;
    case 'planOff': if (S2) { S2.tmp.order = S2.tmp.order.filter(x => x !== arg); S2.redraw(); } break;
    case 'planUp': if (S2) {
      const i = S2.tmp.order.indexOf(arg);
      if (i > 0) S2.tmp.order.splice(i - 1, 0, S2.tmp.order.splice(i, 1)[0]);
      S2.redraw();
    } break;
    case 'savePlan': {
      DB.plans[arg] = { one: val('plOne').trim(), order: (S2 ? S2.tmp.order : []).slice() };
      save(); closeSheet(); render();
      toast('Tomorrow is decided.');
      break;
    }
    case 'weekone': weekOneSheet(); break;
    case 'saveWeekOne': {
      DB.plans[weekKey(today())] = { one: val('wkOne').trim(), order: [] };
      save(); closeSheet(); render(); break;
    }

    case 'mark': {
      const [hid, m] = arg.split('|');
      const h = habitById(hid);
      if (h) { const v = decodeURIComponent(m); h.mark = h.mark === v ? null : v; save(); render(); }
      break;
    }
    case 'saveQuarter': {
      const day = (DB.reviews[today()] = DB.reviews[today()] || { n: 0, again: 0 });
      day.quarter = { worked: val('qtWorked').trim(), stop: val('qtStop').trim(), next: val('qtNext').trim() };
      save(); render();
      toast('Saved. Now stop the thing you named.');
      break;
    }

    case 'cardLink': if (S2) {
      const v = val('cLink');
      if (v && !S2.tmp.links.includes(v)) S2.tmp.links.push(v);
      S2.redraw();
    } break;
    case 'cardUnlink': if (S2) { S2.tmp.links = S2.tmp.links.filter(x => x !== arg); S2.redraw(); } break;
    case 'cardImgOff': if (S2) { S2.tmp.image = null; S2.redraw(); } break;
    case 'goalnew': goalSheet(null); break;
    case 'goal': goalDetail(arg); break;
    case 'goaledit': closeSheet(); setTimeout(() => goalSheet(arg), 220); break;
    case 'saveGoal': if (S2) S2.save(); break;
    case 'delGoal':
      if (confirm('Delete this goal? The habits, cards and tasks under it stay — they just stop pointing anywhere.')) {
        DB.goals = DB.goals.filter(g => g.id !== arg); forget(arg);
        [].concat(DB.habits, DB.tasks, DB.cards).forEach(x => { if (x.goalId === arg) x.goalId = null; });
        save(); closeSheet(); render();
      }
      break;
    case 'goalplus': case 'goalminus': {
      const g = goalById(arg);
      if (g) { g.done = Math.max(0, (g.done || 0) + (act === 'goalplus' ? 1 : -1)); save(); }
      if (S2 && S2.redraw) S2.redraw();
      render();
      break;
    }
    case 'goalhabit': closeSheet(); setTimeout(() => { habitSheet(null); presetGoal('hGoal', arg); }, 220); break;
    case 'goalcard': closeSheet(); setTimeout(() => cardSheet(null, arg), 220); break;

    case 'cardnew': cardSheet(null, null); break;
    case 'cardedit': closeSheet(); setTimeout(() => cardSheet(arg), 220); break;
    case 'saveCard': if (S2) S2.save(); break;
    case 'delCard':
      if (confirm('Delete this card?')) {
        DB.cards = DB.cards.filter(c => c.id !== arg); forget(arg);
        save(); closeSheet(); render();
      }
      break;
    case 'resetCard': {
      const c = DB.cards.find(x => x.id === arg);
      if (c) { Object.assign(c, { box: 0, due: today(), lapses: 0 }); save(); closeSheet(); render(); toast('Back to the front of the queue.'); }
      break;
    }
    case 'study': studySheet(); break;
    case 'reveal': if (S.study) {
      S.study.shown = true;
      if (arg !== '') S.study.sure = arg === '1';
      if (S2 && S2.redraw) S2.redraw();
    } break;
    case 'grade': gradeCard(arg); break;

    case 'practice': practiceSheet(); break;
    case 'psStart': {
      const focus = val('pFocus').trim();
      if (!focus) { alert('Name the one thing you are working on. That is the whole point.'); break; }
      S.session = { goalId: val('pGoal') || null, focus, ended: false };
      S.timer = Date.now();
      if (S2 && S2.redraw) S2.redraw();
      break;
    }
    case 'psStop': {
      if (!S.session) break;
      S.session.minutes = Math.max(1, Math.round((Date.now() - S.timer) / 60000));
      S.session.ended = true;
      S.timer = null;
      clearInterval(S.clockId);
      if (S2 && S2.redraw) S2.redraw();
      break;
    }
    case 'psDiff': if (S.session) { S.session.difficulty = Number(arg); if (S2 && S2.redraw) S2.redraw(); } break;
    case 'psSave': {
      const s = S.session;
      if (!s) break;
      DB.sessions.push({ id: uid(), goalId: s.goalId, date: today(),
        minutes: Math.max(1, num('pMin') || s.minutes), focus: s.focus,
        difficulty: s.difficulty || 0, went: val('pWent').trim(), next: val('pNext').trim(),
        deep: !!(document.getElementById('pDeep') || {}).checked });
      S.session = null;
      save(); closeSheet(); render();
      toast('Session logged.');
      break;
    }
    case 'sessedit': {
      const s = DB.sessions.find(x => x.id === arg);
      if (s && confirm(`Delete the session "${s.focus || 'unnamed'}"?`)) {
        DB.sessions = DB.sessions.filter(x => x.id !== arg);
        save(); render();
      }
      break;
    }
    case 'weekly': S.tab = 'grow'; S.growView = 'review'; S.anim = true; render(); break;
    case 'saveReview': {
      const day = (DB.reviews[today()] = DB.reviews[today()] || { n: 0, again: 0 });
      day.review = { worked: val('rvWorked').trim(), broke: val('rvBroke').trim(), change: val('rvChange').trim() };
      DB.prefs.lastReview = today();
      save(); render();
      toast('Saved. Now change the one thing.');
      break;
    }

    case 'gridweeks': S.gridWeeks = Number(arg); S.anim = true; render(); break;
    case 'range': S.range = Number(arg); S.anim = true; render(); break;
    case 'calview': S.calView = arg; S.anim = true; render(); break;
    case 'grid': {
      // Cells are bare <i>; their date is their position on the board.
      const cell = ev.target.closest('i');
      if (!cell || cell.parentElement !== el) break;
      habitDaySheet(arg, R.addDays(gridStart(), [].indexOf.call(el.children, cell)));
      break;
    }
    case 'share': shareGrid(arg); break;
    case 'hmove': {
      const [id, dir] = arg.split('|');
      const i = DB.habits.findIndex(h => h.id === id), j = i + Number(dir);
      if (i >= 0 && j >= 0 && j < DB.habits.length) {
        DB.habits.splice(j, 0, DB.habits.splice(i, 1)[0]);
        save(); if (S2 && S2.redraw) S2.redraw(); render();
      }
      break;
    }
    case 'accent':
      DB.prefs.accent = decodeURIComponent(arg);
      applyAccent(); save(); if (S2 && S2.redraw) S2.redraw(); render(); break;

    case 'qaHabit': habitSheet(null, arg.split('|')[1]); break;
    case 'qaMoney': txnSheet(null, arg || today()); break;
    case 'qaTask': {
      const [d, hr] = arg.split('|');
      taskSheet(null, d || today(), hr);
      break;
    }
    case 'addOn': quickAdd(arg); break;
    case 'addAt': {
      const [d, hr] = arg.split('|');
      quickAdd(d, hr);
      break;
    }
    case 'dayshift': S.calAnchor = R.addDays(S.calAnchor, Number(arg)); S.anim = true; render(); break;

    case 'hquick': {
      const h = habitById(arg);
      if (!h) break;
      const d = today(), g = R.goalOf(h);
      const was = habitDone(h, d);
      if (h.kind === 'checkbox') setLog(h.id, d, { v: logValue(h.id, d) >= g ? 0 : g });
      else if (h.kind === 'counter') setLog(h.id, d, { v: logValue(h.id, d) + 1 });
      else { habitDaySheet(h.id, d); break; }
      if (!was && habitDone(h, d)) burst(h.color);
      S.pop = h.id;
      S.keepScroll = $('#main').scrollTop; render();
      break;
    }
    case 'hopen': habitDaySheet(arg, today()); break;
    case 'hopenday': { const [hid, d] = arg.split('|'); habitDaySheet(hid, d); break; }
    case 'hedit': habitSheet(arg); break;
    case 'hnew': habitSheet(null); break;
    case 'hArchive': {
      const h = habitById(arg); if (h) { h.archived = !h.archived; save(); }
      if (S2 && S2.redraw) S2.redraw();
      render(); break;
    }
    case 'delHabit':
      if (confirm('Delete this habit and all of its history?')) {
        DB.habits = DB.habits.filter(h => h.id !== arg); forget(arg);
        Object.keys(DB.logs).forEach(k => { if (k.startsWith(arg + '|')) delete DB.logs[k]; });
        DB.txns.forEach(t => { if (t.habitId === arg) t.habitId = null; });
        DB.tasks.forEach(t => { if (t.habitId === arg) t.habitId = null; });
        save(); closeSheet(); render();
      }
      break;

    case 'pickIcon': if (S2) { S2.tmp.icon = arg; S2.redraw(); } break;
    case 'pickColor': if (S2) { S2.tmp.color = decodeURIComponent(arg); S2.redraw(); } break;
    case 'pickDow': if (S2) {
      const n = Number(arg), i = S2.tmp.weekdays.indexOf(n);
      if (i >= 0) S2.tmp.weekdays.splice(i, 1); else S2.tmp.weekdays.push(n);
      S2.redraw();
    } break;
    case 'addStep': if (S2) {
      const v = val('hStep').trim();
      if (v) { S2.tmp.checklist.push(v); S2.redraw(); }
    } break;
    case 'delStep': if (S2) { S2.tmp.checklist.splice(Number(arg), 1); S2.redraw(); } break;
    case 'saveHabit': if (S2) S2.save(); break;

    case 'hToggle': if (S2) {
      const g = R.goalOf(S2.habit);
      setLog(S2.habit.id, S2.day, { v: logValue(S2.habit.id, S2.day) >= g ? 0 : g });
      S2.redraw(); render();
    } break;
    case 'hBump': if (S2) {
      const v = Math.max(0, logValue(S2.habit.id, S2.day) + Number(arg));
      setLog(S2.habit.id, S2.day, { v }); S2.redraw(); render();
    } break;
    case 'hStepTog': if (S2) {
      const item = decodeURIComponent(arg);
      const log = logOf(S2.habit.id, S2.day) || { v: 0, c: [], n: '' };
      const c = (log.c || []).slice();
      const i = c.indexOf(item);
      if (i >= 0) c.splice(i, 1); else c.push(item);
      setLog(S2.habit.id, S2.day, { c, v: c.length });
      S2.redraw(); render();
    } break;
    case 'startTimer': S.timer = Date.now(); if (S2) S2.redraw(); break;
    case 'stopTimer': if (S2) {
      const mins = Math.max(1, Math.round((Date.now() - S.timer) / 60000));
      S.timer = null; clearInterval(S.clockId);
      setLog(S2.habit.id, S2.day, { v: logValue(S2.habit.id, S2.day) + mins });
      S2.redraw(); render(); toast(mins + ' min logged.');
    } break;
    case 'saveNote': {
      const [hid, d] = arg.split('|');
      setLog(hid, d, { n: val('hNote') });
      closeSheet(); render(); break;
    }

    case 'txType': if (S2) { S2.state.exp = arg === '1'; S2.redraw(); } break;
    case 'saveTxn': if (S2) S2.save(); break;
    case 'txedit': txnSheet(arg); break;
    case 'delTxn':
      DB.txns = DB.txns.filter(t => t.id !== arg);
      save(); closeSheet(); render(); break;

    case 'taskdone': completeTask(arg); if (S2 && S2.redraw) S2.redraw(); break;
    case 'taskedit': taskSheet(arg); break;
    case 'tbrief': taskBrief(arg); break;
    case 'hbrief': habitBrief(arg); break;
    case 'taskfilter': S.taskFilter = arg; render(); break;
    case 'taskview': S.taskView = arg; S.anim = true; render(); break;
    case 'apps': S.tab = 'task'; S.taskView = 'apps'; S.anim = true; render(); break;
    case 'appfilter': S.appFilter = arg; render(); break;
    case 'qok': approveItem(arg); render(); break;
    case 'qno': rejectItem(arg); render(); break;
    case 'qall': queuePending().forEach(q => approveItem(q.id)); render(); toast('Approved.'); break;
    case 'gconnect': googleConnect(); break;
    case 'gsync': await driveSync(); await syncGoogle(true); if (S2 && S2.redraw) S2.redraw(); break;
    case 'dlKept': download(`project1percent-replaced-${today()}.json`, localStorage.getItem(KEPT) || '{}', 'application/json'); break;
    case 'gdisconnect':
      try { const t = gToken(); if (t) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(t), { method: 'POST' }).catch(() => {}); localStorage.removeItem(GKEY); } catch (e) {}
      DB.gsync.connected = false; save(); closeSheet(); render(); toast('Disconnected from Google.'); break;
    case 'gremove':
      if (confirm('Delete every event this app put on your Google Calendar? Your own events are not touched.')) {
        try { await gRemoveAll(); toast('Plan events removed from Google Calendar.'); } catch (e) { toast(e.message); }
        closeSheet(); render();
      }
      break;
    case 'tradenew': closeSheet(); setTimeout(() => tradeSheet(null), 220); break;
    case 'tradeedit': tradeSheet(arg); break;
    case 'saveTrade': if (S2) S2.save(); break;
    case 'delTrade':
      if (confirm('Delete this trade?')) { DB.trades = DB.trades.filter(t => t.id !== arg); save(); closeSheet(); render(); }
      break;
    case 'appnew': closeSheet(); setTimeout(() => appSheet(null, arg), 220); break;
    case 'appedit': appSheet(arg); break;
    case 'saveApp': if (S2) S2.save(); break;
    case 'delApp':
      if (confirm('Delete this application?')) { DB.apps = DB.apps.filter(a => a.id !== arg); forget(arg); save(); closeSheet(); render(); }
      break;
    case 'appKind': if (S2) {
      // A fresh application swaps to the other kind's checklist; one you've edited keeps yours.
      if (!S2.tmp.touched) S2.tmp.docs = APP_DOCS[arg].map(title => ({ id: uid(), title, done: false }));
      S2.tmp.kind = arg; S2.redraw();
    } break;
    case 'appDocTog': if (S2) { const d = S2.tmp.docs[Number(arg)]; d.done = !d.done; S2.tmp.touched = true; S2.redraw(); } break;
    case 'appDocDel': if (S2) { S2.tmp.docs.splice(Number(arg), 1); S2.tmp.touched = true; S2.redraw(); } break;
    case 'addAppDoc': if (S2) {
      const v = val('apDoc').trim();
      if (v) { S2.tmp.docs.push({ id: uid(), title: v, done: false }); S2.tmp.touched = true; S2.redraw(); }
    } break;
    case 'saveTask': if (S2) S2.save(); break;
    case 'delTask':
      if (confirm('Delete this task?')) {
        DB.tasks = DB.tasks.filter(t => t.id !== arg); forget(arg);
        save(); closeSheet(); render();
      } break;
    case 'addSub': if (S2) {
      const v = val('tkSub').trim();
      if (v) { S2.tmp.subs.push({ id: uid(), title: v, done: false }); S2.redraw(); }
    } break;
    case 'subTog': if (S2) { const s = S2.tmp.subs[Number(arg)]; s.done = !s.done; S2.redraw(); } break;
    case 'subDel': if (S2) { S2.tmp.subs.splice(Number(arg), 1); S2.redraw(); } break;

    case 'calmode': S.calMode = arg; render(); break;
    case 'calshift': {
      const d = R.fromYMD(S.calAnchor);
      d.setDate(1); d.setMonth(d.getMonth() + Number(arg));
      S.calAnchor = R.ymd(d); render(); break;
    }
    case 'caltoday': S.calAnchor = today(); render(); break;
    case 'calday': daySheet(arg); break;

    case 'finshift': {
      const d = R.fromYMD(S.finMonth + '-01');
      d.setMonth(d.getMonth() + Number(arg));
      S.finMonth = R.monthKey(R.ymd(d)); render(); break;
    }
    case 'accounts': accountsSheet(); break;
    case 'addAcc': {
      const name = val('acName').trim();
      if (!name) { alert('Name the account.'); break; }
      DB.accounts.push({ id: uid(), name, kind: val('acKind'), opening: num('acOpen') });
      save(); if (S2) S2.redraw(); render(); break;
    }
    case 'delAcc':
      if (confirm('Delete this account and its entries?')) {
        DB.accounts = DB.accounts.filter(a => a.id !== arg);
        DB.txns = DB.txns.filter(t => t.accountId !== arg);
        save(); if (S2) S2.redraw(); render();
      }
      break;
    case 'budgets': budgetsSheet(); break;
    case 'saveBudgets': {
      document.querySelectorAll('[data-budget]').forEach(inp => {
        const v = parseFloat(inp.value);
        if (v > 0) DB.budgets[inp.dataset.budget] = v;
        else delete DB.budgets[inp.dataset.budget];
      });
      save(); closeSheet(); render(); break;
    }

    case 'parseText': if (S2) S2.parse(); break;
    case 'sugAdd': if (S2) S2.accept(Number(arg)); render(); break;
    case 'sugDrop': if (S2) S2.drop(Number(arg)); break;
    case 'sugAddAll': if (S2) {
      while (S2.list.length) S2.accept(0);
      render(); toast('Added.');
    } break;

    case 'obGoal': if (S2) {
      if (S2.st.goals.has(arg)) S2.st.goals.delete(arg); else S2.st.goals.add(arg);
      S2.st.picked.clear(); S2.redraw();
    } break;
    case 'obPick': if (S2) {
      const n = decodeURIComponent(arg);
      if (S2.st.picked.has(n)) S2.st.picked.delete(n); else S2.st.picked.add(n);
      S2.redraw();
    } break;
    case 'obNext': if (S2) {
      if (S2.st.step === 3) S2.finish();
      else if (S2.st.step === 1 && !S2.st.goals.size) alert('Pick at least one.');
      else { S2.st.step++; S2.redraw(); }
    } break;
    case 'obSkip': DB.prefs.onboarded = true; save(); closeSheet(); render(); break;

    case 'togDayFirst': DB.prefs.dayFirst = !DB.prefs.dayFirst; save(); if (S2) S2.redraw(); break;
    case 'saveGeneral':
      DB.prefs.cur = (val('setCur') || 'USD').toUpperCase().slice(0, 3);
      save(); if (S2) S2.redraw(); render(); toast('Saved.'); break;
    case 'togLock':
      if (DB.prefs.lockId) { DB.prefs.lockId = null; save(); }
      else await enableLock();
      if (S2) S2.redraw();
      break;
    case 'doUnlock':
      if (await unlock()) { $('#tabs').style.display = ''; $('#fab').style.display = ''; render(); }
      break;
    case 'exportJson': download(`project1percent-${today()}.json`, JSON.stringify(DB, null, 2), 'application/json'); break;
    case 'exportCsv': download(`project1percent-${today()}.csv`, toCSV(), 'text/csv'); break;
    case 'loadPlan': await loadBundledPlan(true); runAdapt(); render(); break;
    case 'memUndo': undoMemory(arg); render(); toast('Undone. The plan will leave that one alone.'); break;
    case 'forceUpdate':
      // Drops the offline cache and reloads, so a fixed build actually lands.
      if ('caches' in window) await caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k))));
      if (navigator.serviceWorker) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      location.reload();
      break;
    case 'wipe':
      if (confirm('Erase every habit, entry and task on this device? This cannot be undone.')
        && confirm('Really erase everything?')) {
        localStorage.removeItem(KEY);
        localStorage.removeItem(SKEY); // this device only: on the next sync it takes the Drive copy, never erases it
        location.reload();
      }
      break;
  }
});

// Dismiss only when the dark backdrop itself is tapped — never a child of it.
$('#sheet').addEventListener('click', ev => { if (ev.target.id === 'sheet') closeSheet(); });

// ---------- boot ----------
async function boot() {
  try { await start(); } catch (e) { showCrash('Startup failed', e); }
}

async function start() {
  applyAccent();
  await planBoot().catch(e => showCrash('Plan', e)); // the rest of the app works without it
  await loadBundledPlan(false).catch(e => showCrash('Plan file', e));
  runAdapt();
  const deep = /^#tab=(\w+)/.exec(location.hash || ''); // a bookmarkable tab: …/#tab=habits
  if (deep && TITLES[deep[1]]) S.tab = deep[1];
  const deepBrief = /brief=(goal|habit|task):([\w-]+)/.exec(location.hash || ''); // …/#brief=goal:p1g-cfa
  const signedIn = googleReturn();
  driveSync(); // in the background; takes the cloud copy (and reloads) if another device changed it
  if (gToken() && (signedIn || !DB.gsync.lastSync || Date.now() - DB.gsync.lastSync > 15 * 60000))
    syncGoogle(signedIn).catch(() => {}); // in the background: the app opens without waiting on Google
  if (DB.prefs.lockId) {
    lockScreen();
    if (await unlock()) { $('#tabs').style.display = ''; $('#fab').style.display = ''; render(); }
    return;
  }
  render();
  if (!DB.prefs.onboarded) onboarding();
  else if (deepBrief) ({ goal: goalDetail, habit: habitBrief, task: taskBrief })[deepBrief[1]](deepBrief[2]);
}
boot();

if ('serviceWorker' in navigator) {
  // Every deploy changes sw.js, so checking it each time the app comes back to the front
  // finds the update; the new worker takes over and the page reloads onto the new code.
  // Never mid-sheet: that would throw away what you were typing, or a running timer.
  const hadSW = !!navigator.serviceWorker.controller; // the first install isn't an update
  let pending = false;
  const reloadIfSafe = () => { if (pending && !$('#sheet').classList.contains('open')) location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => { pending = hadSW; reloadIfSafe(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      reloadIfSafe();
      reg.update().catch(() => {});
    });
  }).catch(() => {});
}
</script>
</body>
</html>
