<!-- No data-act on #sheet: it would swallow every tap inside the sheet (labels,
     inputs, blank space) and close the form mid-edit. The backdrop-only listener
     at the bottom of the script handles dismissal. -->
<div id="sheet"><div id="sheetBody"></div></div>
<div id="crash" hidden></div>

<script src="rules.js"></script>
<script src="core/signals.js"></script>
<script src="core/calendar.js"></script>
<script src="core/engine.js"></script>
<script>
'use strict';
/* Project 1% — offline habit / money / task tracker.
   One file, no framework, no dependencies. Rules live in rules.js so they can be
   tested in Node (see test.js). */

const BUILD = '2026-11-19.4';

// A thrown error used to mean a blank white screen and no way to report it.
// Put the message on the glass instead.
function showCrash(what, err) {
  const box = document.getElementById('crash');
  if (!box) return;
  box.hidden = false;
  box.textContent = `${what}: ${(err && (err.stack || err.message)) || err}\n\nbuild ${BUILD}`;
}
window.addEventListener('error', e => showCrash('Error', e.error || e.message));
window.addEventListener('unhandledrejection', e => showCrash('Error', e.reason));
if (typeof todayKey !== 'function') {
  showCrash('Setup', 'rules.js did not load — upload it next to index.html');
}

// ---------- storage ----------
const KEY = 'p1p.v1';
// New top-level keys are free: DB is merged over BLANK on load, so a save written by
// an older build picks them up empty rather than needing a migration.
const BLANK = { habits: [], logs: {}, accounts: [], txns: [], budgets: {}, tasks: [],
                goals: [], cards: [], sessions: [], reviews: {}, inbox: [], plans: {}, apps: [], memory: [], trades: [], queue: [], routine: [],
                gsync: { map: {}, seen: [], lastSync: null, mailAt: null, pushOK: false, err: null },
                prefs: { onboarded: false, cur: 'USD', dayFirst: false, lockId: null,
                         lastReview: null, birthday: null } };

let DB;
try { DB = Object.assign({}, BLANK, JSON.parse(localStorage.getItem(KEY) || '{}')); }
catch (e) { DB = JSON.parse(JSON.stringify(BLANK)); }
DB.prefs = Object.assign({}, BLANK.prefs, DB.prefs);
tidyHabits();

/** Small habits that cluttered the day are retired (logs kept), and every plan habit has a time.
    Runs on every load, so a copy adopted from Drive (which reloads) gets the same treatment. */
function tidyHabits() {
  const RETIRED = ['p1h-weigh', 'p1h-creatine'], NAMES = /^(drink water|move 30 minutes)$/i;
  const TIMES = { 'p1h-protein': '12:00', 'p1h-dog': '13:15' };
  // The plan's habits, reworded. Only text you haven't changed yourself is replaced.
  const WORDING = {
    'p1h-lift': {"name": ["Lift: full body (A/B alternating)", "Strength training: full body (A/B)"], "cue": ["After I wake up and drink water", "After waking and hydrating"]},
    'p1h-protein': {"name": ["Protein feedings (35–40 g each, ~150 g/day)", "Protein: four 35–40 g servings (~150 g/day)"], "cue": ["Every meal or shake", "At each meal or shake"], "min": ["3 feedings, one of them the mass shake", "Three servings, including the mass shake"]},
    'p1h-sleep': {"name": ["Lights out by 23:00", "Sleep: lights out by 23:00"], "cue": ["At 22:00: screens off, phone on the charger outside the bedroom", "22:00: screens off, phone charging outside the bedroom"], "min": ["Screens off 30 minutes before bed, 7 hours asleep", "Screens off 30 minutes before bed; 7 hours of sleep"]},
    'p1h-study': {"name": ["Study block (CFA L1)", "CFA Level I study block"], "cue": ["After the networking block", "Immediately after the networking block"]},
    'p1h-deep': {"name": ["Weekend deep block (CFA + research report)", "Weekend deep work: CFA and research report"], "min": ["Open the model and change one number", "Open the model and make one revision"]},
    'p1h-cards': {"name": ["Review my cards", "Spaced-repetition card review"], "cue": ["In the planning block, the last study of the day", "During the planning block, as the day's last study task"], "min": ["5 cards", "Review 5 cards"]},
    'p1h-markets': {"name": ["Markets + defense read", "Market and defense-sector briefing"], "cue": ["At the open", "At the market open"], "min": ["One headline and one A&D item, plus a single sentence on why it matters", "One market headline and one A&D item, each with a one-sentence takeaway"]},
    'p1h-outreach': {"name": ["Networking outreach", "Networking outreach: two messages"], "cue": ["Right after the markets read", "Immediately after the market briefing"], "min": ["One connection request with a note", "One connection request with a personalized note"]},
    'p1h-premarket': {"name": ["Pre-market plan: positions, watchlist, orders in", "Pre-market plan: positions, watchlist and orders"], "cue": ["In the 09:15 Claude session, before the open", "During the 09:15 Claude session, before the open"], "min": ["Check every open position's stop", "Confirm a stop on every open position"]},
    'p1h-tjournal': {"name": ["Trade journal", "Daily trade journal"], "cue": ["When I sit down after dinner", "After dinner"], "min": ["Check every open position has a stop", "Confirm a stop on every open position"]},
    'p1h-tweekly': {"cue": ["Sunday, after the deep block and the afternoon off", "Sunday, after the deep-work block"], "min": ["Read the week's stats", "Review the week's statistics"]},
    'p1h-cardio': {"name": ["Walk or easy cardio (Tue / Thu)", "Low-intensity cardio (Tue/Thu)"], "cue": ["After I wake up and drink water", "After waking and hydrating"]},
    'p1h-research': {"name": ["Research: report work", "Equity research: report drafting"], "cue": ["When Claude session 2 opens (window 2)", "At the start of Claude session 2"]},
    'p1h-career': {"name": ["Applications and career", "Applications and career development"], "cue": ["After email batch 2", "After the second email batch"], "min": ["One concrete action: an application, a call or one interview question", "One concrete step: an application, a call or one interview question"]},
    'p1h-teach': {"name": ["CFA teach-back, closed book", "CFA closed-book teach-back"], "cue": ["When Claude session 3 opens (window 3)", "At the start of Claude session 3"], "min": ["Write the main ideas from memory (5 minutes)", "Five minutes writing the key ideas from memory"]},
    'p1h-plan': {"name": ["Plan tomorrow", "Next-day planning"], "min": ["Tomorrow's top 3", "Set tomorrow's top three priorities"]},
    'p1h-dog': {"name": ["Hero Time with the dog", "Hero Time: dog walks and play"], "cue": ["13:15, 19:15, and the 22:00 evening walk", "13:15, 19:15 and the 22:00 evening walk"], "min": ["The walks the dog needs", "The essential walks"]},
  };
  DB.prefs.gone = [...new Set((DB.prefs.gone || []).concat(RETIRED))];
  (DB.habits || []).forEach(h => {
    if (RETIRED.includes(h.id) || NAMES.test(h.name || '')) h.archived = true;
    if (h.stackAfter && RETIRED.includes(h.stackAfter)) h.stackAfter = null;
    if (!h.at && TIMES[h.id]) h.at = TIMES[h.id];
    Object.entries(WORDING[h.id] || {}).forEach(([f, [was, now]]) => { if (h[f] === was) h[f] = now; });
  });
}

let saveTimer = null;
function writeNow() {
  clearTimeout(saveTimer); saveTimer = null;
  dropIndex();
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { alert('Storage is full — export a backup from Settings and remove some history.'); return; }
  changed();
}
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(writeNow, 120); }
/** Writes a save that is still waiting on its timer. */
function flushSave() { if (saveTimer) writeNow(); }
// iOS freezes and then kills a home-screen app in the background without warning, so a
// save still on its 120ms timer was lost. Write it the moment the app leaves the screen.
addEventListener('pagehide', flushSave);
// Back on screen: pick up what another device changed. Leaving: try to upload now.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
  if (document.visibilityState === 'visible' || syncState().dirty) driveSync();
});
// ponytail: one JSON blob in localStorage. Good to ~5MB, which is years of daily
// logs. Move to IndexedDB if that ever bites.

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** One <use> of a symbol from the sprite at the top of the body. Always aria-hidden:
    every icon in this app sits next to its own label, so a screen reader that announced
    it would read everything twice. Size comes from font-size on the parent. */
const ic = (name, cls) =>
  `<svg class="i${cls ? ' ' + cls : ''}" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`;

function money(n) {
  try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: DB.prefs.cur }).format(n || 0); }
  catch (e) { return (DB.prefs.cur || '') + ' ' + (n || 0).toFixed(2); }
}
const money0 = n => money(n).replace(/[.,]\d{2}$/, '');

const lk = (hid, day) => hid + '|' + day;
const logOf = (hid, day) => DB.logs[lk(hid, day)] || null;
const logValue = (hid, day) => (DB.logs[lk(hid, day)] || {}).v || 0;
function setLog(hid, day, patch) {
  const cur = DB.logs[lk(hid, day)] || { v: 0, c: [], n: '' };
  DB.logs[lk(hid, day)] = Object.assign(cur, patch);
  save();
}
const habitById = id => DB.habits.find(h => h.id === id);
const liveHabits = () => DB.habits.filter(h => !h.archived);
const dayTxns = day => idx().tx[day] || [];
const monthTxns = mk => DB.txns.filter(t => R.monthKey(t.date) === mk);

// ---------- charts (hand-rolled SVG; three charts don't justify a library) ----------
function donut(slices, size) {
  size = size || 200;
  const total = slices.reduce((s, x) => s + x.amount, 0);
  if (!total) return '';
  const r = size / 2, ir = r * 0.62, cx = r, cy = r;
  if (slices.length === 1) {
    return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-height:200px"><circle cx="${cx}" cy="${cy}"
      r="${(r + ir) / 2}" fill="none" stroke="${PALETTE[0]}" stroke-width="${r - ir}"/></svg>`;
  }
  let a = -Math.PI / 2, out = '';
  slices.forEach((s, i) => {
    const ang = (s.amount / total) * Math.PI * 2, b = a + ang, big = ang > Math.PI ? 1 : 0;
    const p = (rad, ang2) => [cx + rad * Math.cos(ang2), cy + rad * Math.sin(ang2)];
    const [x1, y1] = p(r, a), [x2, y2] = p(r, b), [x3, y3] = p(ir, b), [x4, y4] = p(ir, a);
    out += `<path d="M${x1} ${y1} A${r} ${r} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${ir} ${ir} 0 ${big} 0 ${x4} ${y4} Z"
             fill="${PALETTE[i % PALETTE.length]}"/>`;
    a = b;
  });
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-height:200px">${out}</svg>`;
}

function plot(series, labels, opts) {
  opts = opts || {};
  const w = 320, h = opts.height || 130, pad = 22, bottom = 18;
  const all = series.flatMap(s => s.points);
  const max = Math.max(1, ...all), min = Math.min(0, ...all);
  const span = (max - min) || 1;
  const n = labels.length;
  const x = i => pad + (n === 1 ? (w - pad * 2) / 2 : (i * (w - pad * 2)) / (n - 1));
  const y = v => h - bottom - ((v - min) / span) * (h - bottom - 6);
  let out = `<line x1="${pad}" y1="${y(min)}" x2="${w - pad}" y2="${y(min)}" stroke="var(--line)"/>`;
  for (const s of series) {
    const pts = s.points.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    if (opts.area) {
      out += `<polygon points="${x(0)},${y(min)} ${pts} ${x(n - 1)},${y(min)}" fill="${s.color}" opacity=".18"/>`;
    }
    out += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
    out += s.points.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${s.color}"/>`).join('');
  }
  out += labels.map((l, i) =>
    `<text x="${x(i)}" y="${h - 4}" font-size="10" fill="var(--dim)" text-anchor="middle">${esc(l)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${out}</svg>`;
}

/** A progress ring that draws itself. The final value is inline, so if the keyframe
    never runs (reduced motion, ancient Safari) the ring is still correct. */
function ring(pct, size, color) {
  const r = (size - 11) / 2, c = 2 * Math.PI * r, mid = size / 2;
  const to = c * (1 - Math.min(Math.max(pct, 0), 100) / 100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="9"/>
    <circle cx="${mid}" cy="${mid}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${to.toFixed(1)}"
      style="--from:${c.toFixed(1)}" transform="rotate(-90 ${mid} ${mid})"/></svg>`;
}

function countUp(el, to) {
  if (!el || !isFinite(to)) return;
  if (reduced() || !window.requestAnimationFrame) { el.textContent = to + '%'; return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 800);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + '%';
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/** One expanding ring when a habit crosses the line. Removes itself. */

  const el = document.createElement('div');

// ---------- per-paint indexes ----------
// Scanning every transaction once per calendar cell is 365 x txns on the year grid.
// Build the lookups once a paint instead; save() drops them when anything changes.
let IDX = null;
function dropIndex() { IDX = null; }
function idx() {
  if (IDX) return IDX;
  const tx = {}, tk = {}, spendDay = {}, mtd = {};
  DB.txns.forEach(t => {
    (tx[t.date] = tx[t.date] || []).push(t);
    if (t.amount < 0) spendDay[t.date] = (spendDay[t.date] || 0) - t.amount;
  });
  DB.tasks.forEach(t => { if (t.due) (tk[t.due] = tk[t.due] || []).push(t); });
  // Month-to-date spend, memoised back to the 1st — at most 31 steps deep.
  const spentTo = day => {
    if (day in mtd) return mtd[day];
    const prev = R.addDays(day, -1);
    const carry = R.monthKey(prev) === R.monthKey(day) ? spentTo(prev) : 0;
    return (mtd[day] = carry + (spendDay[day] || 0));
  };
  return (IDX = { tx, tk, spendDay, spentTo });
}
function indexCtx() {

/** Line and area path data for values laid out across a w x h box. */
function sparkPath(values, w, h, pad) {
  const max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  const flat = max === min, span = (max - min) || 1, n = values.length;
  const x = i => (n === 1 ? w / 2 : (i * w) / (n - 1));
  // A flat run centres rather than sitting on the floor: unchanging is not zero.
  const y = v => (flat ? h / 2 : pad + (1 - (v - min) / span) * (h - pad * 2));
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  return { x, y, pts, line: 'M' + pts.join(' L'),
           area: `M${x(0).toFixed(1)},${h} L${pts.join(' L')} L${x(n - 1).toFixed(1)},${h} Z` };
}

function spark(values, color, w, h) {
  w = w || 60; h = h || 26;
  if (values.length < 2) return `<span style="width:${w}px;flex:0 0 ${w}px"></span>`;
  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <path d="${sparkPath(values, w, h, 3).line}" fill="none" stroke="${color}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function heroChart(series, color) {
  const w = 340, h = 108;

      data-vals="${vals.join(',')}" data-keys="${series.map(s => s.key).join(',')}"
      data-pts="${p.pts.join(' ')}">
    <defs><linearGradient id="hgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".26"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${p.area}" fill="url(#hgrad)"/>
    <path class="heroLine" d="${p.line}" fill="none" stroke="${color}" stroke-width="2.2"
      stroke-linejoin="round" stroke-linecap="round" pathLength="1" vector-effect="non-scaling-stroke"/>
    <line id="heroCross" y1="0" y2="${h}" stroke="var(--fg)" stroke-width="1" opacity="0"/>
    <circle id="heroDot" r="4.5" fill="${color}" stroke="var(--card)" stroke-width="2.5" opacity="0"/>
  </svg>`;
}

// Drag across the chart and the headline follows your finger. Direct DOM writes, no
// re-render: repainting the view on every pointermove drops frames immediately.
function wireScrub() {
  const svg = document.getElementById('heroChart');
  const val = document.getElementById('heroVal');
  const sub = document.getElementById('heroSub');
  if (!svg || !val || !sub || !svg.getBoundingClientRect) return;
  const vals = String(svg.dataset.vals || '').split(',').filter(Boolean).map(Number);
  const keys = String(svg.dataset.keys || '').split(',').filter(Boolean);
  const pts = String(svg.dataset.pts || '').split(' ').filter(Boolean);
  const cross = document.getElementById('heroCross');
  const dot = document.getElementById('heroDot');
  if (vals.length < 2 || !cross || !dot) return;

  const rest = { val: val.textContent, sub: sub.innerHTML, col: sub.style.color };
  const show = clientX => {
    const r = svg.getBoundingClientRect();
    if (!r.width) return;
    const i = Math.max(0, Math.min(vals.length - 1,
      Math.round(((clientX - r.left) / r.width) * (vals.length - 1))));
    const xy = pts[i].split(',');
    cross.setAttribute('x1', xy[0]); cross.setAttribute('x2', xy[0]);
    dot.setAttribute('cx', xy[0]); dot.setAttribute('cy', xy[1]);
    cross.style.opacity = '.35'; dot.style.opacity = '1';
    val.textContent = vals[i] + '%';
    sub.style.color = 'var(--dim)';
    sub.textContent = R.fromYMD(keys[i]).toLocaleDateString(undefined,
      { weekday: 'short', day: 'numeric', month: 'short' });
  };
  const off = () => {
    cross.style.opacity = '0'; dot.style.opacity = '0';
    val.textContent = rest.val; sub.innerHTML = rest.sub; sub.style.color = rest.col;
  };
  svg.addEventListener('pointerdown', e => show(e.clientX));
  svg.addEventListener('pointermove', e => show(e.clientX));
  svg.addEventListener('pointerup', off);
  svg.addEventListener('pointerleave', off);
  svg.addEventListener('pointercancel', off);
}

const areaColor = a => AREA_COLORS[a] || 'var(--tint)';

const clockText = n => n.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

/** Planned sessions from Grow → Plan live in the engine's own calendar, not DB. */
function planSessions(day) {
  if (!PLAN) PLAN = planLoad();
  if (PLAN.error) return [];
  const t0 = R.fromYMD(day).getTime(), t1 = R.fromYMD(R.addDays(day, 1)).getTime();
  return PLAN.u.list('session', s => s.status === 'planned' && s.start >= t0 && s.start < t1).map(s => ({
    at: new Date(s.start).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: PLAN.u.tz }),
    len: s.minutes, act: 'growto:plan', icon: '📅', name: s.title, color: 'var(--purple)', done: false, meta: `${s.minutes} min`,
  }));
}

/** Today, placed on the clock, with what's overdue alongside. */
function briefData(day) {
  const d = day || today();
  const late = d !== today() ? [] : DB.tasks.filter(isOverdue).map(t => ({
    at: null, act: `tbrief:${t.id}`, tick: `taskdone:${t.id}`, icon: '☑️', name: t.title,
    color: 'var(--red)', done: false, meta: t.deadline && t.deadline < today() ? 'deadline ' + fmtDue(t.deadline) : fmtDue(t.due), late: true,
  }));
  return { late, sched: R.daySchedule(daySlots(d).concat(planSessions(d))) };
}

const tickOf = s => s.tick || (s.quick ? `hquick:${s.quick}` : '');
const spanOf = s => (s.mins == null ? '' : s.at + (R.slotEnd(s) > s.mins ? '–' + R.hhmm(Math.min(R.slotEnd(s), 1439)) : ''));

// ---------- scenes: the photo behind the clock ----------
// Famous landscapes, no people, like a desktop wallpaper that changes itself. They ship
// with the app (app/scenes, 1920px), so they work offline and nothing is fetched from a
// third party. All from Wikimedia Commons; each one is credited on screen as its licence asks.
const SCENES = [
  ['moraine', 'Moraine Lake, Banff, Canada', 'Gorgo', 'Public domain', 'Moraine Lake 17092005.jpg'],
  ['dolomites', 'Tre Cime di Lavaredo, Dolomites, Italy', 'Ximonic (Simo Räsänen)', 'CC BY-SA 4.0', 'Valle della Rienza and Tre Cime di Lavaredo from Alpe Specie, Val Pusteria, Trentino-Alto Adige, Italy, 2025 October.jpg'],
  ['yosemite', 'Tunnel View, Yosemite, California', 'Diliff', 'CC BY-SA 3.0', 'Tunnel View, Yosemite Valley, Yosemite NP - Diliff.jpg'],
  ['fuji', 'Mount Fuji at sunset, Japan', 'Romain Guy', 'CC0', 'Mount Fuji at sunset, March 2025.jpg'],
  ['reine', 'Reine, Lofoten, Norway', 'Ximonic (Simo Räsänen)', 'CC BY-SA 4.0', 'Houses of Reine by Gravdalsbukta, Moskenes, Nordland, Norway, 2022 June.jpg'],
  ['antelope', 'Lower Antelope Canyon, Arizona', 'King of Hearts', 'CC BY-SA 4.0', 'Lower Antelope Canyon November 2018 008.jpg'],
  ['matterhorn', 'Matterhorn, Switzerland', 'Liridon', 'CC BY-SA 4.0', 'Matterhorn, March 2019 (01).jpg'],
  ['kirkjufell', 'Kirkjufell, Iceland', 'Jakub Hałun', 'CC BY 4.0', 'Kirkjufell, Iceland, 20240714 1631 0713.jpg'],
  ['paine', 'Cuernos del Paine, Patagonia, Chile', 'Pedro Szekely', 'CC BY-SA 2.0', 'Cuernos del Paine in Torres del Paine National Park.jpg'],
  ['grandcanyon', 'Grand Canyon from Hopi Point, Arizona', 'Tuxyso', 'CC BY-SA 3.0', 'Grand Canyon Hopi Point with rainbow 2013.jpg'],
  ['chola', 'Chola Lake, Khumbu, Nepal', 'Vyacheslav Argenberg', 'CC BY 4.0', 'Chola Mountain Lake, Nepal.jpg'],
  ['monumentvalley', 'Monument Valley, Utah', 'King of Hearts', 'CC BY-SA 4.0', 'Forrest Gump Point Monument Valley November 2018 001.jpg'],
  ['seljalandsfoss', 'Seljalandsfoss, Iceland', 'Diego Delso', 'CC BY-SA 4.0', 'Seljalandsfoss, Suðurland, Islandia, 2014-08-16, DD 201-203 HDR.JPG'],
].map(([f, place, by, lic, file]) => ({ f, place, by, lic, file }));
const SCENE_MS = 60000; // one photo a minute, cross-faded
const sceneAt = t => SCENES[Math.floor(t / SCENE_MS) % SCENES.length];
const sceneCap = s => `${ic('compass')} ${esc(s.place)} <span>· ${esc(s.by)}, ${esc(s.lic)}</span>`;
const commonsUrl = s => 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(s.file.replace(/ /g, '_'));

function sceneHTML() {
  const s = sceneAt(Date.now());
  return `<div id="scene" aria-hidden="true"><img class="show" src="scenes/${s.f}.jpg" alt="" data-f="${s.f}"><img alt=""></div>`;
}

/** Cross-fade to the next photo once it has decoded. Offline with it not yet cached, the
    one showing just stays. */
async function sceneTick() {
  const box = document.getElementById('scene');
  if (!box || !box.querySelectorAll) return;
  const s = sceneAt(Date.now()), [a, b] = box.querySelectorAll('img');
  if (!a || !b) return;
  const cur = a.classList.contains('show') ? a : b, nxt = cur === a ? b : a;
  if (cur.dataset.f === s.f || nxt.dataset.f === s.f + '…') return;
  nxt.dataset.f = s.f + '…';
  nxt.src = `scenes/${s.f}.jpg`;
  try { await nxt.decode(); } catch (e) { nxt.dataset.f = ''; return; }
  nxt.dataset.f = s.f;
  nxt.classList.add('show'); cur.classList.remove('show');
  const cap = document.getElementById('sceneCap');
  if (cap) cap.innerHTML = sceneCap(s);
}

// ---------- theme ----------
const isDark = () => DB.prefs.theme === 'dark' ||
  (DB.prefs.theme !== 'light' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
function applyTheme() {
  const r = document.documentElement;
  if (!r || !r.dataset) return;
  if (DB.prefs.theme === 'light' || DB.prefs.theme === 'dark') r.dataset.theme = DB.prefs.theme;
  else delete r.dataset.theme;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute('content', isDark() ? '#121110' : '#f3efe8'));
}
/** The new theme washes in as a circle from where you tapped. */
function setTheme(t, x, y) {
  const go = () => { DB.prefs.theme = t; save(); applyTheme(); render(); };
  const r = document.documentElement;
  if (!document.startViewTransition || reduced() || !r || !r.style) { go(); return; }
  r.style.setProperty('--vx', (x || innerWidth / 2) + 'px');
  r.style.setProperty('--vy', (y || 0) + 'px');
  r.classList.add('vt-theme');
  document.startViewTransition(go).finished.finally(() => r.classList.remove('vt-theme'));
}
/** Tabs cross-fade instead of cutting. */
// While one runs, the page's own fade-up is skipped (S.vt): the transition already moves it.
const vt = fn => (document.startViewTransition && !reduced()
  ? document.startViewTransition(() => { S.vt = true; try { fn(); } finally { S.vt = false; } }) : fn());

// ---------- weather and tides ----------
// Open-Meteo: free, no key, no account. Only the place you pick (Settings, or the card on
// Home) is sent. Cached for 30 minutes in its own key, so it never rides along with Drive sync.
const WKEY = 'p1p.wx';
const wxGet = () => { try { return JSON.parse(localStorage.getItem(WKEY) || 'null'); } catch (e) { return null; } };
const imperial = () => /-(US|LR|MM)$/i.test((typeof navigator !== 'undefined' && navigator.language) || '');
const fmtHM = hm => { const m = R.minutesOf(hm); return m == null ? '' : clockText(new Date(2000, 0, 1, Math.floor(m / 60), m % 60)); };
const wxIc = name => ic('wx-' + name, 'wxg');

async function loadWx(force) {
  const p = DB.prefs.place;
  if (!p || !window.fetch) return;
  const c = wxGet(), key = `${p.lat},${p.lon},${imperial()}`;
  if (!force && c && c.key === key && Date.now() - c.at < 30 * 60000) return;
  const q = `latitude=${p.lat}&longitude=${p.lon}&timezone=auto`;
  try {
    const [w, m] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?${q}${imperial() ? '&temperature_unit=fahrenheit' : ''}` +
        '&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=4')
        .then(r => (r.ok ? r.json() : null)),
      fetch(`https://marine-api.open-meteo.com/v1/marine?${q}&hourly=sea_level_height_msl&forecast_days=3`)
        .then(r => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    if (!w || !w.current) return;
    localStorage.setItem(WKEY, JSON.stringify({ at: Date.now(), key, w, m }));
    if (S.tab === 'dash') render();
  } catch (e) { /* offline: the last copy stays on screen */ }
}

/** The weather card: now, today's high and low, the next three days, sunrise and sunset. */
function wxHTML(w) {
  const deg = v => Math.round(v) + '°';
  const [label, icon] = R.wxInfo(w.current.weather_code);
  const ico = wxIc(icon === 'sun' && !w.current.is_day ? 'moon' : icon);
  const dl = w.daily || {};
  const days = (dl.time || []).slice(1, 4).map((t, i) => `<span><small>${DAYN[R.weekdayOf(t)]}</small>${wxIc(R.wxInfo(dl.weather_code[i + 1])[1])}
    <b>${deg(dl.temperature_2m_max[i + 1])}</b><small>${deg(dl.temperature_2m_min[i + 1])}</small></span>`).join('');
  const sun = dl.sunrise && dl.sunrise[0] ? `<span class="sunrow">${ic('wx-rise', 'wxs')} ${esc(fmtHM(dl.sunrise[0].slice(11)))} ${ic('wx-set', 'wxs')} ${esc(fmtHM(dl.sunset[0].slice(11)))}</span>` : '';
  return `<button class="glass wx" data-act="place">
    <span class="wxnow"><span class="wxi">${ico}</span>
      <span class="wxtx"><b class="wxt">${deg(w.current.temperature_2m)}</b> <span class="wxl">${esc(label)}</span>
        <small>H ${deg(dl.temperature_2m_max[0])} · L ${deg(dl.temperature_2m_min[0])} · ${esc(DB.prefs.place.name)}</small>${sun}</span></span>
    ${days ? `<span class="wxd">${days}</span>` : ''}</button>`;
}

/** The next high and low, and the next day's water as a line with a dot at now. */
function tideHTML(m) {
  const hr = m && m.hourly;
  if (!hr || !(hr.sea_level_height_msl || []).some(v => v != null)) return '';
  const ft = imperial(), unit = ft ? 'ft' : 'm', k = ft ? 3.281 : 1;
  const n = new Date(), nowIso = `${today()}T${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
  const turns = R.tideTurns(hr.time, hr.sea_level_height_msl).filter(t => `${t.day}T${t.at}` > nowIso).slice(0, 2);
  const i0 = Math.max(0, hr.time.findIndex(t => t.slice(0, 13) === nowIso.slice(0, 13)));
  const vals = hr.sea_level_height_msl.slice(i0, i0 + 25).filter(v => v != null);
  const line = vals.length > 2 ? sparkPath(vals, 240, 40, 4) : null;
  return `<div class="glass tide">
    <div class="row" style="gap:14px"><span class="ttl">${ic('wx-wave', 'wxs')} Tides</span>${turns.map(t => `<span class="tt"><small>${t.high ? 'High' : 'Low'}</small>
      <b>${esc(fmtHM(t.at))}</b><small>${(t.h * k).toFixed(1)} ${unit}${t.day !== today() ? ' · tmrw' : ''}</small></span>`).join('')}</div>
    ${line ? `<svg viewBox="0 0 240 40" preserveAspectRatio="none" class="tline" aria-hidden="true"><path d="${line.area}" fill="rgba(255,255,255,.16)"/>
      <path d="${line.line}" fill="none" stroke="#fff" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      <circle cx="${line.x(0).toFixed(1)}" cy="${line.y(vals[0]).toFixed(1)}" r="3.2" fill="#fff"/></svg>` : ''}
  </div>`;
}

/** The left third of Home: the time, the weather, the tides, and what's next. */
function infoPanel(brief) {
  const n = new Date(), m = nowMinutes(), d = today();
  const greet = n.getHours() < 5 ? 'Good night' : n.getHours() < 12 ? 'Good morning' : n.getHours() < 17 ? 'Good afternoon' : 'Good evening';
  const c = wxGet(), p = DB.prefs.place;
  const fresh = c && p && c.w && c.w.current && String(c.key || '').startsWith(`${p.lat},${p.lon},`);
  const { now, next } = R.nowNext(brief.sched.placed, m);
  const hs = scheduledOn(d), done = hs.filter(h => habitDone(h, d)).length;
  return `<div class="ib-top">
      <button class="glass gbtn" data-act="theme" aria-label="Switch to ${isDark() ? 'light' : 'dark'} theme">${ic(isDark() ? 'wx-sun' : 'wx-moon')}</button>
      <button class="glass gbtn" data-act="kiosk" aria-label="${S.kiosk ? 'Exit display mode' : 'Display mode'}">${ic('mirror')}</button></div>
    <div class="ib-time" id="hClock">${clockHTML(n)}</div>
    <div class="ib-date">${esc(dayTitle(d))}</div>
    <div class="ib-greet">${greet}${hs.length ? ` · ${done} of ${hs.length} habits done` : ''}</div>
    <div class="ib-cards">
    ${fresh ? wxHTML(c.w) + tideHTML(c.m) : `<button class="glass wx" data-act="place"><span class="wxnow"><span class="wxi">${wxIc('cloud-sun')}</span>
      <span class="wxtx"><b class="wxl" style="display:block">Weather and tides</b><small>Add your place to see them here</small></span></span></button>`}
    ${now || next ? `<button class="glass upn" data-act="slide:1">
      ${now ? `<small>Now · until ${esc(fmtHM(R.hhmm(Math.min(R.slotEnd(now), 1439))))}</small><b>${esc(now.name)}</b>` : ''}
      ${next ? `<small>Next · ${away(next.mins - m)}</small><b>${esc(next.name)}</b>` : ''}</button>` : ''}
    </div>
    <div class="scap" id="sceneCap">${sceneCap(sceneAt(Date.now()))}</div>`;
}

/** The calendar: the right two-thirds of Home, and the only calendar in the app. It holds
    events and tasks, with their times and deadlines. Habits, the routine and the daily
    review are the day's schedule, and that lives on Today. Day, a rolling week, or the month. */
const CAL_MODES = [['day', 'Day'], ['week', 'Week'], ['month', 'Month']];
function calPane() {
  const t = today(), a = S.homeAnchor || t, mode = S.homeCal || 'week';
  const top = title => `<div class="cp-top">
      <h2 class="cp-month">${esc(title)}</h2>
      <div class="seg cp-seg">${CAL_MODES.map(([k, l]) => `<button data-act="hcal:${k}" aria-pressed="${mode === k}">${l}</button>`).join('')}</div>
      <span class="spacer"></span>
      <button class="mini" data-act="hshift:-1" aria-label="Earlier">‹</button>
      <button class="mini" data-act="hshift:0">Today</button>
      <button class="mini" data-act="hshift:1" aria-label="Later">›</button></div>`;
  const monthName = k => R.fromYMD(k).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  if (mode === 'month') return top(monthName(a)) + calMonth(a);
  const days = mode === 'day' ? [a] : Array.from({ length: 7 }, (_, i) => R.addDays(a, i));
  const per = days.map(day => R.daySchedule(calSlots(day)));
  // Six to eleven, widened for anything earlier or later.
  let from = 6, to = 23;
  // A point in time is drawn 25 minutes tall, so the window has to reach past its start too.
  per.forEach(s => s.placed.forEach(x => { from = Math.min(from, Math.floor(x.mins / 60)); to = Math.max(to, Math.ceil(Math.min(Math.max(R.slotEnd(x), x.mins + 25), 1440) / 60)); }));
  to = Math.min(24, to);
  const m = nowMinutes();
  const cls = i => (mode === 'week' && i >= 3 ? ' x3' : '') + (mode === 'week' && i >= 5 ? ' x5' : '');
  const head = days.map((day, i) => {
    const any = per[i].anytime.filter(s => !s.block && !s.part);
    return `<div class="tg-h${day === t ? ' today' : ''}${cls(i)}">
      <button class="tg-d" data-act="calday:${day}"><small>${DAYN[R.weekdayOf(day)]}</small><b>${R.fromYMD(day).getDate()}</b></button>
      <div class="tg-any">${any.slice(0, 2).map(s => `<button class="any${s.done ? ' done' : ''}" data-act="${s.act}" style="--hc:${esc(s.color || 'var(--tint)')}">${esc(s.name)}</button>`).join('')}${
        any.length > 2 ? `<button class="any more" data-act="calday:${day}">+${any.length - 2} more</button>` : ''}</div></div>`;
  }).join('');
  const cols = days.map((day, i) => {
    const L = R.layoutDay(per[i].placed, from, to);
    return `<div class="tg-col${day === t ? ' today' : ''}${cls(i)}">
      ${L.events.map(e => `<button class="ev${e.s.done ? ' done' : ''}" data-act="${e.s.act}"
        style="top:${e.top}%;height:${e.height}%;left:calc(${e.col} * 100% / ${e.cols});width:calc(100% / ${e.cols} - 3px);--hc:${esc(e.s.color || 'var(--tint)')}">
        <b>${esc(e.s.name)}</b><small>${esc(fmtHM(e.s.at))}</small></button>`).join('')}
      ${day === t && m >= from * 60 && m < to * 60 ? `<i class="nowl" style="top:${(((m - from * 60) / ((to - from) * 60)) * 100).toFixed(2)}%"></i>` : ''}
    </div>`;
  }).join('');
  const hours = Array.from({ length: to - from - 1 }, (_, i) => from + 1 + i).map(hh =>
    `<span style="top:${(((hh - from) / (to - from)) * 100).toFixed(2)}%">${esc(fmtHM(R.hhmm(hh * 60)).replace(':00', ''))}</span>`).join('');
  return top(mode === 'day' ? dayTitle(a) : monthName(a)) + `
    <div class="tg"${mode === 'day' ? ' style="--days:1"' : ''}>
      <div class="tg-head"><span></span>${head}</div>
      <div class="tg-body" style="--hours:${to - from}"><div class="tg-hours">${hours}</div>${cols}</div>
    </div>`;
}

/** The month: each day with its first few events and tasks, earliest first. */
function calMonth(a) {
  const t = today(), first = a.slice(0, 8) + '01';
  const fd = R.fromYMD(first), total = R.daysInMonth(fd.getFullYear(), fd.getMonth() + 1), lead = R.weekdayOf(first);
  const rows = Math.ceil((lead + total) / 7);
  const cell = k => {
    const s = R.daySchedule(calSlots(k)), list = [...s.placed, ...s.anytime];
    return `<div class="mc${k === t ? ' today' : ''}${k < t ? ' past' : ''}">
      <button class="mc-d" data-act="calday:${k}">${R.fromYMD(k).getDate()}</button>
      ${list.slice(0, 3).map((x, i) => `<button class="any${x.done ? ' done' : ''}${i ? ' x2' : ''}" data-act="${x.act}" style="--hc:${esc(x.color || 'var(--tint)')}">${
        x.at ? `<small>${esc(fmtHM(x.at))}</small> ` : ''}${esc(x.name)}</button>`).join('')}
      ${list.length > 3 ? `<button class="any more" data-act="calday:${k}">+${list.length - 3} more</button>` : ''}
    </div>`;
  };
  const cells = Array.from({ length: rows * 7 }, (_, i) => {
    const n = i - lead;
    return n < 0 || n >= total ? '<div class="mc blank"></div>' : cell(R.addDays(first, n));
  }).join('');
  return `<div class="cm"><div class="cm-dow">${DAYN.map(x => `<span>${x}</span>`).join('')}</div>
    <div class="cm-grid" style="--rows:${rows}">${cells}</div></div>`;
}

/** Pick the place for weather and tides: search by name, or use where you are. */
function placeSheet() {
  const p = DB.prefs.place;
  const body = list => `
    <label class="f">City or town</label>
    <div class="inline"><input id="plQ" placeholder="e.g. Hoboken" autocomplete="off">
      <button class="btn" style="margin:0;flex:0 0 auto;width:auto;padding:0 18px" data-act="plFind">Find</button></div>
    ${list.map((r, i) => `<button class="opt" data-act="plPick:${i}"><span style="flex:1"><strong>${esc(r.name)}</strong><br>
      <span class="hint">${esc([r.admin1, r.country].filter(Boolean).join(', '))}</span></span></button>`).join('')}
    <button class="btn sec" data-act="plHere">Use my location</button>
    ${p ? `<button class="btn danger" data-act="plClear">Stop showing ${esc(p.name)}</button>` : ''}
    <p class="hint" style="margin-top:12px">Weather and tides come from Open-Meteo: free, no account. Only this place is sent,

function setPlace(pl) {

/** Now and next, big enough to read from the doorway. */
function nowNextCard(placed) {
  const m = nowMinutes(), { now, next } = R.nowNext(placed, m);
  if (!now && !next) return '';
  const part = (label, s, foot) => {
    const tk = tickOf(s);
    return `<div class="nn" style="--hc:${esc(s.color || 'var(--tint)')}">
      <span class="nnl">${label}</span>
      <div class="row" style="gap:12px">
        <div style="flex:1;min-width:0" data-act="${s.act}">
          <div class="nnt">${glyph(s.icon)} ${esc(s.name)}</div>
          <div class="sub" style="margin-top:3px">${esc([spanOf(s), s.meta].filter(Boolean).join(' · '))}</div>
        </div>
        ${tk ? `<button class="tk big" data-act="${tk}" aria-label="Mark ${esc(s.name)} done"></button>` : ''}
      </div>${foot || ''}</div>`;
  };
  let out = '';
  if (now) {
    const end = R.slotEnd(now), pct = Math.round(((m - now.mins) / Math.max(1, end - now.mins)) * 100);
    out += part('Now', now, `<div class="bar" style="margin-top:12px"><i style="width:${pct}%;background:var(--hc)"></i></div>
      <div class="sub" style="margin-top:6px">ends ${away(end - m)}</div>`);
  }
  if (next) out += part(`Up next · ${away(next.mins - m)}`, next);
  return `<div class="card nncard">${out}</div>`;
}

/** The morning brief, as a timeline: what's done and behind you folds away, the red line is now. */
function dailyBrief(b, day) {
  const d = day || today(), isT = d === today(), { late, sched } = b || briefData(d);
  const items = [...late, ...sched.placed, ...sched.anytime];
  const todo = items.filter(s => !s.block && !s.part && !s.ev); // routine blocks and calendar events show the day; only these count
  const left = todo.filter(s => !s.done);
  // Another day has no now: nothing folds away and there is no red line.
  const m = isT ? nowMinutes() : -1;
  const next = isT ? sched.placed.find(s => !s.done && s.mins >= m) : null;
  const live = isT ? R.nowNext(sched.placed, m).now : null;

  const summary = !items.length ? `Nothing on ${isT ? 'today' : 'this day'}. Tap + to add something.`
    : !todo.length ? 'Your routine for the day.'
    : !left.length ? `All ${todo.length} done. Good day.`
    : [`${left.length} of ${todo.length} left`,
       late.length && `${late.length} overdue`,
       next && `next: ${next.name} at ${next.at}`].filter(Boolean).join(' · ');

  const row = s => {
    const tk = tickOf(s);
    return `<li class="${[s.block && 'blk', s.done && 'done', s === live && 'now'].filter(Boolean).join(' ')}" style="--hc:${esc(s.color || 'var(--tint)')}">
      <span class="tlt">${s.late ? '<span style="color:var(--red)">Late</span>' : esc(s.at || '')}${s.mins != null && R.slotEnd(s) > s.mins ? `<small>${esc(R.hhmm(Math.min(R.slotEnd(s), 1439)))}</small>` : ''}</span>
      <div class="tlb" data-act="${s.act}">
        <div class="${s.done ? 'strike' : ''}"${s === next ? ' style="font-weight:650"' : ''}>${glyph(s.icon)} ${esc(s.name)}</div>
        ${s.meta || s.late || s === next ? `<div class="meta">${s.late ? `<span style="color:var(--red)">overdue · ${esc(s.meta)}</span>`
          : s.meta ? `<span>${esc(s.meta)}</span>` : ''}${s === next ? '<span style="color:var(--tint)">up next</span>' : ''}</div>` : ''}
      </div>
      ${s.done ? '<span class="tk on" aria-hidden="true"></span>' : tk ? `<button class="tk" data-act="${tk}" aria-label="Mark ${esc(s.name)} done"></button>` : ''}
    </li>`;
  };
  // A wall calendar drops what's behind you, so the page opens on now. Anything whose time
  // has passed folds under Earlier, with a count of what was missed, still tickable inside;
  // the fold stays open across repaints so you can tick several in a row.
  const gone = s => R.slotEnd(s) <= m;
  const earlier = sched.placed.filter(gone), ahead = sched.placed.filter(s => !gone(s));
  const missed = earlier.filter(s => !s.done && !s.block && !s.part).length;
  const at = ahead.findIndex(s => s.mins > m);
  const line = isT ? `<li class="nowline" aria-label="now">${esc(clockText(new Date()))}</li>` : '';
  const timeline = ahead.map((s, i) => (i === at ? line : '') + row(s)).join('') + (at < 0 && ahead.length ? line : '');

  const shift = S.briefShift || 0;
  return `<div class="card agenda"><div class="row" style="gap:6px;margin-bottom:10px"><h2 style="flex:1;margin:0">${ic('clock')} Daily brief</h2>
      <button class="mini" data-act="bshift:-1" aria-label="Previous day">‹</button>
      <button class="mini" data-act="bshift:0"${shift ? '' : ' aria-pressed="true"'}>Today</button>
      <button class="mini" data-act="bshift:1" aria-label="Next day">›</button></div>
    <p class="sub" style="margin:0 0 8px">${esc(dayTitle(d))} · ${esc(summary)}</p>
    ${late.length ? `<ul class="tl">${late.map(row).join('')}</ul>` : ''}
    ${earlier.length ? `<details class="earlier"${S.earlier ? ' open' : ''}><summary data-act="earlier">Earlier today · ${earlier.length}${
      missed ? ` · <span style="color:var(--orange)">${missed} not done</span>` : ''}</summary>
      <ul class="tl">${earlier.map(row).join('')}</ul></details>` : ''}
    ${ahead.length ? `<ul class="tl">${timeline}</ul>` : ''}
    ${sched.anytime.length ? `<div class="tlh">Any time</div><ul class="tl">${sched.anytime.map(row).join('')}</ul>` : ''}
  </div>`;
}

/** Goals, habits and the calendar as one program: each goal, how this week is going against
    the same days last week, and the next thing on today's calendar that moves it. */
function programCard() {
  const gs = liveGoals();
  if (!gs.length) return '';
  const d = today(), span = R.weekdayOf(d) + 1; // week to date, against the same days a week ago
  const kept = (hs, end) => hs.reduce((a, h) => {
    const r = R.completionRate(h, logValue, end, span);
    return { done: a.done + r.done, total: a.total + r.total };
  }, { done: 0, total: 0 });
  const rate = k => (k.total ? Math.round((k.done / k.total) * 100) : null);
  const slots = R.daySchedule(daySlots(d)).placed.filter(s => !s.done && s.goalId);
  const m = nowMinutes();

  const all = kept(liveHabits(), d), allPrev = kept(liveHabits(), R.addDays(d, -7));
  const dAll = rate(all) != null && rate(allPrev) != null ? rate(all) - rate(allPrev) : null;
  const rows = gs.slice(0, 6).map(g => {
    const hs = habitsFor(g.id), w = kept(hs, d), lw = kept(hs, R.addDays(d, -7));
    const pct = Math.round(goalPct(g) * 100), col = areaColor(g.area);
    const dw = rate(w) != null && rate(lw) != null ? rate(w) - rate(lw) : null;
    const nx = slots.find(s => s.goalId === g.id && R.slotEnd(s) > m); // still ahead today, or nothing
    return `<button class="prog" data-act="goal:${g.id}" style="--hc:${col}">
      <span class="rw">${ring(pct, 50, col)}<b>${pct}%</b></span>
      <span style="flex:1;min-width:0">
        <span style="font-weight:600;display:block">${esc(g.statement)}</span>
        <span class="sub" style="display:block;margin-top:2px">${w.total ? `This week ${w.done}/${w.total} kept` : 'No habits this week yet'}${
          dw != null ? ` · <span style="color:${upDown(dw)}">${signed(dw)} pts</span>` : ''}</span>
        ${nx ? `<span class="sub" style="display:block;color:var(--hc)">Next: ${esc(nx.name)} at ${esc(nx.at)}</span>` : ''}
      </span><span class="chev">›</span></button>`;
  }).join('');
  return `<div class="card"><h2>${ic('sprout')} Your program</h2>
    <p class="sub" style="margin:0 0 4px">${all.total ? `This week: ${all.done} of ${all.total} habit check-ins kept` : 'Nothing scheduled this week yet'}${
      dAll != null ? ` · <span style="color:${upDown(dAll)}">${signed(dAll)} pts vs last week</span>` : ''}</p>
    ${rows}</div>`;
}

/** Each slide's content on its own, so the minute tick can patch them in place. */
function dashParts() {
  const d = today();
  const ctx = indexCtx();
  const from = rangeStart();
  const series = R.indexSeries(from, d, ctx);
  const vals = series.map(p => Math.round(p.score * 100));
  const avg = Math.round(vals.reduce((s, v) => s + v, 0) / vals.length);

  // The brokerage question is "up or down since when", so the comparison is the same
  // stretch of time immediately before this one.
  const span = R.daysBetween(from, d) + 1;
  const prev = R.indexSeries(R.addDays(from, -span), R.addDays(from, -1), ctx);
  const prevAvg = prev.length
    ? Math.round(prev.reduce((s, p) => s + p.score * 100, 0) / prev.length) : avg;
  const delta = avg - prevAvg;
  const col = upDown(delta);

  const hs = scheduledOn(d);
  const pct = hs.length ? Math.round((hs.reduce((s, h) => s + habitProgress(h, d), 0) / hs.length) * 100) : 0;
  const doneCount = hs.filter(h => habitDone(h, d)).length;
  const brief = briefData();
  const bd = R.addDays(d, S.briefShift || 0); // the day the brief is showing

  // The clock with now and next; then, on its own so a phone can put the day first,
  // anything waiting on a decision.
  const nn = nowNextCard(brief.sched.placed);
  let c4 = '';
  // The plan lives in a file beside the app; until it's in, say so where it can't be missed.
  if (!DB.goals.some(g => String(g.id).startsWith('p1g-'))) c4 += `<button class="card coachcard" data-act="loadPlan">
    <div class="row"><span class="cico">${glyph('🎯')}</span><span style="flex:1"><strong>Load my 2027 plan</strong><br>
      <span class="hint">Your goals with the habits, tasks, cards and applications behind each one.</span></span>
      <span class="chev">›</span></div></button>`;
  const adj = DB.memory.filter(m => m.d === d && m.coll && !m.undone).length;
  if (adj) c4 += `<button class="card coachcard" data-act="growto:goals">
    <div class="row"><span class="cico">${glyph('🧭')}</span><span style="flex:1">The plan adjusted ${adj} thing${adj === 1 ? '' : 's'}
      today to fit what you got done.</span><span class="chev">›</span></div></button>`;
  c4 += todayPlanCard();
  c4 += queueCard(); // last: the longest list scrolls inside its column

  // The program, and today's habits beside it.
  let out = `<div class="card"><h2>${ic('repeat')} Today's habits</h2>`;
  if (!hs.length) out += `<p class="hint">No habits due today. Tap + to add one.</p>`;
  else out += `<div class="strip">${hs.map(chip).join('')}</div>`;
  out += `</div>`;

  const tips = R.coach(coachCtx());
  let coachHTML = '';
  if (tips.length) {
    const top = tips[0];
    coachHTML = `<button class="card coachcard ${esc(top.tone)}" data-act="coach">
      <div class="row" style="align-items:flex-start"><span class="cico">${glyph(top.icon)}</span>
        <span style="flex:1"><span class="sub" style="display:block;margin-bottom:3px">Companion</span>
          ${esc(top.text)}</span>
        <span class="chev">›</span></div></button>`;
  }

  let pr = `<div class="card hero">
    <div class="sub">Overall · ${esc(rangeName() === 'ALL' ? 'all time' : 'past ' + rangeName())}</div>
    <div class="heroNum" id="heroVal" data-to="${avg}">${avg}%</div>
    <div class="heroDelta" id="heroSub" style="color:${col}">${signed(delta)} pts vs the stretch before</div>
    ${heroChart(series, col)}
    <div class="seg ranges">${RANGES.map(r =>
      `<button data-act="range:${r[1]}" aria-pressed="${S.range === r[1]}">${r[0]}</button>`).join('')}</div>
    <p class="hint" style="margin-top:4px;text-align:center">Drag across the chart for any day</p>
  </div>`;

  // The three positions. Same shape as a holdings list: what it is, how it has moved,
  // where it stands.
  const bud = budgetTotal();
  const spentMonth = R.spend(monthTxns(R.monthKey(d)).map(t => t.amount));
  const net = DB.accounts.reduce((s, a) => s + accountBalance(a), 0);
  const inRange = DB.txns.filter(t => t.date >= from && t.date <= d);
  const netMove = inRange.reduce((s, t) => s + t.amount, 0);
  const openCount = openTasks().length;
  const doneInRange = DB.tasks.filter(t => t.done && t.completedAt && t.completedAt >= from).length;
  const overdue = DB.tasks.filter(isOverdue).length;

  // Each track moves against the same stretch before it, exactly like the headline.
  // Comparing the last bucket to the first would measure this range against a
  // half-finished today, so every morning would read as a collapse.
  const avgOf = (arr, k) => {
    const v = arr.map(p => p[k]).filter(x => x != null);
    return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
  };
  const trackDelta = k => {
    const a = avgOf(series, k), b = avgOf(prev, k);
    return a == null || b == null ? null : Math.round((a - b) * 100);
  };
  const trackSpark = (k, color) =>
    spark(series.map(p => p[k]).filter(x => x != null).map(x => Math.round(x * 100)), color);
  const pts = n => (n == null ? '—' : signed(n) + ' pts');
  const ptsColor = n => (n == null ? 'var(--dim)' : upDown(n));
  const hDelta = trackDelta('habits'), tDelta = trackDelta('tasks'), lDelta = trackDelta('learn');
  const ret = R.retention(liveCards(), d);

  let tr = `<div class="card"><h2>${ic('layers')} Tracks</h2>
    ${trackRow({
      act: 'tab:habits', icon: ic('repeat'), color: 'var(--tint)', name: 'Habits',
      sub: hs.length ? `${doneCount} of ${hs.length} done today` : 'nothing scheduled today',
      spark: trackSpark('habits', 'var(--tint)'),
      value: pct + '%', delta: pts(hDelta), deltaColor: ptsColor(hDelta),
    })}
    ${trackRow({
      act: 'tab:fin', icon: ic('card'), color: 'var(--orange)', name: 'Money',
      sub: bud ? `${money0(spentMonth)} of ${money0(bud)} this month` : 'no budget set',
      spark: trackSpark('money', 'var(--orange)'),
      value: money0(net), delta: (netMove >= 0 ? '▲ ' : '▼ ') + money0(Math.abs(netMove)),
      deltaColor: upDown(netMove),
    })}
    ${trackRow({
      act: 'tab:task', icon: ic('check-square'), color: 'var(--green)', name: 'Tasks',
      sub: overdue ? `${overdue} past due` : `${openCount} open`,
      spark: trackSpark('tasks', 'var(--green)'),
      value: doneInRange + ' done', delta: pts(tDelta), deltaColor: ptsColor(tDelta),
    })}
    ${DB.apps.some(appOpen) ? appTrack() : ''}
    ${ret.total ? trackRow({
      act: 'growto:learn', icon: ic('bulb'), color: 'var(--purple)', name: 'Learning',
      sub: ret.due ? `${ret.due} card${ret.due === 1 ? '' : 's'} due now` : `${ret.learned} of ${ret.total} learned`,
      spark: trackSpark('learn', 'var(--purple)'),
      value: ret.recall == null ? '—' : Math.round(ret.recall * 100) + '%',
      delta: pts(lDelta), deltaColor: ptsColor(lDelta),
    }) : ''}`;
  if (bud) {
    const ratio = Math.min(spentMonth / bud, 1) * 100;
    tr += `<div class="bar" style="margin-top:12px"><i style="width:${ratio}%;background:${
      spentMonth > bud ? 'var(--red)' : ratio > 80 ? 'var(--orange)' : 'var(--green)'}"></i></div>
      <p class="hint" style="margin-top:8px">${spentMonth > bud
        ? esc(money(spentMonth - bud)) + ' over this month’s budget'
        : esc(money(bud - spentMonth)) + ' left of this month’s budget'}</p>`;
  }
  tr += `</div>`;

  // The figures each slide's banner carries.
  const bdb = bd === d ? brief : briefData(bd);
  const todo = [...bdb.late, ...bdb.sched.placed, ...bdb.sched.anytime].filter(s => !s.block && !s.part);
  const wkDays = R.weekdayOf(d) + 1; // the week so far
  const wk = liveHabits().reduce((a, x) => { const r = R.completionRate(x, logValue, d, wkDays); return [a[0] + r.done, a[1] + r.total]; }, [0, 0]);
  return {
    info: infoPanel(brief), cal: calPane(),
    today: heroBand(bd === d ? 'Today' : DAYN[R.weekdayOf(bd)], dayTitle(bd), 'today',
      [[`${todo.filter(s => !s.done).length}/${todo.length}`, 'left to do'], [String(bdb.late.length), 'overdue'],
       [`${doneCount}/${hs.length}`, 'habits done']]) +
      `<div class="duo"><div>${nn}${c4}</div><div>${dailyBrief(bdb, bd)}</div></div>`,
    program: heroBand('Program', 'Your goals, the habits behind them, and this week against last', 'program',
      [[String(liveGoals().length), 'goals'], [`${wk[0]}/${wk[1]}`, 'check-ins this week'],
       [wk[1] ? Math.round((wk[0] / wk[1]) * 100) + '%' : '—', 'kept this week']]) +
      `<div class="duo"><div>${programCard()}</div><div>${coachHTML}${out}</div></div>`,
    progress: heroBand('Progress', 'One number for every day, and the tracks that move it', 'progress',
      [[avg + '%', 'overall, ' + (rangeName() === 'ALL' ? 'all time' : rangeName())], [signed(delta) + ' pts', 'vs the stretch before'],
       [pct + '%', 'habits today']]) + `<div class="duo"><div>${pr}</div><div>${tr}</div></div>`,
  };
}


// ---------- photo banners ----------
// The Home panel's idea, once per section: a landscape behind the title, and the two or
// three numbers that section answers in the same frosted cards as the weather. Each
// section keeps its own scene so it has an identity; the cards below stay plain paper,
// because a photograph behind a list or a form only makes it harder to read.
const SECTION_SCENE = { today: 'yosemite', program: 'dolomites', progress: 'paine',
  habits: 'kirkjufell', task: 'monumentvalley', grow: 'matterhorn', fin: 'grandcanyon' };
const sceneOf = key => SCENES.find(s => s.f === SECTION_SCENE[key]) || SCENES[0];
function heroBand(title, sub, key, stats) {
  const s = sceneOf(key);
  const card = ([v, label, act]) => act
    ? `<button class="glass hb-stat" data-act="${act}"><b>${esc(v)}</b><small>${esc(label)}</small></button>`
    : `<div class="glass hb-stat"><b>${esc(v)}</b><small>${esc(label)}</small></div>`;
  return `<div class="shead hero-band">
    <img class="hb-img" src="scenes/${s.f}.jpg" alt="" aria-hidden="true" decoding="async">
    <div class="hb-text"><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>
    ${stats && stats.length ? `<div class="hb-stats">${stats.map(card).join('')}</div>` : ''}
    <span class="hb-cap">${ic('compass')} ${esc(s.place)} · ${esc(s.by)}, ${esc(s.lic)}</span>
  </div>`;
}

/** The figures each workspace opens with. */
function sectionStats(tab) {
  const d = today();
  if (tab === 'habits') {
    const hs = scheduledOn(d), done = hs.filter(x => habitDone(x, d)).length;
    const best = Math.max(0, ...liveHabits().map(streakOf));
    const k = liveHabits().reduce((a, x) => { const r = R.completionRate(x, logValue, d, 30); return [a[0] + r.done, a[1] + r.total]; }, [0, 0]);
    return [[`${done}/${hs.length}`, 'done today'], [String(best), best === 1 ? 'day, best streak' : 'days, best streak'],
            [k[1] ? Math.round((k[0] / k[1]) * 100) + '%' : '—', 'kept, 30 days']];
  }
  if (tab === 'task') {
    const wk = R.addDays(d, -6);
    return [[String(openTasks().length), 'open'], [String(DB.tasks.filter(isOverdue).length), 'overdue'],
            [String(DB.tasks.filter(t => t.done && t.completedAt && t.completedAt >= wk).length), 'done this week']];
  }
  if (tab === 'fin') {
    const spent = R.spend(monthTxns(R.monthKey(d)).map(t => t.amount)), bud = budgetTotal();
    return [[money0(spent), 'spent this month'], [bud ? money0(bud - spent) : '—', bud ? 'left in budget' : 'no budget set'],
            [money0(DB.accounts.reduce((s, a) => s + accountBalance(a), 0)), 'net worth']];
  }
  if (tab === 'grow') {
    const gs = liveGoals();
    return [[String(gs.length), gs.length === 1 ? 'goal' : 'goals'],
            [gs.length ? Math.round((gs.reduce((s, g) => s + goalPct(g), 0) / gs.length) * 100) + '%' : '—', 'average progress'],
            [String(dueNow().length), 'cards due', 'growto:learn']];
  }
  return [];
}

// The home is a deck of slides you swipe, tap or arrow through, like a presentation.
// Home is the smart-calendar screen; the rest is what used to be one long scroll.
const SLIDES = [['home', 'Home'], ['today', 'Today'], ['program', 'Program'], ['progress', 'Progress']];
const slideHead = (t, sub) => `<div class="shead"><h1>${esc(t)}</h1><p>${esc(sub)}</p></div>`;

function viewDash() {
  const p = dashParts();
  return `<div class="sdeck" id="deck">
    <section class="slide s-home" aria-label="Home"><div class="home2">
      <aside class="info">${sceneHTML()}<div class="info-body" id="dp-info">${p.info}</div></aside>
      <div class="card calpane" id="dp-cal">${p.cal}</div></div></section>
    ${SLIDES.slice(1).map(([k, l]) => `<section class="slide" aria-label="${l}"><div class="sbody" id="dp-${k}">${p[k]}</div></section>`).join('')}
  </div>`;
}

/** A tick or a check-in on Today repaints each slide's insides, not the deck: the slide you
    are on, its scroll, and the photo mid-fade all stay put. */
function patchDash() {
  const p = dashParts();
  Object.keys(p).forEach(k => { const el = document.getElementById('dp-' + k); if (el) el.innerHTML = p[k]; });
}

const pillsHTML = () => '<i class="thumb" aria-hidden="true"></i>' + SLIDES.map(([, l], i) =>
  `<button role="tab" data-act="slide:${i}" aria-current="${S.tab === 'dash' && S.slide === i}">${l}</button>`).join('');

/** Slide a bar's marker under its current item; with none current (a workspace is open,
    so no slide is), it fades away. Positions come from layout, so fonts loading or the
    window resizing calls this again. */
function placeThumb(box) {
  if (!box || !box.querySelector) return;
  const t = box.querySelector('.thumb'), on = box.querySelector('[aria-current="true"],[aria-current="page"]');
  if (!t || !t.style) return;
  if (!on || !on.offsetWidth) { t.style.opacity = '0'; return; }
  t.style.opacity = '1';
  t.style.width = on.offsetWidth + 'px';
  t.style.transform = `translateX(${on.offsetLeft}px)`;
}
const placeThumbs = () => { placeThumb(document.getElementById('pills')); placeThumb(document.querySelector('#tabs .tabtrack')); };
function markPills() {
  document.querySelectorAll('#pills button').forEach((b, i) => b.setAttribute('aria-current', String(S.tab === 'dash' && S.slide === i)));
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.act === 'tab:' + S.tab ? 'page' : 'false'));
  placeThumbs();
}
function goSlide(i) {
  const deck = document.getElementById('deck');
  S.slide = Math.max(0, Math.min(SLIDES.length - 1, i));
  markPills();
  if (deck && deck.scrollTo) deck.scrollTo({ left: S.slide * deck.clientWidth, behavior: reduced() ? 'auto' : 'smooth' });
}
function wireDeck() {
  const deck = document.getElementById('deck');
  if (!deck || !deck.addEventListener || !window.requestAnimationFrame) return;
  deck.style.scrollBehavior = 'auto';
  deck.scrollLeft = S.slide * deck.clientWidth;
  deck.style.scrollBehavior = '';
  let raf = 0;
  deck.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const i = Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth));
      if (i !== S.slide) { S.slide = i; markPills(); }
    });
  }, { passive: true });
}

function chip(h) {
  const d = today();
  const p = Math.round(habitProgress(h, d) * 100);
  const st = streakOf(h);
  const v = logValue(h.id, d), g = R.goalOf(h);
  const label = h.kind === 'checkbox' ? (p >= 100 ? '✓ Done' : 'Check in')
    : h.kind === 'timer' ? `${Math.round(v)} / ${g} min` : `${Math.round(v)} / ${g}`;
  return `<div class="chip" style="--hc:${esc(h.color)}">
    <div class="top"><span>${glyph(h.icon)}</span>${st ? `<span class="flame">${ic('flame')}${st}</span>` : ''}</div>
    <button class="nm" data-act="hbrief:${h.id}" style="text-align:left;display:block;width:100%">${esc(h.name)}</button>
    <div class="bar"><i style="width:${p}%"></i></div>
    <button class="act${p >= 100 ? ' on' : ''}" data-act="hquick:${h.id}">${esc(label)}</button>
  </div>`;
}

function fmtDue(day) {
  if (!day) return '';
  const t = today();
  if (day === t) return 'Today';
  if (day === R.addDays(t, 1)) return 'Tomorrow';
  if (day === R.addDays(t, -1)) return 'Yesterday';
  return R.fromYMD(day).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

// ---------- habits: the grid board ----------
// HabitKit's whole idea, and the reason people pay for it: one contribution grid per
// habit, in that habit's colour. Cells carry no data-act of their own — 371 of them
// would be 20 KB of attributes per habit. The board holds one, and the click handler
// works out the date from the cell's index.

function gridStart() { return R.addDays(R.startOfWeek(today()), -(S.gridWeeks - 1) * 7); }

function gridCells(h) {
  const end = today(), g = R.goalOf(h);
  let out = '';
  for (let key = gridStart(); key <= end; key = R.addDays(key, 1)) {
    const f = R.fraction(logValue(h.id, key), g);
    const cls = [
      f >= 1 ? 'l4' : f >= .66 ? 'l3' : f >= .33 ? 'l2' : f > 0 ? 'l1' : '',
      R.isScheduled(h, key) ? '' : 'off',
      key === end ? 'now' : '',
      key === end && S.pop === h.id ? 'pop' : '',
    ].filter(Boolean).join(' ');
    out += cls ? `<i class="${cls}"></i>` : '<i></i>';
  }
  return out;
}

/** Progress towards the period's goal, and towards today's if there is more than one
    step to it. periodProgress has been in rules.js since the first build, tested and
    unused — this is what it was for. */
function habitBars(h) {
  const d = today();
  const p = R.periodProgress(h, logValue, d);
  const goal = R.goalOf(h);
  const pctOf = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);
  let out = `<div class="row" style="margin-top:14px;font-size:13px">
      <span class="sub">${h.schedule === 'monthly' ? 'This month' : 'This week'}</span>

    <div class="bar" style="margin-top:6px"><i style="width:${pctOf(p.done, p.total)}%;background:var(--hc)"></i></div>`;
  if (goal > 1 && R.isScheduled(h, d)) {
    const v = Math.round(logValue(h.id, d));
    out += `<div class="row" style="margin-top:10px;font-size:13px">

      <div class="bar" style="margin-top:6px"><i style="width:${pctOf(v, goal)}%;background:var(--hc)"></i></div>`;
  }
  return out;
}

// A shareable PNG of one grid. HabitKit puts this behind the subscription; it is a
// canvas and thirty lines.
function fillRound(c, x, y, w, h, r) {
  if (c.roundRect) { c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); }
  else c.fillRect(x, y, w, h);
}

function shareGrid(hid) {
  const h = habitById(hid);
  if (!h) return;
  const cell = 13, gap = 3, pad = 26, head = 82, foot = 34;
  const days = R.daysBetween(gridStart(), today()) + 1;
  const cols = Math.ceil(days / 7);
  const w = pad * 2 + cols * (cell + gap) - gap;
  const tall = head + 7 * (cell + gap) - gap + foot;
  const cv = document.createElement('canvas');
  const k = 3; // retina; the file is still well under 300 KB
  cv.width = w * k; cv.height = tall * k;
  const c = cv.getContext('2d');
  c.scale(k, k);
  const dark = isDark();
  const font = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif';
  c.fillStyle = dark ? '#101012' : '#ffffff';
  c.fillRect(0, 0, w, tall);

  c.fillStyle = dark ? '#ffffff' : '#000000';
  c.font = `600 20px ${font}`;
  c.fillText(h.name, pad, pad + 20); // the image carries the name; an emoji would print in the OS's own style
  const st = streakOf(h), r = R.completionRate(h, logValue, today(), 30);
  c.fillStyle = dark ? '#98989f' : '#6c6c70';
  c.font = `14px ${font}`;
  c.fillText(`${st} day streak · ${Math.round(r.rate * 100)}% of the last 30 days`, pad, pad + 44);

  const g = R.goalOf(h);
  let i = 0;
  for (let key = gridStart(); key <= today(); key = R.addDays(key, 1), i++) {
    const f = R.fraction(logValue(h.id, key), g);
    const off = !R.isScheduled(h, key);
    c.globalAlpha = f > 0 ? 0.28 + f * 0.72 : 1;
    c.fillStyle = f > 0 ? h.color : dark ? (off ? '#171719' : '#242426') : (off ? '#f6f7f9' : '#e9ecf1');
    fillRound(c, pad + Math.floor(i / 7) * (cell + gap), head + (i % 7) * (cell + gap), cell, cell, 3);
  }
  c.globalAlpha = 1;
  c.fillStyle = dark ? '#48484a' : '#b4b4bc';
  c.font = `12px ${font}`;
  c.fillText('Project 1%', pad, tall - pad + 8);

  cv.toBlob(b => {
    if (b) download(`${(h.name || 'habit').replace(/[^\w]+/g, '-').toLowerCase()}.png`, b, 'image/png');
    else toast('This browser could not render the image.');
  }, 'image/png');
}

/** Areas you have written a goal in but logged nothing towards. Covey's "sharpen the
    saw" made checkable: the neglected dimension is usually what breaks the others. */
function silentAreas() {
  const d = today();
  return liveGoals().map(g => g.area).filter((a, i, all) => all.indexOf(a) === i).map(area => {
    const hs = liveHabits().filter(h => h.area === area);
    let days = 0;
    while (days < 30 && !hs.some(h => logValue(h.id, R.addDays(d, -days)) > 0)) days++;
    return { area, days };
  }).filter(x => x.days >= 10).sort((a, b) => b.days - a.days);
}
